<title>Doodle Puff</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen app. Top bar (back, name, undo/redo, the big "make it 3D" button), a square sheet of
   paper in the middle, and a crayon tray at the bottom within thumb reach. The 3D view replaces the paper
   and its own tray holds the print options. */
:root{
  --bg:#EEF3E8; --panel:#FFFFFF; --ink:#1F2A22; --muted:#5F6E62; --line:#D5DECF;
  --paper:#FFFDF6; --paper-dot:#E6E2D3; --accent:#FF6B4A; --accent-ink:#FFFFFF; --sel:#1F2A22; --sel-ink:#FFFFFF;
  --stage:#DCE6D3; --good:#1E9E6A; --warn:#B86A00;
  --shadow:0 2px 6px rgba(31,42,34,.08),0 10px 30px rgba(31,42,34,.10);
  --f-display:"Baloo 2","Nunito",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121915; --panel:#1C2620; --ink:#EAF2EA; --muted:#A5B4A8; --line:#2E3B32;
  --paper:#FFFDF6; --paper-dot:#E6E2D3; --accent:#FF7A5C; --accent-ink:#1A0D08; --sel:#EAF2EA; --sel-ink:#121915;
  --stage:#18221C; --good:#47D196; --warn:#F2B04B;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915; --panel:#1C2620; --ink:#EAF2EA; --muted:#A5B4A8; --line:#2E3B32;
  --paper:#FFFDF6; --paper-dot:#E6E2D3; --accent:#FF7A5C; --accent-ink:#1A0D08; --sel:#EAF2EA; --sel-ink:#121915;
  --stage:#18221C; --good:#47D196; --warn:#F2B04B;
  --shadow:0 2px 6px rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0 auto 0 2px;letter-spacing:-.01em;white-space:nowrap}
.bar h1 span{color:var(--accent)}
.ibtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none;text-decoration:none;color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn svg{width:22px;height:22px}
.pill{height:42px;border-radius:14px;padding:0 16px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;flex:none;box-shadow:var(--shadow)}
.pill.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.pill:disabled{opacity:.5;cursor:default}
.pill svg{width:20px;height:20px}
@media (max-width:460px){.bar h1{font-size:18px}.pill .lbl-s{display:none}}

.stage{position:relative;flex:1;min-height:0;margin-left:max(16px,env(safe-area-inset-left,0px));margin-right:max(16px,env(safe-area-inset-right,0px));border-radius:22px;overflow:hidden;background:var(--stage);display:grid;place-items:center}
.paper{position:relative;width:min(100%,100cqh);aspect-ratio:1;max-width:100%;max-height:100%;border-radius:18px;box-shadow:var(--shadow);
  background-color:var(--paper);background-image:radial-gradient(var(--paper-dot) 1.2px,transparent 1.3px);background-size:22px 22px;overflow:hidden}
.stage{container-type:size}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.view3d{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 20%,var(--panel) 0%,var(--stage) 75%)}
.view3d canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;font-size:12.5px;font-weight:700;color:var(--muted);background:color-mix(in srgb,var(--panel) 86%,transparent);padding:5px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.busy{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 60%,transparent);font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;padding:20px}
.busy .blob{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--accent);animation:puff 1.1s ease-in-out infinite}
@keyframes puff{0%,100%{transform:scale(.7);border-radius:50%}50%{transform:scale(1);border-radius:44% 56% 52% 48%}}
@media (prefers-reduced-motion:reduce){.busy .blob{animation:none}}

.dock{padding-block:10px 12px;display:grid;gap:9px}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row::-webkit-scrollbar{display:none}
.tool{flex:1 1 0;max-width:84px;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:12px}
.tool svg{width:28px;height:28px}
.tool[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.sizes{display:flex;gap:6px;flex:none}
.size{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center}
.size i{display:block;border-radius:50%;background:currentColor}
.size[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.sw{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sel);transform:scale(1.08)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slider{display:flex;align-items:center;gap:8px;min-width:0}
.slider label{font-weight:800;font-size:13px;color:var(--muted);min-width:66px}
.slider input{flex:1;accent-color:var(--accent);height:28px;min-width:0}
.slider output{font-weight:800;font-size:13px;min-width:48px;text-align:right;font-variant-numeric:tabular-nums}
.toggles{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.toggle{height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-weight:800;font-size:13px}
.toggle[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink);border-color:var(--sel)}
.bodycol{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bodycol span{font-weight:800;font-size:13px;color:var(--muted);margin-right:2px}
.bodycol .sw{width:30px;height:30px;border-width:2px}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.note{font-size:12.5px;line-height:1.45;font-weight:700}
.note.ok{color:var(--good)} .note.warn{color:var(--warn)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actions .msg{font-size:13px;font-weight:700;color:var(--muted);min-width:0;flex:1 1 180px}
details.safe{font-size:12.5px;line-height:1.5;color:var(--muted);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
details.safe summary{font-weight:800;color:var(--ink);cursor:pointer}
details.safe ul{margin:4px 0 0;padding-left:18px}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,16,12,.5);display:grid;place-items:end center;padding-top:env(safe-area-inset-top,0px)}
.card{background:var(--panel);width:100%;max-width:520px;border-radius:24px 24px 0 0;max-height:92%;overflow:auto;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:700px){.sheet{place-items:center}.card{border-radius:24px}}
.card h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;line-height:1.1}
.card p{margin:0;color:var(--muted);line-height:1.5}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpl{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:8px;display:grid;gap:4px;justify-items:center;font-weight:800;font-size:13px}
.tpl canvas{width:100%;aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--paper)}
.cardrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
</style>

<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" aria-label="Back to the shop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Doodle <span>Puff</span></h1>
    <button class="ibtn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="ibtn" id="redo" aria-label="Redo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
    <button class="pill" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg><span id="goLbl">Make it 3D</span></button>
  </header>

  <main class="stage" id="stage">
    <div class="paper" id="paper">
      <canvas id="draw" width="512" height="512" aria-label="Drawing paper"></canvas>
    </div>
    <div class="view3d" id="view3d" hidden><canvas id="c3d"></canvas></div>
    <div class="hint" id="hint"></div>
    <div class="busy" id="busy" hidden><div><div class="blob"></div><span id="busyMsg"></span></div></div>
  </main>

  <section class="dock" id="drawDock">
    <div class="row" id="tools"></div>
    <div class="row" id="swatches"></div>
  </section>

  <section class="dock" id="printDock" hidden>
    <div class="opts">
      <div class="slider"><label for="puff" id="lPuff">Puffiness</label><input id="puff" type="range" min="2" max="9" step="0.5" value="5"><output id="puffVal">5 mm</output></div>
      <div class="slider"><label for="size" id="lSize">Size</label><input id="size" type="range" min="50" max="140" step="5" value="80"><output id="sizeVal">80 mm</output></div>
      <div class="bodycol" id="bodycol"><span id="lBody">Paper colour</span></div>
      <div class="toggles">
        <button class="toggle" id="loop" aria-pressed="false">Keyring loop</button>
        <button class="toggle" id="fine" aria-pressed="false">Extra smooth</button>
      </div>
    </div>
    <div class="opts"><div class="stats" id="stats"></div><div class="note" id="note"></div></div>
    <div class="actions">
      <button class="pill ghost" id="redraw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8l-3-3L5 16z"/></svg><span id="redrawLbl">Keep drawing</span></button>
      <button class="pill" id="download" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span id="dlLbl">Download print files</span></button>
      <span class="msg" id="msg" role="status"></span>
    </div>
    <details class="safe"><summary id="safeTitle">Safety for kids</summary><ul id="safeList"></ul></details>
  </section>
</div>

<div class="sheet" id="tplSheet" hidden role="dialog" aria-modal="true" aria-labelledby="tplTitle">
  <div class="card">
    <h2 id="tplTitle">Pick a picture to colour</h2>
    <p id="tplText">It replaces what is on the paper. You can undo.</p>
    <div class="tpls" id="tpls"></div>
    <div class="cardrow"><button class="pill ghost" id="tplClose">Close</button></div>
  </div>
</div>
<div class="sheet" id="clearSheet" hidden role="dialog" aria-modal="true" aria-labelledby="clearTitle">
  <div class="card">
    <h2 id="clearTitle">Start a new drawing?</h2>
    <p id="clearText">The paper will be wiped clean. You can undo.</p>
    <div class="cardrow"><button class="pill ghost" id="clearNo">Cancel</button><button class="pill" id="clearYes">Wipe the paper</button></div>
  </div>
</div>

<script id="doodle-core">/*DOODLE*/</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
/* ---------- words ---------- */
const T = {
  vi: { go: "Thành 3D", busy: "Đang thổi phồng tranh…", redraw: "Vẽ tiếp", dl: "Tải file in", puff: "Độ phồng", size: "Kích thước", body: "Màu phần trống",
        loop: "Móc khoá", fine: "Mịn hơn", safeTitle: "An toàn cho bé",
        safe: ["Dành cho bé từ 3 tuổi, có người lớn giám sát.", "Tranh in thành một miếng liền, không có chi tiết rời.", "Không gắn nam châm nhỏ: bé có thể nuốt.", "Không cho bé ngậm hay cắn. Chà nhẹ chỗ sắc sau khi in."],
        tools: { pen: "Bút sáp", fill: "Tô màu", eye: "Mắt", eraser: "Tẩy", tpl: "Tranh mẫu", clear: "Giấy mới" },
        hints: { pen: "Vẽ con vật hoặc hình bé thích · nét vẽ sẽ nổi lên", fill: "Chạm vào bên trong hình để tô màu", eye: "Chạm để dán mắt tròn xoe",
                 eraser: "Kéo để tẩy", view: "Kéo để xoay · chụm 2 ngón để phóng to" },
        leak: "Hình còn hở nên màu sẽ tràn ra ngoài. Nối kín nét vẽ rồi tô lại nhé!", empty: "Giấy còn trống. Bé vẽ gì đó trước đã!",
        statSize: "Kích thước", statPla: "Nhựa PLA", statCols: "Màu", ok: "Đã kiểm tra: khối kín, in được ngay.", notOk: "Còn chỗ hở. Thử đổi Độ phồng hoặc vẽ nét dày hơn.",
        dropped: n => `${n} hình rời không dính vào hình chính nên sẽ không được in. Hãy vẽ nối chúng lại.`,
        many: n => `${n} màu: máy có 1 AMS (4 khe) cần gộp bớt màu khi nhập vào Bambu Studio.`,
        preparing: "Đang chuẩn bị file…", saved: "Đã lưu. Kéo file .obj vào Bambu Studio, máy tự gán màu cho từng cuộn nhựa.", declined: "Đã huỷ tải.", noSave: "Trình xem này không lưu được file.",
        no3d: "Không tải được trình xem 3D, nhưng vẫn tải được file in.",
        tplTitle: "Chọn tranh để tô", tplText: "Tranh mẫu sẽ thay cho giấy hiện tại. Có thể hoàn tác.", close: "Đóng",
        clearTitle: "Bắt đầu tranh mới?", clearText: "Giấy sẽ được xoá sạch. Có thể hoàn tác.", cancel: "Huỷ", wipe: "Xoá giấy",
        tpls: ["Cá", "Ngôi sao", "Mèo"], cols: ["Mực", "Đỏ", "Cam", "Vàng", "Lá", "Trời", "Tím", "Hồng", "Nâu", "Trắng"] },
  en: { go: "Make it 3D", busy: "Puffing up the drawing…", redraw: "Keep drawing", dl: "Download print files", puff: "Puffiness", size: "Size", body: "Empty areas",
        loop: "Keyring loop", fine: "Extra smooth", safeTitle: "Safety for kids",
        safe: ["For ages 3 and up, with an adult nearby.", "The drawing prints as one solid piece with no loose parts.", "Don't glue small magnets on: children can swallow them.", "Not for mouthing or chewing. Sand any sharp spots after printing."],
        tools: { pen: "Crayon", fill: "Fill", eye: "Eyes", eraser: "Eraser", tpl: "Pictures", clear: "New paper" },
        hints: { pen: "Draw an animal or any shape · crayon lines come out raised", fill: "Tap inside a shape to colour it", eye: "Tap to stick on googly eyes",
                 eraser: "Drag to erase", view: "Drag to turn · pinch to zoom" },
        leak: "The shape has a gap, so the colour would spill out. Close the line and try again!", empty: "The paper is empty. Draw something first!",
        statSize: "Size", statPla: "PLA", statCols: "Colours", ok: "Checked: closed solid, ready to print.", notOk: "Some gaps remain. Try another puffiness or thicker lines.",
        dropped: n => `${n} separate shape${n > 1 ? "s" : ""} not touching the main drawing won't be printed. Join them with a line.`,
        many: n => `${n} colours: with one AMS (4 slots), merge some colours when importing into Bambu Studio.`,
        preparing: "Preparing files…", saved: "Saved. Drag the .obj into Bambu Studio and it matches each colour to a filament.", declined: "Download cancelled.", noSave: "This viewer can't save files.",
        no3d: "The 3D viewer didn't load, but the print files still download.",
        tplTitle: "Pick a picture to colour", tplText: "It replaces what is on the paper. You can undo.", close: "Close",
        clearTitle: "Start a new drawing?", clearText: "The paper will be wiped clean. You can undo.", cancel: "Cancel", wipe: "Wipe the paper",
        tpls: ["Fish", "Star", "Cat"], cols: ["Ink", "Red", "Orange", "Sun", "Leaf", "Sky", "Lilac", "Pink", "Brown", "White"] }
};
const LANG = /^vi/i.test(navigator.language || "") || /lang=vi/.test(location.hash) ? "vi" : "en";
const t = k => T[LANG][k];

/* ---------- palette (label 0 = paper) ---------- */
const PAL = [null, "#24283A", "#E8483B", "#FF9B3D", "#FFD24C", "#5CBF6A", "#4FA8E8", "#9B6BD6", "#F7A1B5", "#A86B45", "#FFFFFF"];
const NAMES = [null, "ink", "red", "orange", "sun", "leaf", "sky", "lilac", "pink", "brown", "white"];
const RGB = PAL.map(h => h ? [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)] : null);

/* ---------- drawing state ---------- */
const W = 512, H = 512;
let lab = new Uint8Array(W * H), bump = new Float32Array(W * H);
let tool = "pen", colour = 1, sizeIx = 1, bodyLabel = 10;
const SIZES = [5, 9, 15];               // crayon radius in pixels (paper is 512 px wide)
const cv = $("#draw"), ctx = cv.getContext("2d"), img = ctx.createImageData(W, H);
function paint(x0, y0, x1, y1) {        // redraw a region of the paper from the label raster
  x0 = Math.max(0, x0 | 0); y0 = Math.max(0, y0 | 0); x1 = Math.min(W - 1, x1 | 0); y1 = Math.min(H - 1, y1 | 0);
  const d = img.data;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const p = x + W * y, l = lab[p], o = 4 * p;
    if (!l) { d[o + 3] = 0; continue; }
    // a touch of shading on raised parts so children see where the relief will be
    const s = 1 - Math.min(0.12, bump[p] * 0.08) + (bump[p] > 0.9 ? 0.06 : 0);
    d[o] = Math.min(255, RGB[l][0] * s); d[o + 1] = Math.min(255, RGB[l][1] * s); d[o + 2] = Math.min(255, RGB[l][2] * s); d[o + 3] = 255;
  }
  ctx.putImageData(img, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
}
const paintAll = () => paint(0, 0, W - 1, H - 1);

/* undo: compact snapshots (labels + relief in 0.01 mm steps) */
const undo = [], redo = [];
const snap = () => ({ l: lab.slice(), b: Uint8Array.from(bump, v => Math.round(v * 100)) });
const restore = s => { lab = s.l.slice(); bump = Float32Array.from(s.b, v => v / 100); paintAll(); };
function pushUndo() { undo.push(snap()); if (undo.length > 30) undo.shift(); redo.length = 0; syncUndo(); }
function syncUndo() { $("#undo").disabled = !undo.length; $("#redo").disabled = !redo.length; }
$("#undo").onclick = () => { if (!undo.length) return; redo.push(snap()); restore(undo.pop()); syncUndo(); saveDraft(); };
$("#redo").onclick = () => { if (!redo.length) return; undo.push(snap()); restore(redo.pop()); syncUndo(); saveDraft(); };

/* per-viewer draft so a child's picture survives a reload */
let draftTimer = 0;

const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, 1, 1, 5000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8f9a90, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.3); key.position.set(-1.2, 1.6, 2.2); scene.add(key);
const fillL = new THREE.DirectionalLight(0xffffff, 0.6); fillL.position.set(1.5, -0.4, 1); scene.add(fillL);
const controls = new OrbitControls(cam, canvas); controls.enableDamping = true;
let mesh = null, framed = false;
function resize() { const r = holder.getBoundingClientRect(); if (!r.width) return; renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(holder);
(function loop() { controls.update(); if (!holder.hidden) renderer.render(scene, cam); requestAnimationFrame(loop); })();
window.Viewer3D = {
  resize,
  show(r, PAL) {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(r.pos, 3)); g.setIndex(new THREE.BufferAttribute(r.idx, 1));
    g.computeVertexNormals();
    const ng = g.toNonIndexed(), nf = r.faceLab.length, col = new Float32Array(nf * 9), c = new THREE.Color();
    for (let f = 0; f < nf; f++) { c.set(PAL[r.faceLab[f]]); for (let k = 0; k < 3; k++) { col[9 * f + 3 * k] = c.r; col[9 * f + 3 * k + 1] = c.g; col[9 * f + 3 * k + 2] = c.b; } }
    ng.setAttribute("color", new THREE.BufferAttribute(col, 3)); g.dispose();
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    mesh = new THREE.Mesh(ng, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0 }));
    ng.computeBoundingBox(); const bb = ng.boundingBox, ctr = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
    mesh.position.set(-ctr.x, -ctr.y, -ctr.z); scene.add(mesh);
    resize();
    if (!framed) {   // fit the whole piece with a margin, whatever the screen shape
      const tn = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)), d = Math.max(s.y / (2 * tn), s.x / (2 * tn * cam.aspect)) * 1.35 + s.z;
      const dir = new THREE.Vector3(-0.3, -0.2, 0.93).normalize();
      cam.position.copy(dir.multiplyScalar(d)); cam.near = d / 100; cam.far = d * 20; cam.updateProjectionMatrix(); controls.target.set(0, 0, 0); framed = true;
    }
  }
};
