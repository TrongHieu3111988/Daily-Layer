<script>
/* Daily Layer game kit: words, sound, confetti and the "toy friends" every game draws. */

  /* ---------- words ---------- */
  // English first; Vietnamese on Vietnamese devices, or whatever was last picked in the shop or any game (one shared setting)
  K.lang = (() => { let v = ""; try { v = (localStorage.getItem("dl-lang") || "").replace(/"/g, ""); } catch (e) {} return v === "vi" || v === "en" ? v : /^vi/i.test(navigator.language || "") ? "vi" : "en"; })();

  K.applyWords = () => {
    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });
    const b = document.getElementById("langBtn"); if (b) b.textContent = K.lang === "vi" ? "EN" : "VI";
    K.onLang && K.onLang();
  };
  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

  /* ---------- sound: tiny synth blips, only after the child has touched the screen ---------- */
  let ac = null; K.muted = store.get("dl-muted", false);
  function ctx() { if (K.muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }

    const a = ctx(); if (!a) return;

    pop: () => tone(520, 880, 0.12, "triangle", 0.16),
    thud: () => tone(180, 90, 0.14, "sine", 0.22),
    boing: () => { tone(300, 120, 0.25, "square", 0.06); tone(150, 260, 0.2, "sine", 0.12, 0.05); },

      const d = cc.width / innerWidth; cg.clearRect(0, 0, cc.width, cc.height);

    else if (shape === "tri") { g.moveTo(0, -h / 2); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.closePath(); }

  /* Each block colour belongs to one of the shop's animals, so a colour still means the same friend in every puzzle.
     The block keeps its shape (the physics and the puzzles use it); the animal is painted on: ears, patches, nose, beak. */
  K.ANIMALS = {
    fox: { ears: "point", tip: "#1B2547", inner: "#FFE3D6", muzzle: "#FFFFFF", nose: true },
    chick: { tuft: true, belly: "#FFE58A", beak: "#FF9B3D" },
    frog: { bumps: true, belly: "#BFF0C9", wide: true },
    whale: { spout: true, belly: "#D6EEFF", lines: true },
    penguin: { mask: "#FFFFFF", beak: "#FFB13D" },
    axolotl: { gills: "#E0457B", spots: "#FF6FA0" },
    kitten: { ears: "point", inner: "#FFC4D6", stripes: "rgba(27,37,71,.32)", nose: "#FF8FB8", whiskers: true },
    bear: { ears: "round", inner: "#E8C9A0", muzzle: "#E8C9A0", nose: true },
    bunny: { ears: "long", inner: "#FFC4D6", nose: "#FF8FB8", whiskers: true }
  };
  K.ANIMAL_OF = { "#ff6b57": "fox", "#ffc93c": "chick", "#3fbf7f": "frog", "#5db8ff": "whale", "#8c6bf2": "penguin", "#ff8fb8": "axolotl",
    "#ff9b3d": "kitten", "#b8834f": "bear", "#f4effa": "bunny", "#7fe0c2": "frog" };

    const u = Math.min(1, Math.abs(x) / (w / 2));

    count = onTower; document.getElementById("count").textContent = count;
    if (count >= milestone + 5) { milestone = Math.floor(count / 5) * 5; K.sfx.tada(); K.confetti(); toast(K.t("milestone", milestone)); }
  }
  // camera follows the tower top
  const want = Math.min(-(viewH - 120), top - viewH * 0.52);
  camTop += (want - camTop) * Math.min(1, dt / 400);
  draw(now);
  if (hearts <= 0) return gameOver();
  requestAnimationFrame(frame);
}
function gameOver() {
  running = false;
  let top = 0; for (const b of pieces) if (b.state === "rest") top = Math.min(top, b.bounds.min.y);
  const cm = Math.round(-top / 10), newBest = count > best; if (newBest) { best = count; K.store.set("stack-best", best); }
  const stars = count >= 15 ? 3 : count >= 8 ? 2 : count >= 3 ? 1 : 0;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", count);
  document.getElementById("overP").textContent = K.t("overP", count, cm, best);
  setTimeout(() => { document.getElementById("over").hidden = false; if (stars) { K.sfx.tada(); K.confetti(); } document.getElementById("againBtn").focus(); }, 700);
}

/* ---------- drawing ---------- */
function draw(now = performance.now()) {
  const W = cv.width, H = cv.height; g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  g.setTransform(scale, 0, 0, scale, 0, -camTop * scale);
  const top = camTop, bot = camTop + viewH;
  // clouds drift by slowly (parallax)
  g.fillStyle = "rgba(255,255,255,.75)";
  for (let i = 0; i < 6; i++) { const cy = Math.floor((top - 200) / 260) * 260 + i * 260 * 0.5 + 40, cx = ((i * 137 + now * 0.004) % (VW + 160)) - 80;
    if (cy < top - 60 || cy > bot + 60) continue; g.beginPath(); g.ellipse(cx, cy, 46, 14, 0, 0, 7); g.ellipse(cx - 18, cy - 10, 18, 14, 0, 0, 7); g.ellipse(cx + 12, cy - 14, 22, 18, 0, 0, 7); g.fill(); }
  // height marks every 10 cm
  g.font = "800 11px Nunito, sans-serif"; g.textAlign = "left";
  for (let y = 0; y > top - 100; y -= 100) { if (y > bot) continue; g.strokeStyle = "rgba(27,37,71,.18)"; g.lineWidth = 2; g.setLineDash([6, 6]); g.beginPath(); g.moveTo(0, y); g.lineTo(28, y); g.stroke(); g.setLineDash([]);
    if (y < 0) { g.fillStyle = "rgba(27,37,71,.45)"; g.fillText(Math.round(-y / 10) + " cm", 4, y - 4); } }
  // grass and table
  g.fillStyle = "#7ED69A"; g.fillRect(-10, FLOOR_Y, VW + 20, 400);
  g.fillStyle = "#5CC27F"; for (let x = -10; x < VW + 20; x += 18) { g.beginPath(); g.ellipse(x, FLOOR_Y, 12, 7, 0, Math.PI, 0); g.fill(); }
  g.fillStyle = "#C98E4F"; g.strokeStyle = K.INK; g.lineWidth = 3;
  for (const lx of [VW / 2 - TABLE_W / 2 + 16, VW / 2 + TABLE_W / 2 - 30]) { g.beginPath(); g.roundRect(lx, 20, 14, FLOOR_Y - 20, 4); g.fill(); g.stroke(); }
  g.fillStyle = "#E9B97A"; g.beginPath(); g.roundRect(VW / 2 - TABLE_W / 2, 0, TABLE_W, 28, 8); g.fill(); g.stroke();
  g.fillStyle = "rgba(255,255,255,.35)"; g.fillRect(VW / 2 - TABLE_W / 2 + 10, 5, TABLE_W - 20, 5);
  // friends
  for (const b of pieces) {
    if (b.state === "gone") continue;
    const alpha = b.state === "fallen" ? Math.max(0, 1 - (now - b.fellAt) / 900) : 1;
    const mood = b.state === "fallen" ? "sad" : b.state === "fall" ? "wow" : (b.isSleeping && ((b.id * 7 + (now / 2400 | 0)) % 9 === 0) ? "sleepy" : "happy");
    g.save(); g.globalAlpha = alpha; g.translate(b.position.x, b.position.y); g.rotate(b.angle); g.translate(-b.off.x, -b.off.y);
    K.friend(g, { ...b.kind, mood, lw: 3 }); g.restore();
  }
  // crane
  if (running || held) {
    const cx = craneX(), cy = camTop + CRANE_Y;
    g.strokeStyle = K.INK; g.lineWidth = 4; g.fillStyle = "#FFC93C";
    g.beginPath(); g.roundRect(-10, cy - 14, VW + 20, 12, 6); g.fill(); g.stroke();
    g.beginPath(); g.roundRect(cx - 22, cy - 22, 44, 26, 8); g.fillStyle = "#FF6B57"; g.fill(); g.stroke();
    g.beginPath(); g.moveTo(cx, cy + 4); g.lineTo(cx, cy + 50); g.stroke();
    g.beginPath(); g.moveTo(cx - 14, cy + 62); g.quadraticCurveTo(cx, cy + 44, cx + 14, cy + 62); g.stroke();
    if (held) { g.save(); g.translate(cx, cy + 62 + held.h / 2 + 2); g.rotate(Math.cos(swing) * 0.06); K.friend(g, { ...held, mood: "happy", lw: 3 }); g.restore(); }
  }
}

/* ---------- boot ---------- */
K.initBar();
// every model in the shop's library becomes a block friend (falls back to the painted animals offline)
K.library().then(list => { if (list.length >= 3) { COLS = list.map(t => t.slug); if (!running) { nextKind = null; draw(); } } });
K.onLang = () => { document.getElementById("bestLine").textContent = best ? K.t("best", best) : ""; };
K.applyWords();
(function introArt() {
  const c = document.getElementById("introArt"), x = c.getContext("2d");
  const items = [[200, 230, { shape: "square", w: 150, h: 46, colour: "#5DB8FF" }], [190, 175, { shape: "square", w: 70, h: 66, colour: "#FFC93C" }], [205, 112, { shape: "tri", w: 76, h: 60, colour: "#FF6B57" }], [300, 210, { shape: "dome", w: 66, h: 54, colour: "#3FBF7F" }]];
  for (const [px, py, k] of items) { x.save(); x.translate(px, py); K.friend(x, { ...k, lw: 4 }); x.restore(); }
  K.star(x, 92, 80, 20); K.star(x, 320, 70, 14, "#FF8FB8");
})();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); start(); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); start(); };
draw();
</script>
