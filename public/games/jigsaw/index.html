    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });

  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

    fox: { ears: "point", tip: "#1B2547", inner: "#FFE3D6", muzzle: "#FFFFFF", nose: true },
    chick: { tuft: true, belly: "#FFE58A", beak: "#FF9B3D" },
    frog: { bumps: true, belly: "#BFF0C9", wide: true },
    whale: { spout: true, belly: "#D6EEFF", lines: true },
    penguin: { mask: "#FFFFFF", beak: "#FFB13D" },
    axolotl: { gills: "#E0457B", spots: "#FF6FA0" },
    kitten: { ears: "point", inner: "#FFC4D6", stripes: "rgba(27,37,71,.32)", nose: "#FF8FB8", whiskers: true },
    bear: { ears: "round", inner: "#E8C9A0", muzzle: "#E8C9A0", nose: true },
    bunny: { ears: "long", inner: "#FFC4D6", nose: "#FF8FB8", whiskers: true }
  };
  K.ANIMAL_OF = { "#ff6b57": "fox", "#ffc93c": "chick", "#3fbf7f": "frog", "#5db8ff": "whale", "#8c6bf2": "penguin", "#ff8fb8": "axolotl",

  return { x: x0 - (lay.c - lay.c * lay.TS) / 2, y: y0 - (lay.c - lay.c * lay.TS) / 2 };   // element is full size, scaled about its centre
}
function toTray(o) { const p = trayPos(o); o.el.style.left = p.x + "px"; o.el.style.top = p.y + "px"; o.el.style.transform = `scale(${lay.TS})`; o.el.style.zIndex = 5; }
function place(o) {
  const s = o.slot; o.placed = true; s.piece = o; o.el.classList.remove("drag", "sel"); o.el.classList.add("placed");
  o.el.style.left = lay.bx + s.col * lay.c + "px"; o.el.style.top = lay.by + s.row * lay.c + "px"; o.el.style.transform = "scale(1)"; o.el.style.zIndex = 2;
  s.el.style.visibility = "hidden"; if (sel === o) sel = null;
  total++; document.getElementById("count").textContent = total; K.sfx.chime();
  const r = o.el.getBoundingClientRect(); if (!K.CALM) K.confetti(r.left + r.width / 2, r.top + r.height / 2, 14);
  document.getElementById("tapHint").hidden = true;
  if (pieces.every(x => x.placed)) roundDone();
}
function miss(o, slotObj) {
  wrong++; K.sfx.boing(); o.el.classList.remove("no"); void o.el.offsetWidth; o.el.classList.add("no"); if (slotObj) { slotObj.el.classList.remove("no"); void slotObj.el.offsetWidth; slotObj.el.classList.add("no"); }
  if (wrong % 3 === 0) { o.slot.el.classList.remove("hint"); void o.slot.el.offsetWidth; o.slot.el.classList.add("hint"); toast(K.t("miss")); }
}
function select(o) {
  if (sel) sel.el.classList.remove("sel");
  sel = sel === o ? null : o; if (sel) { sel.el.classList.add("sel"); K.sfx.pop(); }
}
function tapSlot(sl) {
  if (!running || sl.piece || !sel) return;
  if (sel.slot === sl) place(sel); else miss(sel, sl);
}
function wire(o) {
  const el = o.el; let sx = 0, sy = 0, ox = 0, oy = 0, moved = false, id = null;
  el.addEventListener("pointerdown", e => {
    if (!running || o.placed) return; id = e.pointerId; el.setPointerCapture(id); moved = false;
    const r = stage.getBoundingClientRect(); sx = e.clientX; sy = e.clientY; const cr = el.getBoundingClientRect();
    const cx = cr.left + cr.width / 2 - r.left, cy = cr.top + cr.height / 2 - r.top;
    ox = cx - lay.c / 2; oy = cy - lay.c / 2; o.dx = e.clientX - r.left - cx; o.dy = e.clientY - r.top - cy;
    e.preventDefault();
  });
  el.addEventListener("pointermove", e => {
    if (id !== e.pointerId) return;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) < 8) return;
    if (!moved) { moved = true; el.classList.add("drag"); el.style.transform = "scale(1)"; }
    const r = stage.getBoundingClientRect(); el.style.left = (e.clientX - r.left - lay.c / 2 - (o.dx || 0) * 0) + "px"; el.style.top = (e.clientY - r.top - lay.c / 2 - 24) + "px";   // lifted above the finger so it stays visible
  });
  const end = e => {
    if (id !== e.pointerId) return; id = null;
    if (!moved) { select(o); return; }
    el.classList.remove("drag");
    const px = parseFloat(el.style.left) + lay.c / 2, py = parseFloat(el.style.top) + lay.c / 2;
    const gx = lay.bx + o.slot.col * lay.c + lay.c / 2, gy = lay.by + o.slot.row * lay.c + lay.c / 2;
    if (Math.hypot(px - gx, py - gy) < lay.c * 0.62) place(o);
    else {
      const near = slots.find(s => !s.piece && Math.abs(px - (lay.bx + s.col * lay.c + lay.c / 2)) < lay.c / 2 && Math.abs(py - (lay.by + s.row * lay.c + lay.c / 2)) < lay.c / 2);
      toTray(o); if (near) miss(o, near);
    }
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
function roundDone() {
  const name = cur.name;
  if (round < ROUNDS.length - 1) {
    setTimeout(() => { K.confetti(); K.sfx.tada(); toast(K.t("done", name)); }, 300);
    setTimeout(() => { round++; build(); }, 1900);
  } else {
    running = false;
    const newBest = !best || wrong < best; if (newBest) { best = wrong; K.store.set("jigsaw-best", best); }
    const stars = wrong <= 3 ? 3 : wrong <= 9 ? 2 : 1;
    document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
    document.getElementById("overH").textContent = K.t("overH", stars);
    document.getElementById("overP").textContent = K.t("overP", wrong);
    setTimeout(() => { document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus(); }, 1300);
  }
}
function start() {
  round = 0; total = 0; wrong = 0; usedKeys = []; running = true; document.getElementById("count").textContent = "0";
  document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; document.getElementById("tapHint").hidden = false; build();
}
addEventListener("resize", () => { if (running) { const keep = usedKeys.slice(); usedKeys.pop(); build(); usedKeys = keep; } });

/* ---------- boot ---------- */
K.initBar();
K.onLang = () => { document.getElementById("bestLine").textContent = best ? K.t("best", best) : ""; };
K.applyWords();
function introArt() {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  const t = toys[0], u = 96, ox = 52, oy = 40;
  const pic = drawPicture(u * 2, u * 2, t ? { toy: t, colour: t.colour } : { toy: null, colour: PAINTED[0] });
  const im = new Image(); im.onload = () => {
    const pos = [[0, 0, 0, 0, -0.1, 0], [1, 0, 150, 6, 0.08, 0], [0, 1, 20, 150, 0.12, 0], [1, 1, 170, 132, -0.07, 0]];
    for (const [q, r, dx, dy, rot] of pos) {
      const cx = (q === 0 && r === 0 ? ox : q === 1 && r === 0 ? ox + 190 + 0 : q === 0 && r === 1 ? ox + 20 : ox + 190 + 20) , cy = (r === 0 ? oy : oy + 110);
      x.save(); x.translate(cx + 48, cy + 48 - (r ? 0 : 0)); x.rotate(rot); x.beginPath(); x.roundRect(-48 + 0, -48, 96, 96, 12); x.clip();
      const d = im.width / 2; x.drawImage(im, q * d, r * d, d, d, -48, -48, 96, 96); x.restore();
      x.save(); x.translate(cx + 48, cy + 48); x.rotate(rot); x.lineWidth = 4; x.strokeStyle = K.INK; x.beginPath(); x.roundRect(-48, -48, 96, 96, 12); x.stroke(); x.restore();
    }
  }; im.src = pic;
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => { toys = list.filter(t => t.img); introArt(); });
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
