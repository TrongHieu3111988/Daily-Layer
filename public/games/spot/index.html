<script>
/* Daily Layer game kit: words, sound, confetti and the "toy friends" every game draws. */
(function () {
  "use strict";
  const K = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  K.store = store;
  K.CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- words ---------- */
  // English first; Vietnamese on Vietnamese devices, or whatever was last picked in the shop or any game (one shared setting)
  K.lang = (() => { let v = ""; try { v = (localStorage.getItem("dl-lang") || "").replace(/"/g, ""); } catch (e) {} return v === "vi" || v === "en" ? v : /^vi/i.test(navigator.language || "") ? "vi" : "en"; })();
  K.words = { en: {}, vi: {} };
  K.t = (k, ...a) => { const v = K.words[K.lang][k] ?? K.words.en[k] ?? k; return typeof v === "function" ? v(...a) : v; };
  K.applyWords = () => {
    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });
    const b = document.getElementById("langBtn"); if (b) b.textContent = K.lang === "vi" ? "EN" : "VI";
    K.onLang && K.onLang();
  };
  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

  /* ---------- sound: tiny synth blips, only after the child has touched the screen ---------- */
  let ac = null; K.muted = store.get("dl-muted", false);
  function ctx() { if (K.muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }
  function tone(f0, f1, dur, type = "sine", vol = 0.18, delay = 0) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  K.sfx = {
    pop: () => tone(520, 880, 0.12, "triangle", 0.16),
    thud: () => tone(180, 90, 0.14, "sine", 0.22),
    boing: () => { tone(300, 120, 0.25, "square", 0.06); tone(150, 260, 0.2, "sine", 0.12, 0.05); },
    chime: () => { [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, 0.22, "triangle", 0.12, i * 0.07)); },
    tada: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.3, "triangle", 0.14, i * 0.09)); },
    tick: () => tone(1200, 900, 0.04, "square", 0.04)
  };
  K.setMuted = m => { K.muted = m; store.set("dl-muted", m); const b = document.getElementById("soundBtn"); if (b) b.innerHTML = m ? K.ICON.mute : K.ICON.sound; };

  /* ---------- confetti ---------- */
  let cc = null, cg = null, bits = [], craf = 0;
  const CONF = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2", "#FF8FB8"];
  K.confetti = (x, y, n = 60) => {
    if (K.CALM) return;
    if (!cc) { cc = document.createElement("canvas"); cc.id = "confetti"; document.body.appendChild(cc); cg = cc.getContext("2d"); }
    const d = Math.min(devicePixelRatio || 1, 2); cc.width = innerWidth * d; cc.height = innerHeight * d;
    x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 7;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: CONF[i % CONF.length], life: 0 }); }
    if (!craf) craf = requestAnimationFrame(step);
    function step() {
      const d = cc.width / innerWidth; cg.clearRect(0, 0, cc.width, cc.height);
      for (let i = bits.length - 1; i >= 0; i--) { const b = bits[i]; b.life++; b.vy += 0.25; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y > innerHeight + 20 || b.life > 240) { bits.splice(i, 1); continue; }
        cg.save(); cg.translate(b.x * d, b.y * d); cg.rotate(b.r); cg.fillStyle = b.c; cg.fillRect(-b.w * d / 2, -b.h * d / 2, b.w * d, b.h * d); cg.restore(); }
      craf = bits.length ? requestAnimationFrame(step) : 0;
    }
  };

  /* ---------- toy friends: our own little characters, drawn with canvas ---------- */
  K.COLS = { coral: "#FF6B57", sun: "#FFC93C", grass: "#3FBF7F", sky: "#5DB8FF", grape: "#8C6BF2", pink: "#FF8FB8", orange: "#FF9B3D", mint: "#7FE0C2" };
  K.INK = "#1B2547";
  function shapePath(g, shape, w, h) {
    g.beginPath();
    const r = Math.min(w, h) * 0.22;
    if (shape === "ball") { g.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); }
    else if (shape === "tri") { g.moveTo(0, -h / 2); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.closePath(); }
    else if (shape === "dome") { g.moveTo(-w / 2, h / 2); g.lineTo(-w / 2, 0); g.ellipse(0, 0, w / 2, h / 2, 0, Math.PI, 0); g.lineTo(w / 2, h / 2); g.closePath(); }
    else if (shape === "star") { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 0.42 : 1; g.lineTo(Math.cos(a) * w / 2 * rr, Math.sin(a) * h / 2 * rr * 1.05 + h * 0.04); } g.closePath(); }
    else if (shape === "heart") { const s = w / 2; g.moveTo(0, h * 0.42); g.bezierCurveTo(-s * 1.4, -h * 0.05, -s * 0.55, -h * 0.62, 0, -h * 0.2); g.bezierCurveTo(s * 0.55, -h * 0.62, s * 1.4, -h * 0.05, 0, h * 0.42); }
    else { g.roundRect ? g.roundRect(-w / 2, -h / 2, w, h, r) : g.rect(-w / 2, -h / 2, w, h); }
  }
  K.shapePath = shapePath;
  /* Each block colour belongs to one of the shop's animals, so a colour still means the same friend in every puzzle.
     The block keeps its shape (the physics and the puzzles use it); the animal is painted on: ears, patches, nose, beak. */
  K.ANIMALS = {
    fox: { ears: "point", tip: "#1B2547", inner: "#FFE3D6", muzzle: "#FFFFFF", nose: true },
    chick: { tuft: true, belly: "#FFE58A", beak: "#FF9B3D" },
    frog: { bumps: true, belly: "#BFF0C9", wide: true },
    whale: { spout: true, belly: "#D6EEFF", lines: true },
    penguin: { mask: "#FFFFFF", beak: "#FFB13D" },
    axolotl: { gills: "#E0457B", spots: "#FF6FA0" },
    kitten: { ears: "point", inner: "#FFC4D6", stripes: "rgba(27,37,71,.32)", nose: "#FF8FB8", whiskers: true },
    bear: { ears: "round", inner: "#E8C9A0", muzzle: "#E8C9A0", nose: true },

  rocket: t => { if (t < 0.22) return [[-0.36, -0.2], [-0.15, 0.15], [0.2, 0.36]].map((s, i) => i === 1 ? s : [s[0] + (i ? 0 : t * 0.4), s[1] - (i ? t * 0.4 : 0)]); if (t < 0.72) return [[-0.15, 0.15]]; const w = 0.15 * (1 - (t - 0.72) / 0.28); return [[-w, w]]; },
  bunny: t => { if (t < 0.6) { const u = (t - 0.3) / 0.3, w = 0.36 * Math.sqrt(Math.max(0, 1 - u * u * 0.9)); return [[-w, w]]; } const s = 0.09 + 0.02 * Math.sin((t - 0.6) / 0.4 * Math.PI); return [[-0.2 - s / 2, -0.2 + s / 2], [0.2 - s / 2, 0.2 + s / 2]]; },
  tree: t => { const tier = Math.min(2, Math.floor(t * 3)), u = t * 3 - tier, w = (0.44 - tier * 0.1) * (1 - u * 0.75); return t < 0.08 ? [[-0.07, 0.07]] : [[-w, w]]; }
};
const TWO_TOWER = ["cat", "castle", "bunny"];
/* The shop's own toys are printed here too: each toy's front-view icon (toys.json) is cut into layers, so a new model
   in the shop shows up on the printer by itself. Spans are measured in toy heights; renderPrint scales them. */
const TOYP = {};
function toyProfile(t) {
  const N = 160, c = document.createElement("canvas"); c.width = c.height = N; const g = c.getContext("2d"); g.drawImage(t.img, 0, 0, N, N);
  const a = g.getImageData(0, 0, N, N).data, on = (x, y) => a[4 * (x + N * y) + 3] > 110;
  let x0 = N, x1 = -1, y0 = N, y1 = -1;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (on(x, y)) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return null;
  const h = y1 - y0 + 1, cxI = (x0 + x1 + 1) / 2, rows = [];
  for (let y = y1; y >= y0; y--) { const sp = []; let st = -1;
    for (let x = x0; x <= x1 + 1; x++) { const o = x <= x1 && on(x, y); if (o && st < 0) st = x; if (!o && st >= 0) { if (x - st > 1) sp.push([(st - cxI) / h, (x - cxI) / h]); st = -1; } }
    rows.push(sp); }
  const top = rows.slice(Math.floor(rows.length * 0.78), Math.floor(rows.length * 0.95));
  const half = Math.max(...rows.flat().map(([u, v]) => Math.max(-u, v)), 0.01);
  return { c, y0, y1, h, cxI, rows, half, colour: t.colour || "#FF8FB8", twoTower: top.filter(r => r.length >= 2).length > top.length * 0.4, slug: t.slug };
}
K.library().then(list => { for (const t of list) if (t.img) { const pf = toyProfile(t); if (pf) TOYP[t.slug] = pf; } });
const FIL = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2", "#FF8FB8", "#FF9B3D", "#E9EEF7"];
function rng(seed) { let s = seed >>> 0; return () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) + 0x9E3779B9 >>> 0) / 4294967296); }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f))))); return `rgb(${c})`; }

// draws a print on a canvas; returns the area to circle when the defect is found
function renderPrint(cv, p) {
  const d = Math.min(devicePixelRatio || 1, 2.5), r = cv.getBoundingClientRect(); cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
  const g = cv.getContext("2d"), W = cv.width, H = cv.height, R = rng(p.seed);

  const bedY = H * 0.86;
  g.fillStyle = "#2E3550"; g.fillRect(0, bedY, W, H - bedY); g.fillStyle = "#3A4263"; for (let x = 0; x < W; x += W / 14) g.fillRect(x, bedY, W / 28, H - bedY);
  g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(W / 2, bedY + 2, W * 0.36, H * 0.02, 0, 0, Math.PI * 2); g.fill();
  const TP = p.toy && TOYP[p.toy];

  const kk = objH / objW;

  const dfx = p.defect, sev = p.sev;
  const k = Math.floor(L * (0.42 + R() * 0.2));                 // layer where shift / gap / spaghetti starts
  const shiftDx = (sev > 1 ? 0.07 : 0.13) * objW * (R() < 0.5 ? -1 : 1);
  const gapN = sev > 1 ? 1 : 3;
  let hint = { x: W / 2, y: bedY - objH / 2, r: W * 0.3 };
  const holey = new Set(); if (dfx === "under") for (let i = 0; i < L; i++) if (R() < 0.45) holey.add(i);
  for (let i = 0; i < L; i++) {
    const t = (i + 0.5) / L, y = bedY - (i + 1) * lh;
    if (dfx === "spaghetti" && i >= k) break;
    if (dfx === "gap" && i >= k && i < k + gapN) continue;
    let dx = dfx === "shift" && i >= k ? shiftDx : 0;
    for (let [a, b] of prof(t)) {
      let x0 = cx + a * objW + dx, x1 = cx + b * objW + dx;
      if (dfx === "foot" && i < 4) { const e = (4 - i) * W * (sev > 1 ? 0.006 : 0.011); x0 -= e; x1 += e; }
      if (x1 - x0 < 1) continue;
      if (TP) {   // the toy's own colours for this layer, cut from its icon
        const r0 = TP.y1 + 1 - Math.ceil((i + 1) / L * TP.h), r1 = TP.y1 + 1 - Math.floor(i / L * TP.h), sx = TP.cxI + a / kk * TP.h, sw = (b - a) / kk * TP.h;
        g.imageSmoothingEnabled = true; g.drawImage(TP.c, sx, r0, Math.max(0.5, sw), Math.max(0.5, r1 - r0), x0, y, x1 - x0, lh + 0.6);
        if (holey.has(i)) { g.save(); g.globalCompositeOperation = "destination-out"; for (let x = x0 + 4; x < x1; x += 7) g.fillRect(x, y, Math.min(2 + R() * 3, x1 - x), lh + 0.6); g.restore(); }
      } else {
      const gr = g.createLinearGradient(x0, 0, x1, 0); gr.addColorStop(0, shade(p.colour, 0.28)); gr.addColorStop(0.45, p.colour); gr.addColorStop(1, shade(p.colour, -0.28));
      g.fillStyle = gr;
      if (holey.has(i)) { g.globalAlpha = 0.8; for (let x = x0; x < x1; x += 7) g.fillRect(x, y, Math.min(4 + R() * 3, x1 - x), lh + 0.6); g.globalAlpha = 1; }
      else g.fillRect(x0, y, x1 - x0, lh + 0.6);
      }
      g.fillStyle = "rgba(0,0,0,.13)"; g.fillRect(x0, y, x1 - x0, Math.max(1, lh * 0.18));   // the layer line
    }
  }
  if (dfx === "shift") hint = { x: cx + shiftDx * 0.5, y: bedY - (k + 0.5) * lh, r: W * 0.26 };
  if (dfx === "gap") hint = { x: cx, y: bedY - (k + gapN / 2) * lh, r: W * 0.22 };
  if (dfx === "foot") hint = { x: cx, y: bedY - 2 * lh, r: W * 0.28 };
  if (dfx === "under") hint = { x: cx, y: bedY - objH * 0.5, r: W * 0.3 };
  if (dfx === "spaghetti") {
    g.lineWidth = Math.max(1.5, W * 0.008); g.lineCap = "round"; const yk = bedY - k * lh;
    for (let n = 0; n < 34; n++) { g.strokeStyle = shade(p.colour, (R() - 0.5) * 0.5); g.beginPath(); let x = cx + (R() - 0.5) * objW * 0.7, y = yk - R() * objH * 0.35; g.moveTo(x, y);
      for (let s = 0; s < 3; s++) { g.bezierCurveTo(x + (R() - .5) * W * .4, y - R() * H * .15, x + (R() - .5) * W * .4, y + R() * H * .1, (x = cx + (R() - .5) * objW * .8), (y = yk - R() * objH * .4)); } g.stroke(); }
    hint = { x: cx, y: yk - objH * 0.18, r: W * 0.34 };
  }
  if (dfx === "warp") {                                         // corners lifted off the bed
    const spans = prof(0.5 / L), x0 = cx + spans[0][0] * objW, x1 = cx + spans[spans.length - 1][1] * objW, lift = H * (sev > 1 ? 0.022 : 0.035), run = objW * 0.22;
    g.fillStyle = "#F3F6FB";
    for (const [xa, dir] of [[x0, 1], [x1, -1]]) { g.beginPath(); g.moveTo(xa - dir * 2, bedY + 1); g.lineTo(xa - dir * 2, bedY - lift); g.quadraticCurveTo(xa + dir * run * 0.4, bedY - lift * 0.15, xa + dir * run, bedY + 1); g.closePath(); g.fill();
      g.strokeStyle = shade(p.colour, -0.35); g.lineWidth = 2; g.beginPath(); g.moveTo(xa, bedY - lift); g.quadraticCurveTo(xa + dir * run * 0.4, bedY - lift * 0.15, xa + dir * run, bedY); g.stroke(); }
    g.fillStyle = "#2E3550"; g.fillRect(0, bedY, W, 3);
    hint = { x: x0 + objW * 0.06, y: bedY - lift, r: W * 0.2 };
  }
  if (dfx === "blobs") {
    const n = sev > 1 ? 6 : 10;
    for (let b = 0; b < n; b++) { const i = 3 + Math.floor(R() * (L - 8)), sp = prof((i + .5) / L), [a, c] = sp[Math.floor(R() * sp.length)], side = R() < 0.6;
      const x = side ? cx + (R() < 0.5 ? a : c) * objW : cx + (a + (c - a) * R()) * objW, y = bedY - (i + .5) * lh, rr = W * (sev > 1 ? 0.016 : 0.022) * (0.7 + R() * 0.6);
      g.fillStyle = shade(p.colour, -0.18); g.beginPath(); g.arc(x, y, rr, 0, Math.PI * 2); g.fill(); g.fillStyle = "rgba(255,255,255,.55)"; g.beginPath(); g.arc(x - rr * 0.3, y - rr * 0.3, rr * 0.35, 0, Math.PI * 2); g.fill(); }
  }

    g.strokeStyle = shade(p.colour, p.toy ? -0.45 : -0.1); g.lineWidth = Math.max(1, W * (sev > 1 ? 0.0035 : 0.005));   // darker on a toy so thin strings show
    for (let s = 0; s < (sev > 1 ? 5 : 9); s++) { const y0 = bedY - (L * (0.68 + R() * 0.28)) * lh, y1 = y0 + (R() - 0.3) * lh * 6;
      g.beginPath(); g.moveTo(aR, y0); g.quadraticCurveTo((aR + bL) / 2, Math.max(y0, y1) + lh * (2 + R() * 4), bL, y1); g.stroke(); }
    hint = { x: (aR + bL) / 2, y: bedY - objH * 0.82, r: W * 0.24 };
  }
  // shine across the print
  g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(cx - objW * 0.2, top, objW * 0.06, objH);
  return { ...hint, d };
}

/* ---------- rounds ---------- */
const ROUNDS = 10, EASY = ["spaghetti", "shift", "gap"], MID = ["warp", "string", "shift", "gap"], HARD = ["foot", "blobs", "under", "string", "warp"];
let round = 0, stars = 0, firstTry = true, answer = -1, specs = [], hints = [], used = [];
function setup() {
  const n = round < 3 ? 2 : round < 7 ? 3 : 4, pool = round < 3 ? EASY : round < 7 ? MID : HARD;
  let defect; do { defect = pool[(Math.random() * pool.length) | 0]; } while (used.slice(-2).includes(defect) && pool.length > 2);
  used.push(defect);
  const objs = Object.keys(OBJ), obj = defect === "string" ? TWO_TOWER[(Math.random() * 3) | 0] : objs[(Math.random() * objs.length) | 0];
  let colour = FIL[(Math.random() * FIL.length) | 0], toy = null;
  const toys = Object.values(TOYP).filter(t => defect !== "string" || t.twoTower);
  if (toys.length) { const t = toys[(Math.random() * toys.length) | 0]; toy = t.slug; colour = t.colour; }
  const seed = (Math.random() * 1e9) | 0, sev = round < 3 ? 0 : round < 7 ? 1 : 2;
  answer = (Math.random() * n) | 0; firstTry = true;
  specs = Array.from({ length: n }, (_, i) => ({ obj, toy, colour, seed: seed + i * 7, defect: i === answer ? defect : null, sev }));
  const box = document.getElementById("cards"); box.className = "cards n" + n; box.innerHTML = "";
  specs.forEach((s, i) => { const b = document.createElement("button"); b.className = "pc"; b.type = "button"; b.setAttribute("aria-label", K.t("aria", i + 1, n)); b.innerHTML = "<canvas></canvas>"; b.onclick = () => choose(i, b); box.appendChild(b); });
  document.getElementById("round").textContent = K.t("round", round + 1, ROUNDS);
  document.getElementById("learn").hidden = true;
  requestAnimationFrame(drawAll);
}
function drawAll() { hints = [...document.querySelectorAll(".pc canvas")].map((c, i) => renderPrint(c, specs[i])); }
let ro = new ResizeObserver(() => { if (specs.length) drawAll(); }); ro.observe(document.getElementById("cards"));
function ring(i) {
  const c = document.querySelectorAll(".pc canvas")[i], g = c.getContext("2d"), h = hints[i]; let t = 0;
  (function anim() { if (t > 18) return; t++; renderPrint(c, specs[i]); g.strokeStyle = "#1C9A5E"; g.lineWidth = 5 * h.d; g.setLineDash([12 * h.d, 8 * h.d]);
    g.beginPath(); g.arc(h.x, h.y, h.r * (1.25 - t * 0.014), 0, Math.PI * 2); g.stroke(); g.setLineDash([]); if (!K.CALM) requestAnimationFrame(anim); else { t = 99; } })();
}
function choose(i, el) {
  if (!document.getElementById("learn").hidden) return;
  if (i !== answer) { firstTry = false; el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong"); K.sfx.boing(); toast(K.t("tryAgain")); return; }
  el.classList.add("right"); document.querySelectorAll(".pc").forEach((b, j) => { if (j !== i) b.classList.add("dim"); });
  if (firstTry) { stars++; document.getElementById("starCount").textContent = stars; }
  K.sfx.chime(); const r = el.getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top + r.height / 3, 40);
  ring(i);
  const [name, what, tip] = D[K.lang][specs[i].defect], ch = K.t("cheer");
  document.getElementById("lName").firstChild.textContent = name;
  document.getElementById("lCheer").textContent = ch[(Math.random() * ch.length) | 0];
  document.getElementById("lWhat").textContent = what;
  document.getElementById("lTip").innerHTML = "<b>" + K.t("tip") + "</b>" + tip.replace(/[<>&]/g, "");
  document.getElementById("learn").hidden = false; document.getElementById("nextBtn").focus();
}
document.getElementById("nextBtn").onclick = () => { K.sfx.pop(); round++; if (round >= ROUNDS) return finish(); setup(); };
function finish() {
  const s = stars >= 9 ? 3 : stars >= 6 ? 2 : stars >= 3 ? 1 : 0;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < s)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", stars, ROUNDS);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
  K.store.set("spot-best", Math.max(stars, K.store.get("spot-best", 0)));
}
function start() { round = 0; stars = 0; used = []; document.getElementById("starCount").textContent = "0"; document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; setup(); }
let toastT = 0;
function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (e.hidden = true), 1600); }

/* ---------- boot ---------- */
K.initBar();
K.onLang = () => { if (specs.length) document.getElementById("round").textContent = K.t("round", round + 1, ROUNDS); };
K.applyWords();
(function introArt() {
  const c = document.getElementById("introArt");
  const tmp = document.createElement("canvas"); tmp.style.cssText = "position:absolute;left:-9999px;width:120px;height:160px"; document.body.appendChild(tmp);
  const x = c.getContext("2d");
  const items = [["cat", "#FF8FB8", null, 30], ["castle", "#5DB8FF", "shift", 140], ["rocket", "#FFC93C", null, 250]];
  for (const [obj, col, dfx, px] of items) { renderPrint(tmp, { obj, colour: col, seed: 7, defect: dfx, sev: 0 }); x.drawImage(tmp, px, 40, 120, 160); }
  tmp.remove();
  x.strokeStyle = "#1B2547"; x.lineWidth = 7; x.beginPath(); x.arc(212, 120, 44, 0, Math.PI * 2); x.stroke(); x.lineWidth = 10; x.lineCap = "round"; x.beginPath(); x.moveTo(244, 152); x.lineTo(272, 182); x.stroke();
})();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL : "/#play";
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };   // the shop's toys are ready before the first print
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
