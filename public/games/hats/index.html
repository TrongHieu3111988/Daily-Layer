<script>
/* Daily Layer game kit: words, sound, confetti and the "toy friends" every game draws. */
(function () {
  "use strict";
  const K = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  K.store = store;
  K.CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- words ---------- */
  // English first; Vietnamese on Vietnamese devices, or whatever was last picked in the shop or any game (one shared setting)
  K.lang = (() => { let v = ""; try { v = (localStorage.getItem("dl-lang") || "").replace(/"/g, ""); } catch (e) {} return v === "vi" || v === "en" ? v : /^vi/i.test(navigator.language || "") ? "vi" : "en"; })();
  K.words = { en: {}, vi: {} };
  K.t = (k, ...a) => { const v = K.words[K.lang][k] ?? K.words.en[k] ?? k; return typeof v === "function" ? v(...a) : v; };
  K.applyWords = () => {
    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });
    const b = document.getElementById("langBtn"); if (b) b.textContent = K.lang === "vi" ? "EN" : "VI";
    K.onLang && K.onLang();
  };
  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

  /* ---------- sound: tiny synth blips, only after the child has touched the screen ---------- */
  let ac = null; K.muted = store.get("dl-muted", false);
  function ctx() { if (K.muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }
  function tone(f0, f1, dur, type = "sine", vol = 0.18, delay = 0) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  K.sfx = {
    pop: () => tone(520, 880, 0.12, "triangle", 0.16),
    thud: () => tone(180, 90, 0.14, "sine", 0.22),
    boing: () => { tone(300, 120, 0.25, "square", 0.06); tone(150, 260, 0.2, "sine", 0.12, 0.05); },
    chime: () => { [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, 0.22, "triangle", 0.12, i * 0.07)); },
    tada: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.3, "triangle", 0.14, i * 0.09)); },
    tick: () => tone(1200, 900, 0.04, "square", 0.04),
    note: f => { tone(f, f, 0.42, "triangle", 0.16); tone(f * 2, f * 2, 0.25, "sine", 0.04); }
  };
  K.setMuted = m => { K.muted = m; store.set("dl-muted", m); const b = document.getElementById("soundBtn"); if (b) b.innerHTML = m ? K.ICON.mute : K.ICON.sound; };

  /* ---------- confetti ---------- */
  let cc = null, cg = null, bits = [], craf = 0;
  const CONF = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2", "#FF8FB8"];
  K.confetti = (x, y, n = 60) => {
    if (K.CALM) return;
    if (!cc) { cc = document.createElement("canvas"); cc.id = "confetti"; document.body.appendChild(cc); cg = cc.getContext("2d"); }
    const d = Math.min(devicePixelRatio || 1, 2); cc.width = innerWidth * d; cc.height = innerHeight * d;
    x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 7;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: CONF[i % CONF.length], life: 0 }); }
    if (!craf) craf = requestAnimationFrame(step);
    function step() {
      const d = cc.width / innerWidth; cg.clearRect(0, 0, cc.width, cc.height);
      for (let i = bits.length - 1; i >= 0; i--) { const b = bits[i]; b.life++; b.vy += 0.25; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y > innerHeight + 20 || b.life > 240) { bits.splice(i, 1); continue; }
        cg.save(); cg.translate(b.x * d, b.y * d); cg.rotate(b.r); cg.fillStyle = b.c; cg.fillRect(-b.w * d / 2, -b.h * d / 2, b.w * d, b.h * d); cg.restore(); }
      craf = bits.length ? requestAnimationFrame(step) : 0;
    }
  };

  /* ---------- toy friends: our own little characters, drawn with canvas ---------- */
  K.COLS = { coral: "#FF6B57", sun: "#FFC93C", grass: "#3FBF7F", sky: "#5DB8FF", grape: "#8C6BF2", pink: "#FF8FB8", orange: "#FF9B3D", mint: "#7FE0C2" };
  K.INK = "#1B2547";
  function shapePath(g, shape, w, h) {
    g.beginPath();
    const r = Math.min(w, h) * 0.22;
    if (shape === "ball") { g.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); }
    else if (shape === "tri") { g.moveTo(0, -h / 2); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.closePath(); }
    else if (shape === "dome") { g.moveTo(-w / 2, h / 2); g.lineTo(-w / 2, 0); g.ellipse(0, 0, w / 2, h / 2, 0, Math.PI, 0); g.lineTo(w / 2, h / 2); g.closePath(); }
    else if (shape === "star") { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 0.42 : 1; g.lineTo(Math.cos(a) * w / 2 * rr, Math.sin(a) * h / 2 * rr * 1.05 + h * 0.04); } g.closePath(); }
    else if (shape === "heart") { const s = w / 2; g.moveTo(0, h * 0.42); g.bezierCurveTo(-s * 1.4, -h * 0.05, -s * 0.55, -h * 0.62, 0, -h * 0.2); g.bezierCurveTo(s * 0.55, -h * 0.62, s * 1.4, -h * 0.05, 0, h * 0.42); }
    else { g.roundRect ? g.roundRect(-w / 2, -h / 2, w, h, r) : g.rect(-w / 2, -h / 2, w, h); }
  }
  K.shapePath = shapePath;
  /* Each block colour belongs to one of the shop's animals, so a colour still means the same friend in every puzzle.
     The block keeps its shape (the physics and the puzzles use it); the animal is painted on: ears, patches, nose, beak. */
  K.ANIMALS = {
    fox: { ears: "point", tip: "#1B2547", inner: "#FFE3D6", muzzle: "#FFFFFF", nose: true },
    chick: { tuft: true, belly: "#FFE58A", beak: "#FF9B3D" },
    frog: { bumps: true, belly: "#BFF0C9", wide: true },
    whale: { spout: true, belly: "#D6EEFF", lines: true },
    penguin: { mask: "#FFFFFF", beak: "#FFB13D" },
    axolotl: { gills: "#E0457B", spots: "#FF6FA0" },
    kitten: { ears: "point", inner: "#FFC4D6", stripes: "rgba(27,37,71,.32)", nose: "#FF8FB8", whiskers: true },
    bear: { ears: "round", inner: "#E8C9A0", muzzle: "#E8C9A0", nose: true },
    bunny: { ears: "long", inner: "#FFC4D6", nose: "#FF8FB8", whiskers: true }
  };

  pals.forEach((p, i) => { const cx = (i + 0.5) * W / n; p.el.style.width = size + "px"; p.el.style.height = size + "px"; p.el.style.left = (cx - size / 2) + "px"; p.el.style.top = (H * 0.66 - size) + "px"; fitHat(p); });
}
// where the toy's head is: the first row of the sticker that is not transparent (stickers are square, drawn bottom-aligned)
const HEAD = {};
function headTop(t) {
  if (HEAD[t.slug] !== undefined) return HEAD[t.slug];
  let top = 0.1;
  try { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); g.drawImage(t.img, 0, 0, 64, 64);
    const d = g.getImageData(0, 0, 64, 64).data; outer: for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) if (d[(y * 64 + x) * 4 + 3] > 40) { top = y / 64; break outer; } } catch (e) {}
  return (HEAD[t.slug] = top);
}
function fitHat(p) {
  const S = p.el.clientHeight, ih = S * 0.84, y = S * 0.12 + ih * headTop(p.toy), hh = S * 0.42;
  const on = p.el.querySelector(".on"); on.style.top = (y - hh * 0.8) + "px"; on.style.height = hh + "px";
}
function deal() {
  const n = ROUNDS[round], set = pickToys(n), style = STYLES[round % STYLES.length]; wrongs = 0; sel = null; locked = false;
  document.getElementById("round").innerHTML = ROUNDS.map((_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join("");
  const fl = document.getElementById("floor"); fl.querySelectorAll(".pal").forEach(e => e.remove());
  pals = set.map(t => {
    const b = document.createElement("button"); b.type = "button"; b.className = "pal"; b.setAttribute("aria-label", K.toyName(t));
    const disc = document.createElement("div"); disc.className = "disc"; disc.style.background = t.colour;
    const toy = document.createElement("div"); toy.className = "toy"; const im = document.createElement("img"); im.src = t.img.src; im.alt = ""; im.draggable = false; toy.appendChild(im);
    const on = document.createElement("div"); on.className = "on";
    b.append(disc, toy, on); fl.appendChild(b); const p = { el: b, toy: t, done: false }; b.onclick = () => tapPal(p); return p;
  });
  const rack = document.getElementById("rack"); rack.innerHTML = "";
  hats = shuffle(set).map(t => {
    const h = document.createElement("button"); h.type = "button"; h.className = "hat"; h.innerHTML = hatSVG(style, t.colour); h.setAttribute("aria-label", K.t("pick"));
    rack.appendChild(h); const o = { el: h, toy: t, style }; grab(o); return o;
  });
  layout(); say("go");
}
function select(h) { hats.forEach(o => o.el.classList.toggle("sel", o === h)); sel = h; if (h) { say("pick"); K.sfx.tick(); } }
function grab(h) {
  h.el.addEventListener("pointerdown", e => {
    if (!running || locked || h.el.classList.contains("used")) return;
    e.preventDefault(); drag = { h, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, id: e.pointerId };
    try { h.el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  h.el.addEventListener("pointermove", e => {
    if (!drag || drag.h !== h) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 12) {
      drag.moved = true; select(h); const g = document.createElement("div"); g.className = "ghost"; g.innerHTML = hatSVG(h.style, h.toy.colour); document.body.appendChild(g); drag.ghost = g; h.el.style.opacity = ".3";
    }
    if (drag.ghost) { drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px"; const p = palAt(e.clientX, e.clientY); pals.forEach(o => o.el.classList.toggle("over", o === p)); }
  });
  const end = e => {
    if (!drag || drag.h !== h) return;
    const d = drag; drag = null; if (d.ghost) d.ghost.remove(); h.el.style.opacity = ""; pals.forEach(o => o.el.classList.remove("over"));
    if (!d.moved) { select(sel === h ? null : h); if (!sel) say("go"); return; }
    const p = palAt(e.clientX, e.clientY); if (p) tryHat(h, p); else { select(null); say("go"); }
  };
  h.el.addEventListener("pointerup", end); h.el.addEventListener("pointercancel", end);
}
function palAt(x, y) {
  return pals.find(p => { if (p.done) return false; const r = p.el.getBoundingClientRect(), m = 18; return x > r.left - m && x < r.right + m && y > r.top - r.height * 0.3 && y < r.bottom + m; });
}
function tapPal(p) {
  if (!running || locked || p.done) return;
  if (!sel) { const h = hats.find(o => !o.el.classList.contains("used")); if (h) { h.el.classList.remove("back"); void h.el.offsetWidth; h.el.classList.add("back"); } say("go"); return; }
  tryHat(sel, p);
}
async function tryHat(h, p) {
  locked = true; hats.forEach(o => o.el.classList.remove("sel")); sel = null;
  if (p.toy === h.toy) {
    given++; document.getElementById("count").textContent = given; p.done = true; p.el.classList.remove("hint");
    h.el.classList.add("used"); p.el.querySelector(".on").innerHTML = hatSVG(h.style, h.toy.colour); p.el.classList.add("drop"); K.sfx.pop();
    say("yay", K.toyName(p.toy)); wrongs = 0;
    await wait(350); p.el.classList.add("hop"); K.sfx.chime();
    const r = p.el.getBoundingClientRect(); if (!K.CALM) K.confetti(r.left + r.width / 2, r.top + r.height * 0.2, 28);
    await wait(800); p.el.classList.remove("hop", "drop"); if (!running) return;
    if (pals.every(o => o.done)) {
      say("party"); K.sfx.tada(); pals.forEach(o => o.el.classList.add("hop")); await wait(1500); if (!running) return;
      if (round < ROUNDS.length - 1) { round++; deal(); } else finish();
    } else { say("go"); locked = false; }
  } else {
    wrongs++; totalWrong++; K.sfx.boing(); p.el.classList.remove("no"); void p.el.offsetWidth; p.el.classList.add("no");
    h.el.classList.remove("back"); void h.el.offsetWidth; h.el.classList.add("back"); say("no", K.toyName(p.toy));
    await wait(900); if (!running) return;
    if (wrongs >= 2) { const g = pals.find(o => o.toy === h.toy); if (g) g.el.classList.add("hint"); }
    select(h); locked = false;
  }
}
function finish() {
  running = false; const stars = totalWrong <= 1 ? 3 : totalWrong <= 4 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", given);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start(list) {
  toys = list.filter(t => t.img && t.colour); if (toys.length < 2) return;
  timers.forEach(clearTimeout); timers = [];
  round = 0; given = 0; totalWrong = 0; running = true; document.getElementById("count").textContent = "0";
  document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; deal();
}
addEventListener("resize", () => { if (pals.length) layout(); });
K.initBar(); K.onLang = () => { if (running && !locked) say(sel ? "pick" : "go"); pals.forEach(p => p.el.setAttribute("aria-label", K.toyName(p.toy))); }; K.applyWords();
function introArt(list) {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  x.fillStyle = "#9FD37A"; x.beginPath(); x.ellipse(200, 228, 180, 26, 0, 0, 7); x.fill();
  const ts = (list || []).filter(t => t.img).slice(0, 3), cols = ts.length ? ts.map(t => t.colour) : ["#F28C3A", "#7CC56B", "#F7A9C4"];
  const draw = (svg, X, Y, w, h) => { const im = new Image(); im.onload = () => x.drawImage(im, X, Y, w, h); im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ')); };
  [0, 1, 2].forEach(i => { const cx = 80 + i * 120;
    if (ts[i]) x.drawImage(ts[i].img, cx - 50, 120, 100, 100); else { x.fillStyle = cols[i]; x.strokeStyle = K.INK; x.lineWidth = 5; x.beginPath(); x.arc(cx, 180, 42, 0, 7); x.fill(); x.stroke(); }
    draw(hatSVG(STYLES[i], cols[i]), cx - 30, i === 1 ? 20 : 80, 60, 58); });
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => introArt(list));
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
