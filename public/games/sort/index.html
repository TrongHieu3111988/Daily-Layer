/* Daily Layer game kit: words, sound, confetti and the "toy friends" every game draws. */
(function () {

  /* ---------- words ---------- */
  // English first; Vietnamese on Vietnamese devices, or whatever was last picked in the shop or any game (one shared setting)
  K.lang = (() => { let v = ""; try { v = (localStorage.getItem("dl-lang") || "").replace(/"/g, ""); } catch (e) {} return v === "vi" || v === "en" ? v : /^vi/i.test(navigator.language || "") ? "vi" : "en"; })();

  K.applyWords = () => {
    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });
    const b = document.getElementById("langBtn"); if (b) b.textContent = K.lang === "vi" ? "EN" : "VI";
    K.onLang && K.onLang();
  };
  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

  /* ---------- sound: tiny synth blips, only after the child has touched the screen ---------- */

  function ctx() { if (K.muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }

    boing: () => { tone(300, 120, 0.25, "square", 0.06); tone(150, 260, 0.2, "sine", 0.12, 0.05); },

    const r = Math.min(w, h) * 0.22;
    if (shape === "ball") { g.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); }

  /* Each block colour belongs to one of the shop's animals, so a colour still means the same friend in every puzzle.

  K.ANIMALS = {
    fox: { ears: "point", tip: "#1B2547", inner: "#FFE3D6", muzzle: "#FFFFFF", nose: true },
    chick: { tuft: true, belly: "#FFE58A", beak: "#FF9B3D" },
    frog: { bumps: true, belly: "#BFF0C9", wide: true },
    whale: { spout: true, belly: "#D6EEFF", lines: true },
    penguin: { mask: "#FFFFFF", beak: "#FFB13D" },
    axolotl: { gills: "#E0457B", spots: "#FF6FA0" },
    kitten: { ears: "point", inner: "#FFC4D6", stripes: "rgba(27,37,71,.32)", nose: "#FF8FB8", whiskers: true },
    bear: { ears: "round", inner: "#E8C9A0", muzzle: "#E8C9A0", nose: true },
    bunny: { ears: "long", inner: "#FFC4D6", nose: "#FF8FB8", whiskers: true }
  };
  K.ANIMAL_OF = { "#ff6b57": "fox", "#ffc93c": "chick", "#3fbf7f": "frog", "#5db8ff": "whale", "#8c6bf2": "penguin", "#ff8fb8": "axolotl",
    "#ff9b3d": "kitten", "#b8834f": "bear", "#f4effa": "bunny", "#7fe0c2": "frog" };

    const u = Math.min(1, Math.abs(x) / (w / 2));

    const mini = bx.querySelector(".mini"), cv = document.createElement("canvas"); mini.appendChild(cv); paint(cv, it.t, mode === "size" && !it.big ? 0.6 : 1);
    bx.classList.remove("yes"); void bx.offsetWidth; bx.classList.add("yes"); K.sfx.chime();
    document.getElementById("ask").textContent = K.t("yes");
    if (!K.CALM) { const r = bx.getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top, 14); }
    if (--left === 0) { document.getElementById("ask").textContent = K.t("done"); done++; document.getElementById("count").textContent = done; K.sfx.tada(); totalWrong += wrongs;
      setTimeout(() => { if (round < ROUNDS.length - 1) { round++; deal(); } else finish(); }, 1400); }
  } else {
    wrongs++; bx.classList.remove("no"); void bx.offsetWidth; bx.classList.add("no"); K.sfx.boing(); document.getElementById("ask").textContent = K.t("no"); home(it);
    if (sel) { sel.el.classList.remove("sel"); sel = null; }
    setTimeout(() => { if (left) document.getElementById("ask").textContent = K.t(mode === "size" ? "askSize" : "askKind"); }, 1400);
  }
}
function finish() {
  running = false; const stars = totalWrong <= 1 ? 3 : totalWrong <= 4 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", ROUNDS.length);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start() { round = 0; done = 0; totalWrong = 0; running = true; document.getElementById("count").textContent = "0"; document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; deal(); }

K.initBar(); K.onLang = () => { if (running && left) document.getElementById("ask").textContent = K.t(mode === "size" ? "askSize" : "askKind"); }; K.applyWords();
function introArt() {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  const pool = toys.length ? toys : null;
  [[90, 170], [200, 120], [310, 170]].forEach(([cx, cy], i) => {
    const t = pool && pool[i % pool.length];
    if (t && t.img) x.drawImage(t.img, cx - 55, cy - 55, 110, 110); else { x.save(); x.translate(cx, cy); x.scale(1.2, 1.2); K.friend(x, { shape: "square", w: 62, h: 62, colour: FALLBACK[i].fake, mood: "happy", lw: 3.5 }); x.restore(); }
  });
  x.strokeStyle = K.INK; x.lineWidth = 5; x.setLineDash([10, 8]); x.strokeRect(120, 215, 160, 55);
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => { toys = list.filter(t => t.img); introArt(); });
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
