  K.applyWords = () => {
    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });
    const b = document.getElementById("langBtn"); if (b) b.textContent = K.lang === "vi" ? "EN" : "VI";

  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

  /* ---------- sound: tiny synth blips, only after the child has touched the screen ---------- */

  function ctx() { if (K.muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }

  /* Each block colour belongs to one of the shop's animals, so a colour still means the same friend in every puzzle.

  K.ANIMALS = {
    fox: { ears: "point", tip: "#1B2547", inner: "#FFE3D6", muzzle: "#FFFFFF", nose: true },
    chick: { tuft: true, belly: "#FFE58A", beak: "#FF9B3D" },
    frog: { bumps: true, belly: "#BFF0C9", wide: true },
    whale: { spout: true, belly: "#D6EEFF", lines: true },
    penguin: { mask: "#FFFFFF", beak: "#FFB13D" },
    axolotl: { gills: "#E0457B", spots: "#FF6FA0" },
    kitten: { ears: "point", inner: "#FFC4D6", stripes: "rgba(27,37,71,.32)", nose: "#FF8FB8", whiskers: true },
    bear: { ears: "round", inner: "#E8C9A0", muzzle: "#E8C9A0", nose: true },
    bunny: { ears: "long", inner: "#FFC4D6", nose: "#FF8FB8", whiskers: true }
  };
  K.ANIMAL_OF = { "#ff6b57": "fox", "#ffc93c": "chick", "#3fbf7f": "frog", "#5db8ff": "whale", "#8c6bf2": "penguin", "#ff8fb8": "axolotl",
    "#ff9b3d": "kitten", "#b8834f": "bear", "#f4effa": "bunny", "#7fe0c2": "frog" };

box(40, 0.2, 60, "#9ED8B4", 0, -0.12, -5, 0);                                     // grass all around
box(LANE_W, 0.12, LANE_START - LANE_END, "#E9B97A", 0, 0, (LANE_START + LANE_END) / 2, 0); // the lane
for (let x = -LANE_W / 2 + 0.55; x < LANE_W / 2; x += 0.55) box(0.03, 0.005, LANE_START - LANE_END, "#D4A266", x, 0.065, (LANE_START + LANE_END) / 2, 0);
for (const s of [-1, 1]) { box(0.35, 0.55, LANE_START - LANE_END, s < 0 ? "#FF6B57" : "#5DB8FF", s * (LANE_W / 2 + 0.17), 0.28, (LANE_START + LANE_END) / 2, 0.12); }  // bumpers
for (let i = 0; i < 5; i++) { const c = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2"][i]; box(0.3, 0.02, 0.3, c, -1.2 + i * 0.6, 0.07, 3.5, 0.04).rotation.y = Math.PI / 4; }  // aiming arrows
box(LANE_W + 1.2, 3, 0.4, "#8C6BF2", 0, 1.5, LANE_END - 0.3, 0.15);                // back wall
// a few clouds and hills
for (const [x, y, z, s] of [[-12, 9, -35, 3], [10, 11, -38, 4], [0, 13, -45, 3.5]]) { const g = new THREE.Group(); for (let k = 0; k < 3; k++) { const m = new THREE.Mesh(new THREE.SphereGeometry(s * (1 - k * 0.2), 16, 12), mat("#FFFFFF")); m.position.set(k * s * 0.9 - s, (k % 2) * s * 0.3, 0); g.add(m); } g.position.set(x, y, z); scene.add(g); }
for (const [x, z, r, c] of [[-14, -30, 9, "#7ED69A"], [14, -32, 11, "#6CCB8B"]]) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), mat(c)); m.position.set(x, -r * 0.55, z); scene.add(m); }

/* ---------- physics ---------- */
const world = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
world.allowSleep = true; world.defaultContactMaterial.friction = 0.35; world.defaultContactMaterial.restitution = 0.15;
const ground = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() }); ground.quaternion.setFromEuler(-Math.PI / 2, 0, 0); ground.position.y = 0.06; world.addBody(ground);
for (const s of [-1, 1]) { const b = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(0.17, 0.6, (LANE_START - LANE_END) / 2)) }); b.position.set(s * (LANE_W / 2 + 0.17), 0.6, (LANE_START + LANE_END) / 2); world.addBody(b); }
const wall = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(LANE_W, 2, 0.2)) }); wall.position.set(0, 2, LANE_END - 0.3); world.addBody(wall);

const BALL_R = 0.48;
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 32, 24), new THREE.MeshStandardMaterial({ color: "#8C6BF2", roughness: 0.25 }));
ballMesh.castShadow = true; scene.add(ballMesh);
for (const [a, b] of [[0.3, 0.2], [-0.05, 0.38], [0.25, -0.15]]) { const h = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), mat("#1B2547")); h.position.set(a * BALL_R * 1.9, b * BALL_R * 1.9, BALL_R * 0.92); ballMesh.add(h); }
const ball = new CANNON.Body({ mass: 7, shape: new CANNON.Sphere(BALL_R), linearDamping: 0.08, angularDamping: 0.1 });
world.addBody(ball);

/* ---------- pins: real toys on top of simple box colliders ---------- */
const PIN_H = 1.45, SLOTS = [[0, 0], [-0.62, -1.15], [0.62, -1.15], [-1.24, -2.3], [0, -2.3], [1.24, -2.3]];
let toys = [], pins = [];
async function setPins(keep) {
  for (const p of pins) { if (keep && keep.includes(p)) continue; scene.remove(p.mesh); world.removeBody(p.body); }
  if (keep) { pins = keep; for (const p of pins) { p.body.velocity.setZero(); p.body.angularVelocity.setZero(); p.body.position.set(p.home.x, p.home.y, p.home.z); p.body.quaternion.set(0, 0, 0, 1); p.body.wakeUp(); } return; }
  pins = [];
  const featured = toys.find(t => t.featured), rest = toys.filter(t => t !== featured).sort(() => Math.random() - 0.5);
  const lineup = (featured ? [featured, ...rest] : rest);
  for (let i = 0; i < SLOTS.length; i++) {
    const t = lineup[i % lineup.length], mesh = await toyMesh(t), bb = mesh.geometry.boundingBox;
    const s = PIN_H / (bb.max.y - bb.min.y); mesh.scale.setScalar(s);
    const hx = Math.max(0.18, (bb.max.x - bb.min.x) * s * 0.36), hz = Math.max(0.18, (bb.max.z - bb.min.z) * s * 0.36), hy = PIN_H / 2;
    const cx = (bb.max.x + bb.min.x) / 2 * s, cz = (bb.max.z + bb.min.z) / 2 * s;
    const body = new CANNON.Body({ mass: 1, shape: new CANNON.Box(new CANNON.Vec3(hx, hy, hz)), linearDamping: 0.2, angularDamping: 0.25, sleepSpeedLimit: 0.15 });
    const [sx, sz] = SLOTS[i]; body.position.set(sx, 0.06 + hy, PIN_Z + sz);
    world.addBody(body); scene.add(mesh);
    pins.push({ t, mesh, body, off: new THREE.Vector3(-cx, -hy, -cz), home: body.position.clone(), down: false });
  }
}
function syncPins() {
  for (const p of pins) {
    const q = new THREE.Quaternion(p.body.quaternion.x, p.body.quaternion.y, p.body.quaternion.z, p.body.quaternion.w);
    p.mesh.quaternion.copy(q); p.mesh.position.set(p.body.position.x, p.body.position.y, p.body.position.z).add(p.off.clone().applyQuaternion(q));
  }
}
const isDown = p => { const up = new CANNON.Vec3(0, 1, 0), v = p.body.quaternion.vmult(up); return v.y < 0.65 || p.body.position.y < 0 || Math.hypot(p.body.position.x - p.home.x, p.body.position.z - p.home.z) > 0.9; };

/* ---------- turns ---------- */
let frame = 0, roll = 0, scores = [], rolling = false, rollT = 0, standing = 6, firstDown = 0, best = K.store.get("bowl-best", 0);
function resetBall() { ball.velocity.setZero(); ball.angularVelocity.setZero(); ball.position.set(0, BALL_R + 0.07, 6.2); ball.quaternion.set(0, 0, 0, 1); ball.wakeUp(); }
function board() {
  document.getElementById("board").innerHTML = Array.from({ length: 5 }, (_, i) => `<div class="frame${i === frame ? " now" : ""}"><small>${K.t("turn", i + 1)}</small><b>${scores[i] ?? (i === frame && roll ? firstDown : "")}</b></div>`).join("");
  document.getElementById("total").textContent = scores.reduce((a, b) => a + (b || 0), 0);
}
async function newGame() { frame = 0; roll = 0; scores = []; await setPins(); resetBall(); board(); document.getElementById("over").hidden = true; document.getElementById("swipe").hidden = false; }
function launch(vx, vz) {
  if (rolling) return; rolling = true; rollT = performance.now();
  ball.wakeUp(); ball.velocity.set(vx, 0, vz); ball.angularVelocity.set(vz / BALL_R, 0, -vx / BALL_R);   // already rolling, so friction doesn't brake it
  document.getElementById("swipe").hidden = true; K.sfx.thud();
}
let hitSounded = false;
ball.addEventListener("collide", e => { if (!hitSounded && pins.some(p => p.body === e.body)) { hitSounded = true; K.sfx.boing(); } });
function settle() {
  const down = pins.filter(isDown), n = down.length;
  rolling = false; hitSounded = false;
  if (roll === 0) {
    firstDown = n;
    if (n === pins.length) { scores[frame] = n; big(K.t("strike")); K.sfx.tada(); K.confetti(); return nextFrame(); }
    toast(K.t("down", n)); if (n) K.sfx.chime();
    roll = 1; board();
    for (const p of down) { scene.remove(p.mesh); world.removeBody(p.body); }
    setPins(pins.filter(p => !down.includes(p))); resetBall();
  } else {
    const total = firstDown + n; scores[frame] = total;
    if (total === 6) { big(K.t("spare")); K.sfx.tada(); K.confetti(); } else { toast(K.t("down", n)); if (n) K.sfx.chime(); }
    nextFrame();
  }
}
async function nextFrame() {
  board();
  await new Promise(r => setTimeout(r, 1400));
  frame++; roll = 0;
  if (frame >= 5) return gameOver();
  await setPins(); resetBall(); board(); document.getElementById("swipe").hidden = false;
}
function gameOver() {
  const s = scores.reduce((a, b) => a + b, 0), newBest = s > best; if (newBest) { best = s; K.store.set("bowl-best", best); }
  const st = s >= 24 ? 3 : s >= 15 ? 2 : s >= 6 ? 1 : 0;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < st)).join("");
  document.getElementById("overH").textContent = K.t("overH", s); document.getElementById("overP").textContent = K.t("overP", s, best);
  document.getElementById("over").hidden = false; if (st) { K.sfx.tada(); K.confetti(); }
}
function big(text) { const e = document.createElement("div"); e.className = "big"; e.textContent = text; document.getElementById("stage").appendChild(e); setTimeout(() => e.remove(), 1500); }

/* ---------- swipe to roll ---------- */
let trail = [];
cv.addEventListener("pointerdown", e => { if (rolling) return; trail = [[e.clientX, e.clientY, performance.now()]]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (!trail.length) return; trail.push([e.clientX, e.clientY, performance.now()]); if (trail.length > 12) trail.shift();
  const r = cv.getBoundingClientRect(), dx = (e.clientX - trail[0][0]) / r.width; if (!rolling) ball.position.x = Math.max(-1.6, Math.min(1.6, dx * 3)); });
cv.addEventListener("pointerup", e => {
  if (!trail.length || rolling) { trail = []; return; }
  const a = trail[0], b = [e.clientX, e.clientY, performance.now()], r = cv.getBoundingClientRect();
  const dy = (a[1] - b[1]) / r.height, dx = (b[0] - a[0]) / r.width, dt = Math.max(60, b[2] - a[2]) / 1000;
  trail = [];
  if (dy < 0.06) { resetBall(); return; }                                       // too short: not a roll
  const speed = Math.min(26, Math.max(9, dy / dt * 9)), side = Math.max(-0.22, Math.min(0.22, dx / Math.max(dy, 0.1) * 0.6));
  launch(side * speed, -speed);
});
addEventListener("keydown", e => { if ((e.key === " " || e.key === "ArrowUp") && !rolling && document.getElementById("intro").hidden) { e.preventDefault(); launch((Math.random() - 0.5) * 2, -18); } });

/* ---------- loop ---------- */
function resize() { const r = cv.getBoundingClientRect(); if (!r.width) return; renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height; cam.fov = cam.aspect < 0.8 ? 62 : 50; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv); resize();
let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  world.step(1 / 60, dt, 4);
  ballMesh.position.copy(ball.position); ballMesh.quaternion.copy(ball.quaternion);
  syncPins();
  // camera rides behind the ball, then waits by the pins
  const tz = rolling ? Math.max(PIN_Z + 6, ball.position.z + 5.5) : 10, ty = rolling ? 3 : 3.4;
  cam.position.lerp(new THREE.Vector3(0, ty, tz), Math.min(1, dt * 3)); cam.lookAt(0, 0.6, Math.min(cam.position.z - 8, PIN_Z + 1));
  if (rolling) {
    const t = (now - rollT) / 1000, slow = ball.velocity.length() < 0.6 && t > 1.2, quiet = pins.every(p => p.body.sleepState === CANNON.Body.SLEEPING || p.body.velocity.length() < 0.15);
    if ((ball.position.z < PIN_Z - 3.5 && quiet && t > 2) || t > 7 || (slow && quiet)) settle();
  }
  renderer.render(scene, cam);
})(performance.now());

/* ---------- boot ---------- */
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL : "/#play";
document.getElementById("back").href = window.SHOP_URL || "/";
(async () => {
  try { toys = (await loadToyList()).toys; await Promise.all(toys.map(toyGeometry)); }
  catch (e) { document.getElementById("loading").textContent = K.t("noLoad"); return; }
  document.getElementById("loading").hidden = true;
  await newGame();
  const c = document.getElementById("introArt"), x = c.getContext("2d");
  const imgs = await Promise.all(toys.slice(0, 3).map(t => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = assetURL(`products/${t.slug}/cover.jpg`); })));
  [[200, 70], [140, 150], [260, 150]].forEach(([px, py], i) => { const im = imgs[i]; if (!im) return; x.save(); x.beginPath(); x.arc(px, py, 50, 0, 7); x.clip(); x.drawImage(im, px - 50, py - 50, 100, 100); x.restore(); x.lineWidth = 5; x.strokeStyle = "#1B2547"; x.beginPath(); x.arc(px, py, 50, 0, 7); x.stroke(); });
  x.fillStyle = "#8C6BF2"; x.strokeStyle = "#1B2547"; x.lineWidth = 5; x.beginPath(); x.arc(60, 220, 40, 0, 7); x.fill(); x.stroke();
})();
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); document.getElementById("intro").hidden = true; };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); newGame(); };
window.__game = { launch, pins: () => pins, scores: () => scores, frame: () => frame };   // used by automated play tests
</script>
</body>
</html>
