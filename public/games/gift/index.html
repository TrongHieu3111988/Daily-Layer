<script>
/* Daily Layer game kit: words, sound, confetti and the "toy friends" every game draws. */
(function () {
  "use strict";
  const K = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  K.store = store;
  K.CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- words ---------- */
  // English first; Vietnamese on Vietnamese devices, or whatever was last picked in the shop or any game (one shared setting)
  K.lang = (() => { let v = ""; try { v = (localStorage.getItem("dl-lang") || "").replace(/"/g, ""); } catch (e) {} return v === "vi" || v === "en" ? v : /^vi/i.test(navigator.language || "") ? "vi" : "en"; })();
  K.words = { en: {}, vi: {} };
  K.t = (k, ...a) => { const v = K.words[K.lang][k] ?? K.words.en[k] ?? k; return typeof v === "function" ? v(...a) : v; };
  K.applyWords = () => {
    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });
    const b = document.getElementById("langBtn"); if (b) b.textContent = K.lang === "vi" ? "EN" : "VI";
    K.onLang && K.onLang();
  };
  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

  /* ---------- sound: tiny synth blips, only after the child has touched the screen ---------- */
  let ac = null; K.muted = store.get("dl-muted", false);
  function ctx() { if (K.muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }
  function tone(f0, f1, dur, type = "sine", vol = 0.18, delay = 0) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  K.sfx = {
    pop: () => tone(520, 880, 0.12, "triangle", 0.16),
    thud: () => tone(180, 90, 0.14, "sine", 0.22),
    boing: () => { tone(300, 120, 0.25, "square", 0.06); tone(150, 260, 0.2, "sine", 0.12, 0.05); },
    chime: () => { [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, 0.22, "triangle", 0.12, i * 0.07)); },
    tada: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.3, "triangle", 0.14, i * 0.09)); },
    tick: () => tone(1200, 900, 0.04, "square", 0.04),
    note: f => { tone(f, f, 0.42, "triangle", 0.16); tone(f * 2, f * 2, 0.25, "sine", 0.04); }
  };
  K.setMuted = m => { K.muted = m; store.set("dl-muted", m); const b = document.getElementById("soundBtn"); if (b) b.innerHTML = m ? K.ICON.mute : K.ICON.sound; };

  /* ---------- confetti ---------- */
  let cc = null, cg = null, bits = [], craf = 0;
  const CONF = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2", "#FF8FB8"];
  K.confetti = (x, y, n = 60) => {
    if (K.CALM) return;
    if (!cc) { cc = document.createElement("canvas"); cc.id = "confetti"; document.body.appendChild(cc); cg = cc.getContext("2d"); }
    const d = Math.min(devicePixelRatio || 1, 2); cc.width = innerWidth * d; cc.height = innerHeight * d;
    x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 7;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: CONF[i % CONF.length], life: 0 }); }
    if (!craf) craf = requestAnimationFrame(step);
    function step() {
      const d = cc.width / innerWidth; cg.clearRect(0, 0, cc.width, cc.height);
      for (let i = bits.length - 1; i >= 0; i--) { const b = bits[i]; b.life++; b.vy += 0.25; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y > innerHeight + 20 || b.life > 240) { bits.splice(i, 1); continue; }
        cg.save(); cg.translate(b.x * d, b.y * d); cg.rotate(b.r); cg.fillStyle = b.c; cg.fillRect(-b.w * d / 2, -b.h * d / 2, b.w * d, b.h * d); cg.restore(); }
      craf = bits.length ? requestAnimationFrame(step) : 0;
    }
  };

  /* ---------- toy friends: our own little characters, drawn with canvas ---------- */
  K.COLS = { coral: "#FF6B57", sun: "#FFC93C", grass: "#3FBF7F", sky: "#5DB8FF", grape: "#8C6BF2", pink: "#FF8FB8", orange: "#FF9B3D", mint: "#7FE0C2" };
  K.INK = "#1B2547";
  function shapePath(g, shape, w, h) {
    g.beginPath();
    const r = Math.min(w, h) * 0.22;
    if (shape === "ball") { g.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); }
    else if (shape === "tri") { g.moveTo(0, -h / 2); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.closePath(); }
    else if (shape === "dome") { g.moveTo(-w / 2, h / 2); g.lineTo(-w / 2, 0); g.ellipse(0, 0, w / 2, h / 2, 0, Math.PI, 0); g.lineTo(w / 2, h / 2); g.closePath(); }
    else if (shape === "star") { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 0.42 : 1; g.lineTo(Math.cos(a) * w / 2 * rr, Math.sin(a) * h / 2 * rr * 1.05 + h * 0.04); } g.closePath(); }
    else if (shape === "heart") { const s = w / 2; g.moveTo(0, h * 0.42); g.bezierCurveTo(-s * 1.4, -h * 0.05, -s * 0.55, -h * 0.62, 0, -h * 0.2); g.bezierCurveTo(s * 0.55, -h * 0.62, s * 1.4, -h * 0.05, 0, h * 0.42); }
    else { g.roundRect ? g.roundRect(-w / 2, -h / 2, w, h, r) : g.rect(-w / 2, -h / 2, w, h); }
  }
  K.shapePath = shapePath;
  /* Each block colour belongs to one of the shop's animals, so a colour still means the same friend in every puzzle.

    <div class="pal" id="pal"></div><div class="neck"></div>
    <div class="body"><div class="band" style="left:18%"></div><div class="band" style="right:18%"></div></div>
    <div class="lid" id="lid"><div class="rim"></div><div class="bow">${bowSVG(look[2] === "#FFFFFF" ? "#FFD24A" : look[2])}</div></div>
    <div class="arrows" id="arrows">${ARROWS}</div>
    <div class="dots" id="dots">${Array.from({ length: left }, () => "<i></i>").join("")}</div></div>`;
  const img = document.createElement("img"); img.src = t.img.src; img.alt = ""; img.draggable = false; document.getElementById("pal").appendChild(img);
  const g = document.getElementById("gift"); g.setAttribute("aria-label", K.t("twist", left));
  g.addEventListener("pointerdown", down); g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); turn(); } });
  setAsk(); idle();
}
function idle() { clearTimeout(idleT); const h = document.querySelector(".hand"); if (h) h.remove(); idleT = setTimeout(() => { if (!running || locked) return; const d = document.createElement("div"); d.className = "hand"; d.innerHTML = HAND; play.appendChild(d); }, 6000); }
let downX = 0, moved = 0;
function down(e) { if (!running || locked) return; e.preventDefault(); downX = lastX = e.clientX; moved = 0; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} idle(); }
play.addEventListener("pointermove", e => {
  if (lastX === null || !running || locked) return;
  const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx); acc += Math.abs(dx); spin += dx;
  document.querySelector("#lid .rim").style.setProperty("--spin", spin + "px");
  if (Math.abs(dx) > 1 && Math.random() < .25) K.sfx.tick();
  if (acc >= 70) { acc = 0; turn(); }
});
function up() { if (lastX === null) return; lastX = null; if (moved < 12 && running && !locked) turn(); }
play.addEventListener("pointerup", up); play.addEventListener("pointercancel", () => { lastX = null; });
function turn() {
  if (!running || locked || left <= 0) return;
  left--; const done = TURNS[round] - left; idle();
  const lid = document.getElementById("lid"), g = document.getElementById("gift");
  spin += 28; lid.querySelector(".rim").style.setProperty("--spin", spin + "px");
  lid.style.transform = `translateY(${-done * 4}px)`;
  document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i < done));
  g.classList.remove("wig"); void g.offsetWidth; g.classList.add("wig");
  K.sfx.note(392 * Math.pow(2, done / 6));
  if (left === 0) pop(); else setAsk();
}
function pop() {
  locked = true; clearTimeout(idleT); const h = document.querySelector(".hand"); if (h) h.remove();
  const t = order[round]; opened++; document.getElementById("count").textContent = opened;
  document.getElementById("arrows").remove(); document.getElementById("lid").classList.add("off"); K.sfx.pop();
  setTimeout(() => { const p = document.getElementById("pal"); p.classList.add("out", "hop"); K.sfx.chime(); setAsk();
    const r = p.getBoundingClientRect(); if (!K.CALM) K.confetti(r.left + r.width / 2, r.top + r.height / 2, 50); }, 250);
  setTimeout(() => {
    const slot = document.querySelectorAll("#shelf .slot")[round]; if (slot) { const im = document.createElement("img"); im.src = t.img.src; im.alt = ""; slot.appendChild(im); slot.classList.add("full"); K.sfx.thud(); }
    if (round < TURNS.length - 1) { round++; deal(); } else finish();
  }, 2600);
}
function finish() {
  running = false; clearTimeout(idleT);
  document.getElementById("stars").innerHTML = [0, 1, 2].map(() => K.starSVG(true)).join("");
  document.getElementById("overH").textContent = K.t("overH"); document.getElementById("overP").textContent = K.t("overP", TURNS.length);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start(list) {
  toys = list.filter(t => t.img); if (toys.length < 2) return;
  order = []; while (order.length < TURNS.length) order = order.concat(shuffle(toys)); order = order.slice(0, TURNS.length);
  round = 0; opened = 0; running = true; document.getElementById("count").textContent = "0";
  document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; shelf(); deal();
}

K.initBar(); K.onLang = () => { if (running) setAsk(); }; K.applyWords();
function introArt(list) {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  x.fillStyle = "#E9F6FF"; x.beginPath(); x.roundRect ? x.roundRect(10, 10, 380, 260, 26) : x.rect(10, 10, 380, 260); x.fill();
  x.lineWidth = 5; x.strokeStyle = K.INK; x.lineJoin = "round";
  x.fillStyle = "#E23B3B"; x.beginPath(); x.roundRect ? x.roundRect(60, 150, 140, 105, 14) : x.rect(60, 150, 140, 105); x.fill(); x.stroke();
  x.fillStyle = "#FFD24A"; x.fillRect(110, 152, 22, 101); x.strokeRect(110, 152, 22, 101);
  x.save(); x.translate(205, 95); x.rotate(.35); x.fillStyle = "#2F9E5B"; x.beginPath(); x.roundRect ? x.roundRect(-82, -20, 164, 42, 12) : x.rect(-82, -20, 164, 42); x.fill(); x.stroke(); x.restore();
  const t = (list || []).find(t => t.img); if (t) x.drawImage(t.img, 80, 40, 120, 120);
  K.star(x, 300, 70, 18); K.star(x, 340, 150, 12); K.star(x, 290, 210, 14);
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => introArt(list));
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
addEventListener("resize", () => { if (running && !locked) { const g = document.getElementById("gift"); if (g) g.style.setProperty("--w", size() + "px"); shelf(); document.querySelectorAll("#shelf .slot").forEach((s, i) => { if (i < round) { const t = order[i]; const im = document.createElement("img"); im.src = t.img.src; im.alt = ""; s.appendChild(im); s.classList.add("full"); } }); } });
</script>
</body>
</html>
