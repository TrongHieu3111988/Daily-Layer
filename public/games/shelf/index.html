<script>
/* Daily Layer game kit: words, sound, confetti and the "toy friends" every game draws. */
(function () {
  "use strict";
  const K = {};
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  K.store = store;
  K.CALM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- words ---------- */
  // English first; Vietnamese on Vietnamese devices, or whatever was last picked in the shop or any game (one shared setting)
  K.lang = (() => { let v = ""; try { v = (localStorage.getItem("dl-lang") || "").replace(/"/g, ""); } catch (e) {} return v === "vi" || v === "en" ? v : /^vi/i.test(navigator.language || "") ? "vi" : "en"; })();
  K.words = { en: {}, vi: {} };
  K.t = (k, ...a) => { const v = K.words[K.lang][k] ?? K.words.en[k] ?? k; return typeof v === "function" ? v(...a) : v; };
  K.applyWords = () => {
    document.documentElement.lang = K.lang;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = K.t(el.dataset.t); });
    document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", K.t(el.dataset.tLabel)); });
    const b = document.getElementById("langBtn"); if (b) b.textContent = K.lang === "vi" ? "EN" : "VI";
    K.onLang && K.onLang();
  };
  K.toggleLang = () => { K.lang = K.lang === "vi" ? "en" : "vi"; store.set("dl-lang", K.lang); K.applyWords(); };

  /* ---------- sound: tiny synth blips, only after the child has touched the screen ---------- */
  let ac = null; K.muted = store.get("dl-muted", false);
  function ctx() { if (K.muted) return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (ac.state === "suspended") ac.resume(); return ac; }
  function tone(f0, f1, dur, type = "sine", vol = 0.18, delay = 0) {
    const a = ctx(); if (!a) return;
    const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  K.sfx = {
    pop: () => tone(520, 880, 0.12, "triangle", 0.16),
    thud: () => tone(180, 90, 0.14, "sine", 0.22),
    boing: () => { tone(300, 120, 0.25, "square", 0.06); tone(150, 260, 0.2, "sine", 0.12, 0.05); },
    chime: () => { [660, 880, 1320].forEach((f, i) => tone(f, f * 1.01, 0.22, "triangle", 0.12, i * 0.07)); },
    tada: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.3, "triangle", 0.14, i * 0.09)); },
    tick: () => tone(1200, 900, 0.04, "square", 0.04)
  };
  K.setMuted = m => { K.muted = m; store.set("dl-muted", m); const b = document.getElementById("soundBtn"); if (b) b.innerHTML = m ? K.ICON.mute : K.ICON.sound; };

  /* ---------- confetti ---------- */
  let cc = null, cg = null, bits = [], craf = 0;
  const CONF = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2", "#FF8FB8"];
  K.confetti = (x, y, n = 60) => {
    if (K.CALM) return;
    if (!cc) { cc = document.createElement("canvas"); cc.id = "confetti"; document.body.appendChild(cc); cg = cc.getContext("2d"); }
    const d = Math.min(devicePixelRatio || 1, 2); cc.width = innerWidth * d; cc.height = innerHeight * d;
    x = x ?? innerWidth / 2; y = y ?? innerHeight / 3;
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 7;
      bits.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 6 + Math.random() * 6, h: 4 + Math.random() * 4, c: CONF[i % CONF.length], life: 0 }); }
    if (!craf) craf = requestAnimationFrame(step);
    function step() {
      const d = cc.width / innerWidth; cg.clearRect(0, 0, cc.width, cc.height);
      for (let i = bits.length - 1; i >= 0; i--) { const b = bits[i]; b.life++; b.vy += 0.25; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
        if (b.y > innerHeight + 20 || b.life > 240) { bits.splice(i, 1); continue; }
        cg.save(); cg.translate(b.x * d, b.y * d); cg.rotate(b.r); cg.fillStyle = b.c; cg.fillRect(-b.w * d / 2, -b.h * d / 2, b.w * d, b.h * d); cg.restore(); }
      craf = bits.length ? requestAnimationFrame(step) : 0;
    }
  };

  /* ---------- toy friends: our own little characters, drawn with canvas ---------- */
  K.COLS = { coral: "#FF6B57", sun: "#FFC93C", grass: "#3FBF7F", sky: "#5DB8FF", grape: "#8C6BF2", pink: "#FF8FB8", orange: "#FF9B3D", mint: "#7FE0C2" };
  K.INK = "#1B2547";
  function shapePath(g, shape, w, h) {
    g.beginPath();
    const r = Math.min(w, h) * 0.22;
    if (shape === "ball") { g.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2); }
    else if (shape === "tri") { g.moveTo(0, -h / 2); g.lineTo(w / 2, h / 2); g.lineTo(-w / 2, h / 2); g.closePath(); }
    else if (shape === "dome") { g.moveTo(-w / 2, h / 2); g.lineTo(-w / 2, 0); g.ellipse(0, 0, w / 2, h / 2, 0, Math.PI, 0); g.lineTo(w / 2, h / 2); g.closePath(); }
    else if (shape === "star") { for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? 0.42 : 1; g.lineTo(Math.cos(a) * w / 2 * rr, Math.sin(a) * h / 2 * rr * 1.05 + h * 0.04); } g.closePath(); }
    else if (shape === "heart") { const s = w / 2; g.moveTo(0, h * 0.42); g.bezierCurveTo(-s * 1.4, -h * 0.05, -s * 0.55, -h * 0.62, 0, -h * 0.2); g.bezierCurveTo(s * 0.55, -h * 0.62, s * 1.4, -h * 0.05, 0, h * 0.42); }
    else { g.roundRect ? g.roundRect(-w / 2, -h / 2, w, h, r) : g.rect(-w / 2, -h / 2, w, h); }
  }
  K.shapePath = shapePath;
  /* Each block colour belongs to one of the shop's animals, so a colour still means the same friend in every puzzle.
     The block keeps its shape (the physics and the puzzles use it); the animal is painted on: ears, patches, nose, beak. */
  K.ANIMALS = {
    fox: { ears: "point", tip: "#1B2547", inner: "#FFE3D6", muzzle: "#FFFFFF", nose: true },
    chick: { tuft: true, belly: "#FFE58A", beak: "#FF9B3D" },
    frog: { bumps: true, belly: "#BFF0C9", wide: true },
    whale: { spout: true, belly: "#D6EEFF", lines: true },
    penguin: { mask: "#FFFFFF", beak: "#FFB13D" },
    axolotl: { gills: "#E0457B", spots: "#FF6FA0" },
    kitten: { ears: "point", inner: "#FFC4D6", stripes: "rgba(27,37,71,.32)", nose: "#FF8FB8", whiskers: true },
    bear: { ears: "round", inner: "#E8C9A0", muzzle: "#E8C9A0", nose: true },
    bunny: { ears: "long", inner: "#FFC4D6", nose: "#FF8FB8", whiskers: true }
  };
  K.ANIMAL_OF = { "#ff6b57": "fox", "#ffc93c": "chick", "#3fbf7f": "frog", "#5db8ff": "whale", "#8c6bf2": "penguin", "#ff8fb8": "axolotl",
    "#ff9b3d": "kitten", "#b8834f": "bear", "#f4effa": "bunny", "#7fe0c2": "frog" };
  // y of the top edge of a shape at x (for ears and bumps); null where there is no flat-ish top
  function topAt(shape, w, h, x) {

  document.getElementById("ask").textContent = cur.mid ? K.t("askMid") : K.t("ask");
  document.getElementById("lvl").textContent = K.t("level", level);
  document.getElementById("starCount").textContent = stars;
}
function renderOptions() {
  const box = document.getElementById("options"); box.innerHTML = "";
  cur.options.forEach((f, j) => {
    const b = document.createElement("button"); b.className = "toy"; b.type = "button"; b.dataset.j = j;
    b.setAttribute("aria-label", K.t("friend") + " " + (j + 1)); b.appendChild(friendCanvas(f, 100)); box.appendChild(b);
    attachDrag(b, j);
  });
}
function newLevel() { cur = makeLevel(level); filled = []; wrongs = 0; busy = false; render(); renderOptions(); }
function tryPlace(j, el) {
  if (busy) return;
  const hole = cur.holes.find(i => !filled.includes(i)); if (hole === undefined) return;
  const f = cur.options[j];
  if (!same(f, cur.seq[hole])) {
    wrongs++; el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong"); K.sfx.boing(); toast(K.t("oops"));
    if (wrongs >= 2) { const k = cur.options.findIndex(o => same(o, cur.seq[hole])); const t = document.querySelector(`.toy[data-j="${k}"]`); if (t) { t.classList.remove("hint"); void t.offsetWidth; t.classList.add("hint"); } }
    return;
  }
  busy = true; K.sfx.pop();
  const slotEl = document.querySelector(`.slot[data-i="${hole}"]`), from = el.getBoundingClientRect(), to = slotEl.getBoundingClientRect();
  const fly = el.cloneNode(true); fly.style.cssText = `position:fixed;left:${from.left}px;top:${from.top}px;width:${from.width}px;height:${from.height}px;margin:0;z-index:40;border-color:transparent;background:transparent;box-shadow:none`;
  fly.replaceChild(friendCanvas(f, 100), fly.firstChild); document.body.appendChild(fly);
  const done = () => {
    fly.remove(); filled.push(hole);
    const again = cur.options.filter(o => same(o, f)).length && cur.holes.some(i => !filled.includes(i) && same(cur.seq[i], f));
    render(); const s = document.querySelector(`.slot[data-i="${hole}"]`); s.classList.add("filled");
    const r = s.getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top + r.height / 2, 18);
    if (!again) el.classList.add("used");
    if (cur.holes.every(i => filled.includes(i))) return win();
    busy = false;
  };
  if (K.CALM || !fly.animate) return done();
  fly.animate([{ transform: "translate(0,0) scale(1)" }, { transform: `translate(${to.left + to.width / 2 - from.left - from.width / 2}px,${to.top + to.height / 2 - from.top - from.height / 2}px) scale(${to.width / from.width})` }],
    { duration: 380, easing: "cubic-bezier(.34,1.2,.64,1)" }).onfinish = done;
}
function win() {
  stars++; level++; K.store.set("shelf-level", level); K.store.set("shelf-stars", stars);
  document.getElementById("starCount").textContent = stars;
  const y = K.t("yay"); toast(y[(Math.random() * y.length) | 0]); K.sfx.tada(); K.confetti();
  document.querySelectorAll(".slot").forEach((s, i) => setTimeout(() => s.classList.add("hop"), i * 70));
  setTimeout(newLevel, 1500);
}
// drag a friend from the toy box onto the shelf; a plain tap works too
function attachDrag(b, j) {
  let sx = 0, sy = 0, ghost = null, moved = false;
  b.addEventListener("pointerdown", e => { if (busy) return; sx = e.clientX; sy = e.clientY; moved = false; b.setPointerCapture(e.pointerId); });
  b.addEventListener("pointermove", e => {
    if (!b.hasPointerCapture(e.pointerId)) return;
    if (!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) { moved = true; ghost = document.createElement("div"); ghost.className = "ghost"; ghost.appendChild(friendCanvas(cur.options[j], 90, "wow")); document.body.appendChild(ghost); b.style.opacity = ".35"; }
    if (ghost) { ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px"; }
  });
  const end = e => {
    if (!b.hasPointerCapture(e.pointerId)) return; b.releasePointerCapture(e.pointerId);
    b.style.opacity = "";
    if (ghost) { ghost.remove(); ghost = null; const shelf = document.querySelector(".shelf").getBoundingClientRect();
      if (e.clientY < shelf.bottom + 20 && e.clientY > shelf.top - 40) tryPlace(j, b); }
    else if (!moved) tryPlace(j, b);
  };
  b.addEventListener("pointerup", end); b.addEventListener("pointercancel", e => { if (ghost) { ghost.remove(); ghost = null; } b.style.opacity = ""; });
  b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tryPlace(j, b); } });
}
let toastT = 0;
function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (e.hidden = true), 1500); }

/* ---------- boot ---------- */
K.initBar();
K.onLang = () => { document.getElementById("lvl").textContent = K.t("level", level); if (cur) render(); const s = document.getElementById("startBtn").firstChild; s.textContent = level > 1 ? K.t("cont", level) : K.t("start"); document.getElementById("restartBtn").hidden = level <= 1; };
K.applyWords();
(function introArt() {
  const c = document.getElementById("introArt"), x = c.getContext("2d");
  x.fillStyle = "#E9B97A"; x.strokeStyle = "#1B2547"; x.lineWidth = 5; x.beginPath(); x.roundRect(20, 200, 360, 24, 10); x.fill(); x.stroke();
  const row = [["#FF6B57", "ball"], ["#5DB8FF", "square"], ["#FF6B57", "ball"], ["#5DB8FF", "square"], ["#FF6B57", "ball"]];
  row.forEach(([col, sh], i) => { x.save(); x.translate(56 + i * 66, 168); K.friend(x, { shape: sh, colour: col, w: 56, h: 56, lw: 4 }); x.restore(); });
  x.setLineDash([8, 8]); x.strokeStyle = "rgba(27,37,71,.5)"; x.lineWidth = 4; x.beginPath(); x.roundRect(343, 136, 46, 62, 10); x.stroke(); x.setLineDash([]);
  x.fillStyle = "#FF6B57"; x.font = "800 40px 'Baloo 2', sans-serif"; x.textAlign = "center"; x.fillText("?", 366, 182);
  K.star(x, 60, 60, 18); K.star(x, 330, 50, 13, "#FF8FB8");
})();
const libReady = K.library().then(list => { if (list.length >= 4) COLS = list.map(t => t.slug); });   // the shop's toys are the friends on the shelf
const begin = async () => { K.sfx.pop(); document.getElementById("intro").hidden = true; await libReady; newLevel(); };
document.getElementById("startBtn").onclick = begin;
document.getElementById("restartBtn").onclick = () => { level = 1; stars = 0; K.store.set("shelf-level", 1); K.store.set("shelf-stars", 0); begin(); };
</script>
</body>
