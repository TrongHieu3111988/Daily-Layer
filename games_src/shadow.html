<title>Whose Shadow?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Whose Shadow?: one of the shop's real 3D toys turns slowly as a dark shadow. Tap the friend it belongs to and the lights come on. */
.stage{background:#2B2F5C;display:flex;flex-direction:column}
.spot{position:relative;flex:1;min-height:0}
#view{display:block;width:100%;height:100%;touch-action:manipulation}
.dots{position:absolute;left:0;right:0;top:12px;z-index:3;display:flex;gap:6px;justify-content:center;pointer-events:none}
.dots i{width:14px;height:14px;border-radius:50%;border:2.5px solid #070B1F;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--sun)}
.dots i.now{background:#fff;transform:scale(1.25)}
.ask{position:absolute;left:0;right:0;bottom:10px;z-index:3;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6vw,28px);color:#fff;text-shadow:0 3px 0 #070B1F;pointer-events:none;padding:0 12px}
.picks{display:grid;gap:12px;padding:14px 14px 18px;background:#3A3F78;border-top:3px solid #070B1F}
.picks.n3{grid-template-columns:repeat(3,1fr)}
.picks.n4{grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 10px 16px}
.picks.n4 .pick{font-size:13px;border-radius:18px;padding:5px}
.pick{appearance:none;border:3px solid var(--outline);border-radius:22px;background:#FFF7E6;padding:6px;box-shadow:var(--pop);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:800 15px/1.1 var(--f-display);color:#1B2547;min-height:96px;transition:transform .15s,opacity .3s}
.pick img{width:100%;max-width:120px;aspect-ratio:1;object-fit:cover;border-radius:16px;background:#E2E5E2}
.picks.n4 .pick img{max-width:96px;border-radius:12px}
.pick:active{transform:translateY(3px);box-shadow:var(--pop-sm)}
.pick.no{opacity:.35;pointer-events:none;filter:grayscale(1)}
.pick.yes{background:var(--sun);transform:scale(1.06)}
.pick.hint{animation:wig .6s ease-in-out 3}
.pick.shake{animation:shake .4s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.05)}75%{transform:rotate(6deg) scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;font-family:var(--f-display);font-weight:800;font-size:20px;background:#2B2F5C;color:#fff;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){.pick.hint,.pick.shake{animation:none}.pick.hint{outline:5px solid var(--sun)}}
</style>

<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Whose Shadow?</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 15.8 6.8 18.6l1-5.8-4.3-4.1 5.9-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="total">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="spot">
      <canvas id="view" aria-label="A toy's shadow"></canvas>
      <div class="dots" id="dots"></div>
      <div class="ask" id="ask" data-t="ask">Who is this?</div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="picks n3" id="picks"></div>
    <div class="loading" id="loading" data-t="loading">Turning the lights off…</div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas class="hero" id="introArt" width="400" height="280"></canvas>
    <h2 data-t="introH">Whose Shadow?</h2>
    <p data-t="introP">The lights are off and a toy friend is hiding in the dark. Look at the shadow, then tap the friend it belongs to. Guess right and the lights come on!</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Lights off!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH"></h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
K.words.en = { title: "Whose Shadow?", back: "Back", sound: "Sound on or off", ask: "Who is this?", loading: "Turning the lights off…", introH: "Whose Shadow?",
  introP: "The lights are off and a toy friend is hiding in the dark. Look at the shadow, then tap the friend it belongs to. Guess right and the lights come on!", start: "Lights off!",
  again: "Play again", home: "More games", yes: t => "It's the " + t + "!", tryAgain: "Not this one. Look again!",
  overH: n => n >= 7 ? "Shadow detective!" : n >= 4 ? "Great looking!" : "Well done!", overP: (n, r) => "You found all " + r + " friends, " + n + " on the first try.",
  noLoad: "The game couldn't load. Check the connection and try again." };
K.words.vi = { title: "Bóng Của Ai?", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", ask: "Đây là ai nhỉ?", loading: "Đang tắt đèn…", introH: "Bóng Của Ai?",
  introP: "Đèn tắt rồi, một bạn đồ chơi đang trốn trong bóng tối. Bé nhìn cái bóng rồi chạm vào bạn đúng nhé. Đoán đúng là đèn bật sáng!", start: "Tắt đèn nào!",
  again: "Chơi lại", home: "Trò khác", yes: t => "Đúng rồi, " + t + "!", tryAgain: "Chưa phải bạn này. Nhìn lại nhé!",
  overH: n => n >= 7 ? "Thám tử bóng đêm!" : n >= 4 ? "Bé tinh mắt quá!" : "Giỏi lắm!", overP: (n, r) => "Bé đã tìm ra cả " + r + " bạn, " + n + " bạn đúng ngay lần đầu.",
  noLoad: "Chưa tải được trò chơi. Kiểm tra mạng rồi thử lại." };
// short Vietnamese names for the friends (titles in toys.json are English)
const VI_NAME = { "sculpt-gingerbread": "Bánh Gừng", "sculpt-penguin": "Chim Cánh Cụt", "sculpt-kitten": "Mèo Mướp", "sculpt-frog": "Ếch Cười", "sculpt-fox": "Cáo Con",
  "sculpt-chick": "Gà Con", "sculpt-bunny": "Thỏ Tròn", "sculpt-bear": "Gấu Con", "sculpt-axolotl": "Kỳ Giông", "chibi-whale-4part": "Cá Voi" };
const nameOf = t => K.lang === "vi" && (t.title_vi || VI_NAME[t.slug]) ? (t.title_vi || VI_NAME[t.slug]) : t.title.replace(/\s*\(.*\)\s*/, "");   // title_vi comes with every toy in toys.json
K.initBar(); K.applyWords();
let toastT = 0;
function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (e.hidden = true), 1600); }
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script type="module">
import * as THREE from "three";
/*KIT3D*/

/* ---------- scene: a little round stage under a spotlight ---------- */
const cv = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const DARK = new THREE.Color("#2B2F5C"), LIT = new THREE.Color("#FFE7A8");
scene.background = DARK.clone();
const cam = new THREE.PerspectiveCamera(36, 1, 0.1, 50); cam.position.set(0, 1.25, 4.2); cam.lookAt(0, 0.62, 0);
const hemi = new THREE.HemisphereLight(0xffffff, 0x8C6BF2, 0.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 0.4); sun.position.set(2.5, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2, near: 1, far: 15 }); scene.add(sun);
// glowing back disc (the "light" the shadow stands in front of)
const glow = new THREE.Mesh(new THREE.CircleGeometry(1.25, 64), new THREE.MeshBasicMaterial({ color: "#FFF1C2" }));
glow.position.set(0, 0.75, -1.1); scene.add(glow);
const stageTop = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.3, 0.16, 64), new THREE.MeshStandardMaterial({ color: "#8C6BF2", roughness: 0.6 }));
stageTop.position.y = -0.08; stageTop.receiveShadow = true; scene.add(stageTop);
const rim = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.04, 8, 64), new THREE.MeshStandardMaterial({ color: "#FFC93C", roughness: 0.4 }));
rim.rotation.x = Math.PI / 2; rim.position.y = 0.0; scene.add(rim);
// little stars twinkling around (original decoration)
const starMat = new THREE.MeshBasicMaterial({ color: "#FFE58A" }), stars = [];
for (let i = 0; i < 14; i++) { const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.035 + Math.random() * 0.03), starMat); s.position.set((Math.random() - 0.5) * 5, 0.3 + Math.random() * 2.2, -1.6 - Math.random()); s.userData.ph = Math.random() * 6; scene.add(s); stars.push(s); }
const shadowMat = new THREE.MeshBasicMaterial({ color: "#14162E" });

/* ---------- rounds ---------- */
const ROUNDS = 8;
let toys = [], order = [], round = 0, cur = null, mesh = null, holder = new THREE.Group(), lit = 0, litTarget = 0, firstTry = 0, misses = 0, busy = false, hop = 0;
scene.add(holder);
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
function dots() { document.getElementById("dots").innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join(""); }
async function showRound() {
  busy = false; misses = 0; litTarget = 0; lit = 0; hop = 0;
  cur = order[round % order.length];
  if (mesh) { holder.remove(mesh); }
  mesh = await toyMesh(cur); mesh.material = shadowMat; mesh.castShadow = true;
  const bb = mesh.geometry.boundingBox, s = Math.min(1.35 / (bb.max.y - bb.min.y), 1.7 / Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z));   // wide toys (the whale) fit the stage too
  mesh.scale.setScalar(s); mesh.position.set(0, 0, 0);
  holder.rotation.y = K.CALM ? -0.5 : Math.random() * 6.28; holder.add(mesh);
  // 3 friends to pick from for the first rounds, then 4
  const n = Math.min(round < 3 ? 3 : 4, toys.length), others = shuffle(toys.filter(t => t !== cur)).slice(0, n - 1), picks = shuffle([cur, ...others]);
  const box = document.getElementById("picks"); box.className = "picks n" + (n === 4 ? 4 : 3);
  box.innerHTML = picks.map((t, i) => `<button class="pick" type="button" data-slug="${t.slug}" data-i="${i}"><img alt="" src="${assetURL(t.cover)}"><span>${nameOf(t)}</span></button>`).join("");
  box.querySelectorAll(".pick").forEach(b => b.onclick = () => choose(b));
  document.getElementById("ask").textContent = K.t("ask"); dots();
}
function choose(b) {
  if (busy) return;
  if (b.dataset.slug === cur.slug) {
    busy = true; if (!misses) firstTry++;
    b.classList.add("yes"); mesh.material = toyMat(); litTarget = 1; hop = 1;
    document.getElementById("total").textContent = round + 1;
    document.getElementById("ask").textContent = K.t("yes", nameOf(cur));
    K.sfx.chime(); const r = b.getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top, 40);
    setTimeout(next, 1900);
  } else {
    misses++; K.sfx.boing(); b.classList.add("shake", "no"); toast(K.t("tryAgain"));
    if (misses >= 2) document.querySelector(`.pick[data-slug="${cur.slug}"]`).classList.add("hint");   // gentle help, never a fail screen
  }
}
async function next() {
  round++;
  if (round >= ROUNDS) return gameOver();
  await showRound();
}
async function newGame() {
  round = 0; firstTry = 0; document.getElementById("total").textContent = 0; document.getElementById("over").hidden = true;
  const featured = toys.find(t => t.featured), rest = shuffle(toys.filter(t => t !== featured));
  order = featured ? [featured, ...rest] : rest;
  await showRound();
}
function gameOver() {
  dots();
  const st = firstTry >= 7 ? 3 : firstTry >= 4 ? 2 : 1;   // everyone who finishes gets at least one star
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < st)).join("");
  document.getElementById("overH").textContent = K.t("overH", firstTry); document.getElementById("overP").textContent = K.t("overP", firstTry, ROUNDS);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti();
}

/* ---------- loop ---------- */
function resize() { const r = cv.getBoundingClientRect(); if (!r.width) return; renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height;
  cam.fov = cam.aspect < 0.9 ? 36 / Math.max(0.55, cam.aspect / 0.9) : 36; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv); resize();
let last = performance.now();
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (litTarget) { const front = Math.round(holder.rotation.y / 6.2832) * 6.2832; holder.rotation.y += (front - holder.rotation.y) * Math.min(1, dt * 3); }   // turn to face the child
  else if (!K.CALM) holder.rotation.y += dt * 0.55;
  lit += (litTarget - lit) * Math.min(1, dt * (K.CALM ? 30 : 4));
  scene.background.copy(DARK).lerp(LIT, lit);
  hemi.intensity = 0.25 + 1.35 * lit; sun.intensity = 0.4 + 1.8 * lit;
  glow.material.color.set("#FFF1C2").lerp(new THREE.Color("#FFFFFF"), lit);
  if (hop > 0 && !K.CALM) { hop = Math.max(0, hop - dt * 1.4); holder.position.y = Math.abs(Math.sin((1 - hop) * Math.PI * 2)) * 0.25 * hop; } else holder.position.y = 0;
  for (const s of stars) s.scale.setScalar(K.CALM ? 1 : 0.7 + 0.4 * Math.sin(now / 400 + s.userData.ph));
  renderer.render(scene, cam);
})(performance.now());

/* ---------- boot ---------- */
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL : "/#play";
document.getElementById("back").href = window.SHOP_URL || "/";
document.getElementById("langBtn").addEventListener("click", () => { document.querySelectorAll(".pick").forEach(b => { const t = toys.find(x => x.slug === b.dataset.slug); if (t) b.querySelector("span").textContent = nameOf(t); });
  if (!busy) document.getElementById("ask").textContent = K.t("ask"); });
(async () => {
  try { toys = (await loadToyList()).toys; await Promise.all(toys.map(toyGeometry)); }
  catch (e) { document.getElementById("loading").textContent = K.t("noLoad"); return; }
  document.getElementById("loading").hidden = true;
  await newGame();
  // intro art: three friends as dark shadows, the middle one lit up
  const c = document.getElementById("introArt"), x = c.getContext("2d");
  x.fillStyle = "#2B2F5C"; x.fillRect(0, 0, 400, 280); x.fillStyle = "#FFF1C2"; x.beginPath(); x.arc(200, 140, 105, 0, 7); x.fill();
  const imgs = await Promise.all(toys.slice(0, 3).map(t => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = assetURL(t.cover); })));
  [[80, 150, 1], [200, 140, 0], [320, 150, 1]].forEach(([px, py, dark], i) => { const im = imgs[i]; if (!im) return; x.save(); x.beginPath(); x.arc(px, py, 58, 0, 7); x.clip(); x.drawImage(im, px - 58, py - 58, 116, 116);
    if (dark) { x.globalCompositeOperation = "multiply"; x.fillStyle = "#3A3F78"; x.fillRect(px - 58, py - 58, 116, 116); } x.restore(); x.lineWidth = 5; x.strokeStyle = "#1B2547"; x.beginPath(); x.arc(px, py, 58, 0, 7); x.stroke(); });
})();
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); document.getElementById("intro").hidden = true; };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); newGame(); };
window.__game = { answer: () => cur && cur.slug, round: () => round, firstTry: () => firstTry, ready: () => !!mesh };   // used by automated play tests
</script>
