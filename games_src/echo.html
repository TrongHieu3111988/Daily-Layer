<title>Toy Echo Pattern</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Toy Echo Pattern: toy friends light up and sing in a short order; tap them in the same order. */
.stage{background:linear-gradient(#DDF3FF,#F1FAFF 55%,#D7EEDB);display:flex;flex-direction:column;align-items:center;overflow:hidden}
:root[data-theme="dark"] .stage{background:linear-gradient(#1D2747,#27335A 55%,#1F3330)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(#1D2747,#27335A 55%,#1F3330)}}
.round{display:flex;justify-content:center;gap:8px;padding:10px 12px 0}
.round i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--outline);background:var(--paper)}
.round i.on{background:var(--grass)}.round i.now{background:var(--sun)}
.say{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 14px 0;padding:8px 18px;background:var(--paper);border:3px solid var(--outline);border-radius:26px;box-shadow:var(--pop-sm);min-height:64px;max-width:94%}
.say b{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:23px;line-height:1.15;color:var(--outline);text-align:center}
.say .eye,.say .ear{width:34px;height:34px;flex:none;display:none}
.say.watch .eye,.say.turn .ear{display:block}
.dots{display:flex;gap:10px;justify-content:center;margin-top:10px;min-height:26px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--outline);background:var(--paper);transition:transform .2s,background .2s}
.dots i.done{background:var(--grass);transform:scale(1.15)}
.board{flex:1;min-height:0;width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 18px 22px;align-content:center}
.pad{position:relative;aspect-ratio:1/1.05;border:4px solid var(--outline);border-radius:30px;background:var(--c);box-shadow:0 6px 0 var(--outline);padding:0;touch-action:manipulation;cursor:pointer;transition:transform .12s,box-shadow .12s,filter .2s;filter:saturate(.75) brightness(.97);overflow:visible}
.pad:active{transform:translateY(4px);box-shadow:0 2px 0 var(--outline)}
.pad img{position:absolute;left:10%;top:6%;width:80%;height:84%;object-fit:contain;pointer-events:none;transition:transform .2s}
.pad.lit{filter:saturate(1.2) brightness(1.12);box-shadow:0 6px 0 var(--outline),0 0 0 6px #fff,0 0 34px 10px var(--c)}
.pad.lit img{animation:sing .55s ease}
.pad.hint{animation:glow 1s ease-in-out infinite}
.pad.no{animation:shk .4s ease}
.pad .note{position:absolute;right:8%;top:6%;width:22%;opacity:0;pointer-events:none}
.pad.lit .note{animation:fly .7s ease-out}
.board.n3 .pad:nth-child(3){grid-column:1/3;justify-self:center;width:calc(50% - 8px)}
.board.off .pad{cursor:default}
@keyframes sing{0%,100%{transform:translateY(0)}40%{transform:translateY(-14%) scale(1.1)}70%{transform:translateY(0) scale(.95,1.05)}}
@keyframes fly{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(30%,-90%) rotate(15deg)}}
@keyframes glow{0%,100%{box-shadow:0 6px 0 var(--outline),0 0 0 0 #FFC93C}50%{box-shadow:0 6px 0 var(--outline),0 0 0 9px #FFC93C}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.pad.lit img,.pad.lit .note,.pad.hint,.pad.no{animation:none}.pad.hint{box-shadow:0 6px 0 var(--outline),0 0 0 8px #FFC93C}}
</style>
<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Toy Echo Pattern</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6L12 16.6 6.5 19.6l1.2-6L3.2 9.4l6.1-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="count">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="round" id="round" aria-hidden="true"></div>
    <div class="say" id="sayBox">
      <svg class="eye" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 17 Q17 4 31 17 Q17 30 3 17Z" fill="#fff" stroke="#1B2547" stroke-width="3"/><circle cx="17" cy="17" r="6" fill="#1B2547"/><circle cx="19" cy="15" r="2" fill="#fff"/></svg>
      <svg class="ear" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="14" fill="none" stroke="#FFC93C" stroke-width="3" opacity=".7"/><circle cx="17" cy="17" r="8" fill="#FFC93C" stroke="#1B2547" stroke-width="3"/></svg>
      <b id="ask" aria-live="polite"></b>
    </div>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <div class="board off" id="board"></div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas id="introArt" width="400" height="260" style="width:100%;max-width:320px;height:auto"></canvas>
    <h2 data-t="introH">Sing it back!</h2>
    <p data-t="introP">Watch the toy friends light up and sing, one after another. Then tap them in the same order.</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's sing!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH">Super song!</h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
"use strict";
K.words.en = { title: "Toy Echo Pattern", back: "Back", sound: "Sound on or off", introH: "Sing it back!", introP: "Watch the toy friends light up and sing, one after another. Then tap them in the same order.", start: "Let's sing!", again: "Play again", home: "More games",
  watch: "Watch and listen!", turn: "Your turn! Tap them in order.", again2: "Oops! Watch once more.", good: "Yes!", yay: "Perfect echo!",
  overH: s => s >= 3 ? "Super song!" : s >= 2 ? "Lovely singing!" : "You sang them all!", overP: n => "You echoed " + n + " songs with your toy friends." };
K.words.vi = { title: "Nhại Theo Đồ Chơi", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", introH: "Hát lại nào!", introP: "Nhìn các bạn đồ chơi sáng lên và hát lần lượt. Rồi chạm vào các bạn theo đúng thứ tự.", start: "Hát nào!", again: "Chơi lại", home: "Trò khác",
  watch: "Nhìn và nghe nhé!", turn: "Đến lượt bé! Chạm theo thứ tự.", again2: "Ôi! Xem lại lần nữa nhé.", good: "Đúng rồi!", yay: "Nhại hay quá!",
  overH: s => s >= 3 ? "Bài hát tuyệt vời!" : s >= 2 ? "Bé hát hay lắm!" : "Bé hát hết rồi!", overP: n => "Bé đã nhại theo " + n + " bài hát cùng các bạn đồ chơi." };

// [friends on the board, length of the song] per round
const ROUNDS = [[3, 2], [3, 2], [3, 3], [4, 3], [4, 3], [4, 4]];
const PADS = ["#FF8A78", "#7CC7FF", "#7BD69B", "#FFD45C"], NOTES = [523.25, 659.25, 783.99, 1046.5];
let toys = [], round = 0, song = [], step = 0, misses = 0, totalMiss = 0, running = false, locked = true, sung = 0, pads = [], timers = [];
const wait = ms => new Promise(r => timers.push(setTimeout(r, ms)));
function pick(a, n) { return a.slice().sort(() => Math.random() - .5).slice(0, n); }
const noteSVG = '<svg class="note" viewBox="0 0 24 30" aria-hidden="true"><path d="M8 24 V5 L21 2 V20" fill="none" stroke="#1B2547" stroke-width="3" stroke-linejoin="round"/><ellipse cx="5" cy="24" rx="5" ry="4" fill="#1B2547"/><ellipse cx="18" cy="21" rx="5" ry="4" fill="#1B2547"/></svg>';
function say(k, mode) { document.getElementById("ask").textContent = K.t(k); document.getElementById("sayBox").className = "say " + (mode || ""); }
function dots() { document.getElementById("dots").innerHTML = song.map((_, i) => `<i class="${i < step ? "done" : ""}"></i>`).join(""); }
async function light(p, ms = 560) {
  p.el.classList.remove("lit"); void p.el.offsetWidth; p.el.classList.add("lit"); K.sfx.note(NOTES[p.i]);
  await wait(ms); p.el.classList.remove("lit");
}
async function play() {
  locked = true; document.getElementById("board").classList.add("off"); step = 0; dots(); say("watch", "watch");
  pads.forEach(p => p.el.classList.remove("hint"));
  await wait(900);
  for (const i of song) { if (!running) return; await light(pads[i], K.CALM ? 750 : 600); await wait(K.CALM ? 350 : 260); }
  if (!running) return;
  say("turn", "turn"); document.getElementById("board").classList.remove("off"); locked = false;
  if (misses >= 2) pads[song[0]].el.classList.add("hint");
}
async function deal() {
  const [n, len] = ROUNDS[round], set = pick(toys, Math.min(n, toys.length)); misses = 0;
  document.getElementById("round").innerHTML = ROUNDS.map((_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join("");
  const board = document.getElementById("board"); board.innerHTML = ""; board.className = "board off n" + set.length;
  pads = set.map((t, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "pad"; b.style.setProperty("--c", PADS[i]); b.setAttribute("aria-label", K.toyName(t));
    const im = document.createElement("img"); im.src = t.img.src; im.alt = ""; im.draggable = false; b.appendChild(im); b.insertAdjacentHTML("beforeend", noteSVG);
    board.appendChild(b); const p = { el: b, toy: t, i }; b.onclick = () => tap(p); return p;
  });
  // a short song: never the same friend twice in a row, so every step is a clear move
  song = []; for (let k = 0; k < len; k++) { let j; do { j = Math.floor(Math.random() * pads.length); } while (song.length && j === song[song.length - 1]); song.push(j); }
  await play();
}
async function tap(p) {
  if (!running || locked) return;
  pads.forEach(o => o.el.classList.remove("hint"));
  if (p.i === song[step]) {
    light(p, 420); step++; dots();
    if (step === song.length) {
      locked = true; sung++; document.getElementById("count").textContent = sung; say("yay");
      await wait(500); K.sfx.chime(); pads.forEach(o => { o.el.classList.add("lit"); });
      const r = document.getElementById("board").getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top + r.height / 2, 40);
      await wait(1300); if (!running) return; pads.forEach(o => o.el.classList.remove("lit"));
      if (round < ROUNDS.length - 1) { round++; deal(); } else finish();
    } else if (misses >= 2) pads[song[step]].el.classList.add("hint");
  } else {
    locked = true; misses++; totalMiss++; p.el.classList.add("no"); K.sfx.boing(); say("again2");
    await wait(450); p.el.classList.remove("no"); await wait(500); if (!running) return;
    play();
  }
}
function finish() {
  running = false; const stars = totalMiss <= 1 ? 3 : totalMiss <= 4 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", sung);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start(list) {
  toys = list.filter(t => t.img); if (toys.length < 3) return;
  timers.forEach(clearTimeout); timers = [];
  round = 0; sung = 0; totalMiss = 0; running = true; document.getElementById("count").textContent = "0";
  document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; deal();
}
K.initBar(); K.onLang = () => { pads.forEach(p => p.el.setAttribute("aria-label", K.toyName(p.toy))); if (running) say(locked ? "watch" : "turn", locked ? "watch" : "turn"); }; K.applyWords();
function introArt(list) {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  const ts = (list || []).filter(t => t.img).slice(0, 3);
  [0, 1, 2].forEach(i => { const cx = 80 + i * 120, cy = 140, lit = i === 1;
    x.save(); x.translate(cx, cy);
    if (lit) { x.shadowColor = PADS[i]; x.shadowBlur = 30; }
    x.fillStyle = PADS[i]; x.strokeStyle = K.INK; x.lineWidth = 5;
    x.beginPath(); x.roundRect(-52, -60, 104, 112, 24); x.fill(); x.shadowBlur = 0; x.stroke();
    if (ts[i]) x.drawImage(ts[i].img, -42, lit ? -66 : -52, 84, 92);
    x.fillStyle = K.INK; x.font = "800 30px 'Baloo 2', sans-serif"; x.textAlign = "center"; x.fillText(String([2, 1, 3][i]), 0, 92);
    x.restore(); });
  x.fillStyle = K.INK; [[150, 52], [262, 40]].forEach(([a, b]) => { x.beginPath(); x.ellipse(a, b, 7, 5, -0.3, 0, 7); x.fill(); x.fillRect(a + 4, b - 26, 3, 26); });
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => introArt(list));
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
