<title>Toy Bakery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Toy Bakery: a toy friend orders a cake by picture; tap the toppings it asked for. */
.stage{background:linear-gradient(#FFF1D6,#FFD9E4);display:flex;flex-direction:column;align-items:center}
:root[data-theme="dark"] .stage{background:linear-gradient(#2A1B3F,#1B1F44)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(#2A1B3F,#1B1F44)}}
.round{display:flex;justify-content:center;gap:8px;padding:10px 12px 0}
.round i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--outline);background:var(--paper)}
.round i.on{background:var(--grass)}.round i.now{background:var(--sun)}
.order{display:flex;align-items:center;gap:10px;padding:8px 14px 0;width:100%;justify-content:center}
.who{width:96px;height:96px;flex:none}.who.hop{animation:hop .6s ease 2}
.who canvas{width:100%;height:100%;display:block}
.bubble{position:relative;display:flex;gap:8px;align-items:center;min-height:84px;padding:10px 14px;background:var(--paper);border:3px solid var(--outline);border-radius:24px;box-shadow:var(--pop-sm)}
.bubble:before{content:"";position:absolute;left:-12px;top:50%;margin-top:-9px;width:18px;height:18px;background:var(--paper);border-left:3px solid var(--outline);border-bottom:3px solid var(--outline);transform:rotate(45deg)}
.bubble .it{position:relative;width:60px;height:60px}.bubble .it canvas{width:100%;height:100%;display:block}
.bubble .it.got{opacity:.35}.bubble .it.got:after{content:"\2713";position:absolute;inset:0;display:grid;place-items:center;font:800 34px 'Baloo 2',sans-serif;color:var(--good)}
.ask{text-align:center;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;padding:8px 12px 0;color:var(--outline);min-height:34px}
.cakewrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center;position:relative}
#cake{width:min(100%,380px);height:auto;aspect-ratio:660/460}
.cakewrap.bake #cake{animation:glow .9s ease 2}
@keyframes glow{50%{filter:brightness(1.25) drop-shadow(0 0 14px #FFC93C)}}
.ding{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:800 34px 'Baloo 2',sans-serif;color:var(--coral);-webkit-text-stroke:2px var(--outline);paint-order:stroke fill;opacity:0}
.cakewrap.bake .ding{animation:dingup 1.4s ease}
@keyframes dingup{15%{opacity:1;transform:translateX(-50%) scale(1.25)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.tops{display:flex;gap:12px;justify-content:center;padding:6px 12px 16px}
.tops button{width:92px;height:92px;border:3px solid var(--outline);border-radius:22px;background:var(--paper);box-shadow:0 5px 0 var(--outline);padding:6px;touch-action:manipulation}
.tops button canvas{width:100%;height:100%;display:block;pointer-events:none}
.tops button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--outline)}
.tops button.no{animation:shk .4s ease;background:#FFE2EC}
.tops button.hint{animation:hint .6s ease infinite;background:#FFF3BF}
@keyframes hint{50%{transform:scale(1.1)}}
@keyframes hop{40%{transform:translateY(-16px) scale(1.1)}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.who.hop,.tops button.no,.tops button.hint,.cakewrap.bake #cake,.cakewrap.bake .ding{animation:none}}
</style>
<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Toy Bakery</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6L12 16.6 6.5 19.6l1.2-6L3.2 9.4l6.1-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="count">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="round" id="round" aria-hidden="true"></div>
    <div class="order"><div class="who" id="who"><canvas id="whoC"></canvas></div><div class="bubble" id="bubble"></div></div>
    <div class="ask" id="ask"></div>
    <div class="cakewrap" id="cw"><canvas id="cake" width="660" height="460"></canvas><div class="ding" id="ding">Ding!</div></div>
    <div class="tops" id="tops"></div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas class="hero" id="introArt" width="400" height="280"></canvas>
    <h2 data-t="introH">Order up!</h2>
    <p data-t="introP">A toy friend wants a cake! Tap the toppings in its order bubble.</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's bake!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH">Yummy!</h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
"use strict";
K.words.en = { title: "Toy Bakery", back: "Back", sound: "Sound on or off", introH: "Order up!", introP: "A toy friend wants a cake! Tap the toppings in its order bubble.", start: "Let's bake!", again: "Play again", home: "More games",
  ask: n => n + " would like a cake!", more: "Add the rest!", ding: "Ding!", no: "Not that one!", done: n => n + " loves the cake!", overH: s => s >= 3 ? "Super baker!" : s >= 2 ? "Yummy!" : "Cakes are ready!", overP: n => "You baked " + n + " cakes for your toy friends." };
K.words.vi = { title: "Tiệm Bánh Đồ Chơi", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", introH: "Có khách đặt bánh!", introP: "Một bạn đồ chơi muốn ăn bánh! Chạm các món trang trí trong bong bóng đặt hàng.", start: "Làm bánh thôi!", again: "Chơi lại", home: "Trò khác",
  ask: n => n + " muốn một chiếc bánh!", more: "Thêm món còn lại nhé!", ding: "Ting!", no: "Không phải món này!", done: n => n + " rất thích bánh!", overH: s => s >= 3 ? "Thợ bánh siêu giỏi!" : s >= 2 ? "Ngon quá!" : "Bánh xong rồi!", overP: n => "Bé đã làm " + n + " chiếc bánh cho các bạn đồ chơi." };

const KINDS = ["berry", "candle", "star"], ROUNDS = [1, 2, 2, 3, 3], SLOTX = { 1: [0.5], 2: [0.36, 0.64], 3: [0.27, 0.5, 0.73] };
let toys = [], round = 0, order = [], placed = [], toy = null, wrongs = 0, totalWrong = 0, running = false, locked = false, done = 0;
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function nameOf() { return toy && toy.t ? K.toyName(toy.t) : "★"; }
function ink(g) { g.strokeStyle = K.INK; g.lineWidth = 4; g.lineJoin = "round"; g.lineCap = "round"; }
function drawTop(g, kind, cx, cy, s) {   // a topping centred on (cx, cy), about s px tall
  g.save(); g.translate(cx, cy); g.scale(s / 100, s / 100); ink(g);
  if (kind === "berry") {
    g.fillStyle = "#FF4B5C"; g.beginPath(); g.moveTo(0, 44); g.bezierCurveTo(-52, 14, -46, -36, 0, -30); g.bezierCurveTo(46, -36, 52, 14, 0, 44); g.fill(); g.stroke();
    g.fillStyle = "#FFE3A0"; [[-18, -4], [16, -8], [0, 14], [-12, 24], [14, 20]].forEach(([x, y]) => { g.beginPath(); g.ellipse(x, y, 3, 4.5, 0, 0, 7); g.fill(); });
    g.fillStyle = "#3FBF7F"; g.beginPath(); g.moveTo(0, -26); g.lineTo(-20, -42); g.lineTo(-6, -34); g.lineTo(0, -50); g.lineTo(6, -34); g.lineTo(20, -42); g.closePath(); g.fill(); g.stroke();
  } else if (kind === "candle") {
    g.fillStyle = "#FF8FB8"; g.beginPath(); g.roundRect(-13, -10, 26, 56, 6); g.fill(); g.stroke();
    g.strokeStyle = "#fff"; g.lineWidth = 5; for (let y = 0; y < 3; y++) { g.beginPath(); g.moveTo(-13, 4 + y * 16); g.lineTo(13, -4 + y * 16); g.stroke(); } ink(g);
    g.beginPath(); g.moveTo(0, -10); g.lineTo(0, -20); g.stroke();
    g.fillStyle = "#FFC93C"; g.beginPath(); g.moveTo(0, -52); g.bezierCurveTo(22, -34, 14, -18, 0, -18); g.bezierCurveTo(-14, -18, -22, -34, 0, -52); g.fill(); g.stroke();
  } else {
    g.fillStyle = "#FFC93C"; g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 22 : 48; g.lineTo(Math.cos(a) * r, Math.sin(a) * r + 4); } g.closePath(); g.fill(); g.stroke();
  }
  g.restore();
}
function sizeCanvas(c) { const r = c.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); c.width = Math.max(40, Math.round(r.width * d)); c.height = Math.max(40, Math.round(r.height * d)); return c.getContext("2d"); }
function icon(c, kind) { const g = sizeCanvas(c); drawTop(g, kind, c.width / 2, c.height / 2, Math.min(c.width, c.height) * 0.86); }
function paintToy() {
  const c = document.getElementById("whoC"), g = sizeCanvas(c), W = c.width, H = c.height;
  if (toy.t && toy.t.img) { const im = toy.t.img, k = Math.min(W, H) * 0.96 / Math.max(im.width, im.height); g.drawImage(im, (W - im.width * k) / 2, (H - im.height * k) / 2, im.width * k, im.height * k); }
  else { const s = Math.min(W, H) / 90; g.save(); g.translate(W / 2, H / 2); g.scale(s, s); K.friend(g, { shape: "square", w: 62, h: 62, colour: toy.colour, mood: "happy", lw: 3.5 }); g.restore(); }
}
function paintCake(glow) {
  const c = document.getElementById("cake"), g = c.getContext("2d"), W = c.width, H = c.height; g.clearRect(0, 0, W, H); ink(g);
  const x0 = W * 0.14, x1 = W * 0.86, top = H * 0.5, bot = H * 0.86;
  g.fillStyle = "#E9E4F5"; g.beginPath(); g.ellipse(W / 2, bot + 6, W * 0.46, H * 0.07, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = "#E9B97A"; g.beginPath(); g.roundRect(x0, top, x1 - x0, bot - top, 18); g.fill(); g.stroke();
  g.fillStyle = "#C98E4F"; g.fillRect(x0 + 3, top + (bot - top) * 0.5 - 4, x1 - x0 - 6, 8);
  g.fillStyle = "#FFF4E8"; g.beginPath(); g.roundRect(x0 - 6, top - 18, x1 - x0 + 12, 46, 20); g.fill(); g.stroke();
  g.fillStyle = "#FFF4E8"; for (let i = 0; i < 5; i++) { const x = x0 + 26 + i * (x1 - x0 - 52) / 4; g.beginPath(); g.roundRect(x - 10, top + 14, 20, 28 + (i % 2) * 14, 10); g.fill(); g.stroke(); }
  g.fillStyle = "#FFF4E8"; g.beginPath(); g.roundRect(x0 - 6, top - 18, x1 - x0 + 12, 46, 20); g.fill();
  g.beginPath(); g.roundRect(x0 - 6, top - 18, x1 - x0 + 12, 46, 20); g.stroke();
  placed.forEach((kind, i) => drawTop(g, kind, W * SLOTX[order.length][i], top - 30, H * 0.3));
}
function deal() {
  const n = ROUNDS[round]; order = KINDS.slice().sort(() => Math.random() - .5).slice(0, n); placed = []; wrongs = 0; locked = false;
  toy = toys.length ? { t: toys[rnd(0, toys.length - 1)] } : { colour: ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF"][rnd(0, 3)] };
  document.getElementById("round").innerHTML = ROUNDS.map((_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join("");
  document.getElementById("who").classList.remove("hop"); document.getElementById("cw").classList.remove("bake");
  const bub = document.getElementById("bubble"); bub.innerHTML = ""; order.forEach(k => { const d = document.createElement("div"); d.className = "it"; d.dataset.k = k; d.appendChild(document.createElement("canvas")); bub.appendChild(d); });
  const tops = document.getElementById("tops"); tops.innerHTML = "";
  KINDS.forEach(k => { const b = document.createElement("button"); b.type = "button"; b.dataset.k = k; b.setAttribute("aria-label", k); b.appendChild(document.createElement("canvas")); b.onclick = () => tap(k, b); tops.appendChild(b); });
  requestAnimationFrame(() => { paintToy(); bub.querySelectorAll(".it").forEach(d => icon(d.firstChild, d.dataset.k)); tops.querySelectorAll("button").forEach(b => icon(b.firstChild, b.dataset.k)); paintCake(); });
  document.getElementById("ask").textContent = K.t("ask", nameOf());
}
function tap(k, b) {
  if (!running || locked) return;
  if (order.includes(k) && !placed.includes(k)) {
    placed.push(k); K.sfx.pop(); paintCake(); document.querySelectorAll("#tops .hint").forEach(x => x.classList.remove("hint"));
    document.querySelector(`#bubble .it[data-k="${k}"]`).classList.add("got");
    if (placed.length === order.length) finishCake(); else document.getElementById("ask").textContent = K.t("more");
  } else {
    wrongs++; totalWrong++; b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); K.sfx.thud();
    document.getElementById("ask").textContent = K.t("no");
    if (wrongs >= 3) { const need = order.find(x => !placed.includes(x)); document.querySelector(`#tops button[data-k="${need}"]`).classList.add("hint"); }
  }
}
function finishCake() {
  locked = true; done++; document.getElementById("count").textContent = done;
  document.getElementById("cw").classList.add("bake"); document.getElementById("ding").textContent = K.t("ding");
  setTimeout(() => { K.sfx.chime(); document.getElementById("who").classList.add("hop"); document.getElementById("ask").textContent = K.t("done", nameOf()); if (!K.CALM) K.confetti(innerWidth / 2, innerHeight * 0.4, 40); }, 500);
  setTimeout(() => { if (round < ROUNDS.length - 1) { round++; deal(); } else finish(); }, 2400);
}
function finish() {
  running = false; const stars = totalWrong <= 1 ? 3 : totalWrong <= 5 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", ROUNDS.length);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start() { round = 0; done = 0; totalWrong = 0; running = true; document.getElementById("count").textContent = "0"; document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; deal(); }

K.initBar(); K.onLang = () => { if (running && toy && !locked) document.getElementById("ask").textContent = placed.length ? K.t("more") : K.t("ask", nameOf()); }; K.applyWords();
function introArt() {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height); const t = toys[0];
  if (t && t.img) x.drawImage(t.img, 40, 60, 130, 130); else { x.save(); x.translate(100, 130); x.scale(1.4, 1.4); K.friend(x, { shape: "square", w: 62, h: 62, colour: "#FF6B57", mood: "happy", lw: 3.5 }); x.restore(); }
  x.fillStyle = "#fff"; x.strokeStyle = K.INK; x.lineWidth = 4; x.beginPath(); x.roundRect(190, 60, 190, 100, 24); x.fill(); x.stroke();
  drawTop(x, "berry", 240, 112, 62); drawTop(x, "candle", 285, 112, 62); drawTop(x, "star", 335, 112, 56);
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => { toys = list.filter(t => t.img); introArt(); });
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
