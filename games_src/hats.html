<title>Toy Dress-up Hats</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Toy Dress-up Hats: each hat has the colour of one toy friend; drag it (or tap it, then tap the friend) onto the friend of the same colour. */
.stage{background:linear-gradient(#DDF3FF,#F4FBFF 50%,#FFE7F0);display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:none}
:root[data-theme="dark"] .stage{background:linear-gradient(#1E2A44,#283656 50%,#3A2840)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(#1E2A44,#283656 50%,#3A2840)}}
.round{display:flex;justify-content:center;gap:8px;padding:10px 12px 0}
.round i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--outline);background:var(--paper)}
.round i.on{background:var(--grass)}.round i.now{background:var(--sun)}
.say{margin:10px 14px 0;padding:8px 18px;background:var(--paper);border:3px solid var(--outline);border-radius:26px;box-shadow:var(--pop-sm);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:21px;line-height:1.2;color:var(--outline);text-align:center;min-height:50px;display:flex;align-items:center}
.say:empty{visibility:hidden}
.rack{display:flex;justify-content:center;gap:14px;margin-top:14px;padding:10px 14px 6px;min-height:112px;border-bottom:8px solid #B9875A;border-radius:0 0 6px 6px;width:min(92%,460px)}
.hat{width:96px;height:92px;padding:0;border:0;background:none;touch-action:none;cursor:grab;transition:transform .25s,opacity .25s}
.hat svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.hat.sel svg{filter:drop-shadow(0 0 7px #FFC93C) drop-shadow(0 0 3px #FFC93C)}
.hat.sel{transform:translateY(-8px) scale(1.08)}
.hat.used{opacity:0;pointer-events:none}
.hat.back{animation:shk .4s ease}
.ghost{position:fixed;width:96px;height:92px;pointer-events:none;z-index:40;transform:translate(-50%,-60%) scale(1.1)}
.ghost svg{width:100%;height:100%;display:block;overflow:visible}
.floor{position:relative;flex:1;min-height:0;width:100%}
.mat{position:absolute;left:2%;right:2%;bottom:18%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#C9E9A8,#8FCB6A);border:3px solid rgba(27,37,71,.4);opacity:.9}
:root[data-theme="dark"] .mat{opacity:.55}
.pal{position:absolute;padding:0;border:0;background:none;touch-action:none}
.pal .disc{position:absolute;left:6%;right:6%;bottom:-4%;height:20%;border-radius:50%;border:3px solid var(--outline)}
.pal .toy{position:absolute;left:4%;right:4%;bottom:4%;height:84%}
.pal .toy img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;pointer-events:none}
.pal .on{position:absolute;left:24%;width:52%;top:-14%;height:42%;pointer-events:none;transform-origin:50% 100%}
.pal .on svg{width:100%;height:100%;display:block;overflow:visible}
.pal .on:empty{display:none}
.pal.drop .on{animation:plop .5s cubic-bezier(.3,1.6,.5,1)}
.pal.hop .toy,.pal.hop .on{animation:hop .8s ease}
.pal.no{animation:shk .4s ease}
.pal.hint .disc{animation:glow 1s ease-in-out infinite}
.pal.over .disc{box-shadow:0 0 0 6px rgba(255,201,60,.8)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,60,.9)}50%{box-shadow:0 0 0 12px rgba(255,201,60,.9)}}
@keyframes plop{0%{transform:translateY(-60%) scale(1.3)}100%{transform:none}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-22%)}70%{transform:translateY(0) scale(1.03,.97)}}
@media (prefers-reduced-motion:reduce){.hat,.pal .on{transition:none}.pal.drop .on,.pal.hop .toy,.pal.hop .on,.pal.no,.hat.back,.pal.hint .disc{animation:none}.pal.hint .disc{box-shadow:0 0 0 8px rgba(255,201,60,.9)}}
</style>
<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Toy Dress-up Hats</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6L12 16.6 6.5 19.6l1.2-6L3.2 9.4l6.1-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="count">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="round" id="round" aria-hidden="true"></div>
    <div class="say" id="say" aria-live="polite"></div>
    <div class="rack" id="rack"></div>
    <div class="floor" id="floor"><div class="mat"></div></div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas id="introArt" width="400" height="260" style="width:100%;max-width:320px;height:auto"></canvas>
    <h2 data-t="introH">Hats on!</h2>
    <p data-t="introP">Every hat has the colour of one toy friend. Drag a hat onto the friend with the same colour, or tap the hat and then the friend.</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's dress up!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH">What a hat party!</h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
"use strict";
K.words.en = { title: "Toy Dress-up Hats", back: "Back", sound: "Sound on or off", introH: "Hats on!", introP: "Every hat has the colour of one toy friend. Drag a hat onto the friend with the same colour, or tap the hat and then the friend.", start: "Let's dress up!", again: "Play again", home: "More games",
  pick: "Which friend has this colour?", go: "Give each friend a hat!", no: n => "The " + n + " is another colour. Try again!", yay: n => "A hat for the " + n + "!", party: "Hat party!",
  overH: s => s >= 3 ? "What a hat party!" : s >= 2 ? "Great dressing up!" : "Everyone has a hat!", overP: n => "You gave out " + n + " hats." };
K.words.vi = { title: "Đội Mũ Cho Bạn", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", introH: "Đội mũ nào!", introP: "Mỗi chiếc mũ có màu của một bạn đồ chơi. Kéo mũ đến bạn cùng màu, hoặc chạm vào mũ rồi chạm vào bạn.", start: "Đội mũ thôi!", again: "Chơi lại", home: "Trò khác",
  pick: "Bạn nào có màu này?", go: "Đội mũ cho từng bạn nhé!", no: n => n + " có màu khác. Thử lại nhé!", yay: n => "Mũ đẹp cho " + n + "!", party: "Tiệc mũ!",
  overH: s => s >= 3 ? "Tiệc mũ thật vui!" : s >= 2 ? "Bé chọn mũ giỏi lắm!" : "Bạn nào cũng có mũ rồi!", overP: n => "Bé đã đội " + n + " chiếc mũ." };

const ROUNDS = [2, 2, 3, 3, 3];
const STYLES = ["party", "beanie", "top", "crown", "sun"];
let toys = [], round = 0, pals = [], hats = [], sel = null, drag = null, wrongs = 0, totalWrong = 0, given = 0, running = false, locked = true, timers = [];
const wait = ms => new Promise(r => timers.push(setTimeout(r, K.CALM ? Math.min(ms, 400) : ms)));
function shuffle(a) { return a.slice().sort(() => Math.random() - .5); }
function rgb(h) { h = String(h || "#888888").replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function dist(a, b) { const p = rgb(a), q = rgb(b); return Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); }
function shade(h, k) { return "rgb(" + rgb(h).map(v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)).join(",") + ")"; }
// pick n toys whose colours are easy to tell apart
function pickToys(n) {
  for (let tries = 0; tries < 40; tries++) {
    const out = [];
    for (const t of shuffle(toys)) if (out.every(o => dist(o.colour, t.colour) > 90)) { out.push(t); if (out.length === n) return out; }
  }
  const out = []; for (const t of shuffle(toys)) if (out.every(o => dist(o.colour, t.colour) > 30)) out.push(t);
  return out.slice(0, Math.max(2, Math.min(n, out.length)));
}
function hatSVG(style, c) {
  const ink = "#1B2547", lt = shade(c, .55), dk = shade(c, -.3);
  const S = `stroke="${ink}" stroke-width="5" stroke-linejoin="round"`;
  if (style === "party") return `<svg viewBox="0 0 100 96" aria-hidden="true"><path d="M50 8 L82 86 Q50 96 18 86 Z" fill="${c}" ${S}/><path d="M36 50 Q50 54 64 50 M28 70 Q50 76 72 70" stroke="${lt}" stroke-width="7" fill="none" stroke-linecap="round"/><circle cx="50" cy="9" r="9" fill="#FFF3B0" ${S}/></svg>`;
  if (style === "beanie") return `<svg viewBox="0 0 100 96" aria-hidden="true"><path d="M14 74 Q14 22 50 22 Q86 22 86 74 Z" fill="${c}" ${S}/><path d="M34 34 L34 70 M50 28 L50 70 M66 34 L66 70" stroke="${dk}" stroke-width="4" stroke-linecap="round"/><rect x="8" y="68" width="84" height="20" rx="9" fill="${lt}" ${S}/><circle cx="50" cy="16" r="12" fill="${lt}" ${S}/></svg>`;
  if (style === "top") return `<svg viewBox="0 0 100 96" aria-hidden="true"><rect x="26" y="10" width="48" height="66" rx="6" fill="${c}" ${S}/><rect x="26" y="56" width="48" height="12" fill="${lt}" stroke="${ink}" stroke-width="4"/><ellipse cx="50" cy="80" rx="44" ry="10" fill="${c}" ${S}/></svg>`;
  if (style === "crown") return `<svg viewBox="0 0 100 96" aria-hidden="true"><path d="M12 84 L12 30 L32 52 L50 18 L68 52 L88 30 L88 84 Z" fill="${c}" ${S}/><rect x="12" y="70" width="76" height="14" fill="${lt}" stroke="${ink}" stroke-width="4"/><circle cx="50" cy="18" r="6" fill="#FFF3B0" stroke="${ink}" stroke-width="4"/><circle cx="12" cy="30" r="5" fill="#FFF3B0" stroke="${ink}" stroke-width="4"/><circle cx="88" cy="30" r="5" fill="#FFF3B0" stroke="${ink}" stroke-width="4"/></svg>`;
  return `<svg viewBox="0 0 100 96" aria-hidden="true"><ellipse cx="50" cy="76" rx="48" ry="14" fill="${c}" ${S}/><path d="M24 76 Q24 30 50 30 Q76 30 76 76 Z" fill="${c}" ${S}/><path d="M25 64 Q50 70 75 64" stroke="${lt}" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="68" cy="56" r="7" fill="#FFF3B0" stroke="${ink}" stroke-width="4"/></svg>`;
}
function say(k, ...a) { document.getElementById("say").textContent = K.t(k, ...a); }
function layout() {
  const fl = document.getElementById("floor"), W = fl.clientWidth, H = fl.clientHeight, n = pals.length;
  const size = Math.max(80, Math.min((W - 16) / n - 10, H * 0.55, 190));
  pals.forEach((p, i) => { const cx = (i + 0.5) * W / n; p.el.style.width = size + "px"; p.el.style.height = size + "px"; p.el.style.left = (cx - size / 2) + "px"; p.el.style.top = (H * 0.66 - size) + "px"; fitHat(p); });
}
// where the toy's head is: the first row of the sticker that is not transparent (stickers are square, drawn bottom-aligned)
const HEAD = {};
function headTop(t) {
  if (HEAD[t.slug] !== undefined) return HEAD[t.slug];
  let top = 0.1;
  try { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"); g.drawImage(t.img, 0, 0, 64, 64);
    const d = g.getImageData(0, 0, 64, 64).data; outer: for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) if (d[(y * 64 + x) * 4 + 3] > 40) { top = y / 64; break outer; } } catch (e) {}
  return (HEAD[t.slug] = top);
}
function fitHat(p) {
  const S = p.el.clientHeight, ih = S * 0.84, y = S * 0.12 + ih * headTop(p.toy), hh = S * 0.42;
  const on = p.el.querySelector(".on"); on.style.top = (y - hh * 0.8) + "px"; on.style.height = hh + "px";
}
function deal() {
  const n = ROUNDS[round], set = pickToys(n), style = STYLES[round % STYLES.length]; wrongs = 0; sel = null; locked = false;
  document.getElementById("round").innerHTML = ROUNDS.map((_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join("");
  const fl = document.getElementById("floor"); fl.querySelectorAll(".pal").forEach(e => e.remove());
  pals = set.map(t => {
    const b = document.createElement("button"); b.type = "button"; b.className = "pal"; b.setAttribute("aria-label", K.toyName(t));
    const disc = document.createElement("div"); disc.className = "disc"; disc.style.background = t.colour;
    const toy = document.createElement("div"); toy.className = "toy"; const im = document.createElement("img"); im.src = t.img.src; im.alt = ""; im.draggable = false; toy.appendChild(im);
    const on = document.createElement("div"); on.className = "on";
    b.append(disc, toy, on); fl.appendChild(b); const p = { el: b, toy: t, done: false }; b.onclick = () => tapPal(p); return p;
  });
  const rack = document.getElementById("rack"); rack.innerHTML = "";
  hats = shuffle(set).map(t => {
    const h = document.createElement("button"); h.type = "button"; h.className = "hat"; h.innerHTML = hatSVG(style, t.colour); h.setAttribute("aria-label", K.t("pick"));
    rack.appendChild(h); const o = { el: h, toy: t, style }; grab(o); return o;
  });
  layout(); say("go");
}
function select(h) { hats.forEach(o => o.el.classList.toggle("sel", o === h)); sel = h; if (h) { say("pick"); K.sfx.tick(); } }
function grab(h) {
  h.el.addEventListener("pointerdown", e => {
    if (!running || locked || h.el.classList.contains("used")) return;
    e.preventDefault(); drag = { h, x0: e.clientX, y0: e.clientY, moved: false, ghost: null, id: e.pointerId };
    try { h.el.setPointerCapture(e.pointerId); } catch (_) {}
  });
  h.el.addEventListener("pointermove", e => {
    if (!drag || drag.h !== h) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 12) {
      drag.moved = true; select(h); const g = document.createElement("div"); g.className = "ghost"; g.innerHTML = hatSVG(h.style, h.toy.colour); document.body.appendChild(g); drag.ghost = g; h.el.style.opacity = ".3";
    }
    if (drag.ghost) { drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px"; const p = palAt(e.clientX, e.clientY); pals.forEach(o => o.el.classList.toggle("over", o === p)); }
  });
  const end = e => {
    if (!drag || drag.h !== h) return;
    const d = drag; drag = null; if (d.ghost) d.ghost.remove(); h.el.style.opacity = ""; pals.forEach(o => o.el.classList.remove("over"));
    if (!d.moved) { select(sel === h ? null : h); if (!sel) say("go"); return; }
    const p = palAt(e.clientX, e.clientY); if (p) tryHat(h, p); else { select(null); say("go"); }
  };
  h.el.addEventListener("pointerup", end); h.el.addEventListener("pointercancel", end);
}
function palAt(x, y) {
  return pals.find(p => { if (p.done) return false; const r = p.el.getBoundingClientRect(), m = 18; return x > r.left - m && x < r.right + m && y > r.top - r.height * 0.3 && y < r.bottom + m; });
}
function tapPal(p) {
  if (!running || locked || p.done) return;
  if (!sel) { const h = hats.find(o => !o.el.classList.contains("used")); if (h) { h.el.classList.remove("back"); void h.el.offsetWidth; h.el.classList.add("back"); } say("go"); return; }
  tryHat(sel, p);
}
async function tryHat(h, p) {
  locked = true; hats.forEach(o => o.el.classList.remove("sel")); sel = null;
  if (p.toy === h.toy) {
    given++; document.getElementById("count").textContent = given; p.done = true; p.el.classList.remove("hint");
    h.el.classList.add("used"); p.el.querySelector(".on").innerHTML = hatSVG(h.style, h.toy.colour); p.el.classList.add("drop"); K.sfx.pop();
    say("yay", K.toyName(p.toy)); wrongs = 0;
    await wait(350); p.el.classList.add("hop"); K.sfx.chime();
    const r = p.el.getBoundingClientRect(); if (!K.CALM) K.confetti(r.left + r.width / 2, r.top + r.height * 0.2, 28);
    await wait(800); p.el.classList.remove("hop", "drop"); if (!running) return;
    if (pals.every(o => o.done)) {
      say("party"); K.sfx.tada(); pals.forEach(o => o.el.classList.add("hop")); await wait(1500); if (!running) return;
      if (round < ROUNDS.length - 1) { round++; deal(); } else finish();
    } else { say("go"); locked = false; }
  } else {
    wrongs++; totalWrong++; K.sfx.boing(); p.el.classList.remove("no"); void p.el.offsetWidth; p.el.classList.add("no");
    h.el.classList.remove("back"); void h.el.offsetWidth; h.el.classList.add("back"); say("no", K.toyName(p.toy));
    await wait(900); if (!running) return;
    if (wrongs >= 2) { const g = pals.find(o => o.toy === h.toy); if (g) g.el.classList.add("hint"); }
    select(h); locked = false;
  }
}
function finish() {
  running = false; const stars = totalWrong <= 1 ? 3 : totalWrong <= 4 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", given);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start(list) {
  toys = list.filter(t => t.img && t.colour); if (toys.length < 2) return;
  timers.forEach(clearTimeout); timers = [];
  round = 0; given = 0; totalWrong = 0; running = true; document.getElementById("count").textContent = "0";
  document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; deal();
}
addEventListener("resize", () => { if (pals.length) layout(); });
K.initBar(); K.onLang = () => { if (running && !locked) say(sel ? "pick" : "go"); pals.forEach(p => p.el.setAttribute("aria-label", K.toyName(p.toy))); }; K.applyWords();
function introArt(list) {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  x.fillStyle = "#9FD37A"; x.beginPath(); x.ellipse(200, 228, 180, 26, 0, 0, 7); x.fill();
  const ts = (list || []).filter(t => t.img).slice(0, 3), cols = ts.length ? ts.map(t => t.colour) : ["#F28C3A", "#7CC56B", "#F7A9C4"];
  const draw = (svg, X, Y, w, h) => { const im = new Image(); im.onload = () => x.drawImage(im, X, Y, w, h); im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ')); };
  [0, 1, 2].forEach(i => { const cx = 80 + i * 120;
    if (ts[i]) x.drawImage(ts[i].img, cx - 50, 120, 100, 100); else { x.fillStyle = cols[i]; x.strokeStyle = K.INK; x.lineWidth = 5; x.beginPath(); x.arc(cx, 180, 42, 0, 7); x.fill(); x.stroke(); }
    draw(hatSVG(STYLES[i], cols[i]), cx - 30, i === 1 ? 20 : 80, 60, 58); });
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => introArt(list));
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
