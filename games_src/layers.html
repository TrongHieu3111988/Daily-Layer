<title>Magic Printer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Magic Printer: one of the shop's real 3D toys is cut into layers, the way a 3D printer builds it. Tap the layers from the bottom up and the printer puts the toy together. */
.stage{background:#DDF3FF;display:flex;flex-direction:column}
.spot{position:relative;flex:1;min-height:0}
#view{display:block;width:100%;height:100%;touch-action:manipulation}
.dots{position:absolute;left:0;right:0;top:12px;z-index:3;display:flex;gap:6px;justify-content:center;pointer-events:none}
.dots i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--outline);background:rgba(255,255,255,.7)}
.dots i.on{background:var(--sun)}
.dots i.now{background:var(--coral);transform:scale(1.25)}
.ask{position:absolute;left:0;right:0;top:36px;z-index:3;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(19px,5.6vw,26px);color:#1B2547;text-shadow:0 2px 0 #fff;pointer-events:none;padding:0 14px}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;font-family:var(--f-display);font-weight:800;font-size:20px;background:#DDF3FF;color:#1B2547;text-align:center;padding:20px}
</style>

<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Magic Printer</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 15.8 6.8 18.6l1-5.8-4.3-4.1 5.9-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="total">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="spot">
      <canvas id="view" aria-label="A 3D printer and the layers of a toy"></canvas>
      <div class="dots" id="dots"></div>
      <div class="ask" id="ask" data-t="ask">Tap the bottom layer first!</div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="loading" id="loading" data-t="loading">Warming up the printer…</div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas class="hero" id="introArt" width="400" height="280"></canvas>
    <h2 data-t="introH">Magic Printer</h2>
    <p data-t="introP">A 3D printer builds a toy one layer at a time, from the bottom up. Tap the layers in order, bottom first, and watch your toy appear!</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Start printing!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH"></h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Print more</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>

K.words.en = { title: "Magic Printer", back: "Back", sound: "Sound on or off", ask: "Tap the bottom layer first!", next: "Now the next layer up!", loading: "Warming up the printer…", introH: "Magic Printer",
  introP: "A 3D printer builds a toy one layer at a time, from the bottom up. Tap the layers in order, bottom first, and watch your toy appear!", start: "Start printing!",

  introP: "Máy in 3D làm đồ chơi từng lớp một, từ dưới lên trên. Bé chạm vào các lớp theo thứ tự, lớp dưới cùng trước, rồi xem đồ chơi hiện ra nhé!", start: "Bắt đầu in!",

  overH: n => n >= 5 ? "Thợ in siêu đẳng!" : n >= 3 ? "Bé in giỏi quá!" : "Giỏi lắm!", overP: (n, r) => "Bé đã in " + r + " đồ chơi, " + n + " cái không nhầm lớp nào.",

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script type="module">
import * as THREE from "three";
/*KIT3D*/

/* ---------- scene: a friendly printer (bed, two posts, a nozzle on a bar) and a shelf of loose layers ---------- */
const cv = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.localClippingEnabled = true;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#DDF3FF");
const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 60);
scene.add(new THREE.HemisphereLight(0xffffff, 0xB9A7FF, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(2.5, 6, 5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 20 }); scene.add(sun);
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55 });
const BED_Y = 0.35;                                       // the toy is printed on the bed, the loose layers wait on the shelf below
const printer = new THREE.Group(); scene.add(printer);
const bed = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.12, 1.3), mat("#3A4750")); bed.position.y = BED_Y - 0.06; bed.receiveShadow = true; printer.add(bed);
const plate = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.02, 1.1), mat("#FFC93C")); plate.position.y = BED_Y + 0.005; plate.receiveShadow = true; printer.add(plate);
for (const sx of [-1.05, 1.05]) { const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.25, 0.12), mat("#8C6BF2")); post.position.set(sx, BED_Y + 1.0, -0.45); post.castShadow = true; printer.add(post); }
const gantry = new THREE.Group(); printer.add(gantry);
const bar = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.1, 0.12), mat("#8C6BF2")); bar.position.z = -0.45; gantry.add(bar);
const head = new THREE.Group(); gantry.add(head);
const headBox = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.26, 0.3), mat("#FF6B57")); headBox.position.set(0, 0.03, -0.3); headBox.castShadow = true; head.add(headBox);
const nozzle = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.14, 16), mat("#E9E4D8")); nozzle.rotation.x = Math.PI; nozzle.position.set(0, -0.17, -0.3); head.add(nozzle);
const eyeM = mat("#1B2547"); for (const ex of [-0.07, 0.07]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), eyeM); e.position.set(ex, 0.07, -0.145); head.add(e); }   // the printer has a little face
const glowDot = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), new THREE.MeshBasicMaterial({ color: "#FFE58A" })); glowDot.position.set(0, -0.25, -0.3); head.add(glowDot);
const shelf = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.1, 1.0), mat("#FFFFFF")); shelf.receiveShadow = true; scene.add(shelf);

/* ---------- a toy cut into layers: the same mesh drawn several times, each copy clipped to its band ---------- */
const INFILL = new THREE.Color("#FFF0C4");
function layerMat() {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, side: THREE.DoubleSide, clipShadows: true });
  m.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace("#include <color_fragment>", "#include <color_fragment>\nif (!gl_FrontFacing) diffuseColor.rgb = vec3(1.0, 0.94, 0.77);"); };   // the cut face looks like creamy infill
  return m;
}
let finishing = false, layers = [], ghost = null, toyScale = 1, done = 0, N = 3, cur = null;
const tmpP = new THREE.Plane();
function updateClips() {
  for (const L of layers) { L.mesh.updateMatrixWorld(true);
    L.mesh.material.clippingPlanes.forEach((pl, k) => { tmpP.copy(L.local[k]).applyMatrix4(L.mesh.matrixWorld); pl.copy(tmpP); }); }
}
function layout() {   // where the shelf sits and how big the loose layers are, from the visible width
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * cam.position.distanceTo(new THREE.Vector3(0, 0.3, 0)), w = h * cam.aspect;
  return { w, shelfY: -1.3, gap: Math.min(1.05, (w * 0.94) / Math.max(N, 1)) };
}
function shelfSpot(i) { const L = layout(), x0 = -L.gap * (N - 1) / 2; return { pos: new THREE.Vector3(x0 + L.gap * i, L.shelfY + 0.06, 0.15), scale: Math.min(toyScale * 0.8, L.gap * 0.92 / Math.max(0.6, cur.w)) }; }
async function buildToy(t) {
  for (const L of layers) { scene.remove(L.mesh); L.mesh.material.dispose(); }
  if (ghost) scene.remove(ghost);
  const g = await toyGeometry(t), bb = g.boundingBox; cur = { t, w: Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z) };
  toyScale = Math.min(1.35 / (bb.max.y - bb.min.y), 1.6 / cur.w);
  ghost = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: "#5DB8FF", transparent: true, opacity: 0.16, depthWrite: false }));
  ghost.scale.setScalar(toyScale); ghost.position.set(0, BED_Y + 0.015, 0); scene.add(ghost);
  layers = [];
  const y0 = bb.min.y, y1 = bb.max.y;
  for (let k = 0; k < N; k++) {
    const a = y0 + (y1 - y0) * k / N, b = y0 + (y1 - y0) * (k + 1) / N, m = layerMat();
    const local = [new THREE.Plane(new THREE.Vector3(0, 1, 0), -a + (k ? 0.002 : 1)), new THREE.Plane(new THREE.Vector3(0, -1, 0), b + (k === N - 1 ? 1 : -0.002))];
    m.clippingPlanes = local.map(p => p.clone());
    const mesh = new THREE.Mesh(g, m); mesh.castShadow = true; mesh.receiveShadow = true; mesh.userData.k = k;
    scene.add(mesh); layers.push({ k, a, b, mesh, local, placed: false, slot: 0, fly: 0, wig: 0, hint: false });
  }
  // shuffle the loose layers on the shelf, never already in order
  let slots; do { slots = layers.map((_, i) => i).sort(() => Math.random() - 0.5); } while (N > 1 && slots.every((s, i) => s === i));
  layers.forEach((L, i) => { L.slot = slots[i]; const s = shelfSpot(L.slot); L.mesh.position.copy(s.pos); L.mesh.position.y -= L.a * s.scale; L.mesh.scale.setScalar(s.scale); L.home = s; });
}

/* ---------- rounds ---------- */
const ROUNDS = 6;
let toys = [], order = [], round = 0, misses = 0, clean = 0, busy = false, roundMiss = 0, hop = 0, spin = 0;
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
function dots() { document.getElementById("dots").innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join(""); }
async function showRound() {
  busy = true; finishing = false; done = 0; misses = 0; roundMiss = 0; hop = 0; spin = 0;
  N = round < 2 ? 3 : round < 4 ? 4 : 5;                   // 3 layers to start, up to 5
  await buildToy(order[round % order.length]);
  document.getElementById("ask").textContent = K.t("ask"); dots(); busy = false;
}
function choose(L) {
  if (busy || L.placed || L.fly) return;
  if (L.k === done) {
    L.placed = true; L.fly = 0.0001; done++; misses = 0; layers.forEach(x => (x.hint = false));
    K.sfx.pop();
    document.getElementById("ask").textContent = done < N ? K.t("next") : "";
    if (done === N) busy = true;   // finish() runs when the last layer lands
  } else {
    misses++; roundMiss++; L.wig = 1; K.sfx.boing(); toast(K.t("tryAgain"));
    if (misses >= 2) layers.find(x => x.k === done).hint = true;   // gentle help, never a fail screen
  }
}
function finish() {
  if (!roundMiss) clean++;
  document.getElementById("total").textContent = round + 1; hop = 1; spin = 1;
  document.getElementById("ask").textContent = K.t("done", K.toyName(cur.t));
  K.sfx.chime(); const r = cv.getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top + r.height * 0.35, 50);
  after(2.3, next);
}
async function next() { round++; if (round >= ROUNDS) return gameOver(); await showRound(); }
async function newGame() {
  timers = []; round = 0; clean = 0; document.getElementById("total").textContent = 0; document.getElementById("over").hidden = true;
  const featured = toys.find(t => t.featured), rest = shuffle(toys.filter(t => t !== featured));
  order = featured ? [featured, ...rest] : rest;
  await showRound();
}
function gameOver() {
  dots();
  const st = clean >= 5 ? 3 : clean >= 3 ? 2 : 1;          // everyone who finishes gets at least one star
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < st)).join("");
  document.getElementById("overH").textContent = K.t("overH", clean); document.getElementById("overP").textContent = K.t("overP", clean, ROUNDS);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti();
}

/* ---------- taps ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pickAt(cx, cy) {
  const r = cv.getBoundingClientRect(); ndc.set((cx - r.left) / r.width * 2 - 1, -((cy - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, cam);
  let best = null, bd = 1e9;   // forgiving: the nearest loose layer to the finger, not only an exact hit
  for (const L of layers) { if (L.placed) continue;
    const c = layerCentre(L).project(cam), d = Math.hypot((c.x - ndc.x) * r.width / 2, (c.y - ndc.y) * r.height / 2);
    if (d < bd) { bd = d; best = L; } }
  return bd < Math.max(48, layout().gap / layout().w * r.width * 0.55) ? best : null;
}
function layerCentre(L) { const s = L.mesh.scale.x; return new THREE.Vector3(L.mesh.position.x, L.mesh.position.y + (L.a + L.b) / 2 * s, L.mesh.position.z); }
cv.addEventListener("pointerdown", e => { if (!document.getElementById("intro").hidden) return; const L = pickAt(e.clientX, e.clientY); if (L) choose(L); });

/* ---------- loop ---------- */
function resize() { const r = cv.getBoundingClientRect(); if (!r.width) return; renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height;
  const tall = cam.aspect < 0.9; cam.fov = tall ? 50 : 38; const d = tall ? 3.9 / Math.max(0.5, cam.aspect) * 0.62 : 5.2;
  cam.position.set(0, 1.35, d); cam.lookAt(0, 0.28, 0); cam.updateProjectionMatrix();
  const L = layout(); shelf.position.set(0, L.shelfY, 0.15); shelf.scale.x = Math.max(1, L.w * 0.98 / 3.2);
  layers.forEach(Lr => { if (!Lr.placed) { const s = shelfSpot(Lr.slot); Lr.home = s; Lr.mesh.scale.setScalar(s.scale); Lr.mesh.position.set(s.pos.x, s.pos.y - Lr.a * s.scale, s.pos.z); } }); }
new ResizeObserver(resize).observe(cv); resize();
let last = performance.now(), headX = 0, headY = BED_Y + 1.7;
let timers = [];   // game timers run on the animation clock, so the game never runs ahead of what is drawn
function after(sec, fn) { timers.push({ t: sec, fn }); }
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const tm of timers.splice(0)) { tm.t -= dt; if (tm.t > 0) timers.push(tm); else tm.fn(); }
  const topL = done > 0 ? layers[done - 1] : null;   // the nozzle waits just above the last printed layer
  const allDone = layers.length && done === N;   // when the toy is finished the nozzle steps aside so the toy can show off
  let wantX = allDone ? 0.82 : 0, wantY = allDone ? BED_Y + 1.25 : BED_Y + (topL && topL.mesh ? topL.b * toyScale : 0) + 0.32;
  for (const L of layers) {
    if (L.placed) {
      if (L.fly > 0 && L.fly < 1) {   // fly from the shelf up to the printer, landing exactly on its layer
        L.fly = Math.min(1, L.fly + dt * (K.CALM ? 6 : 1.8)); const e = L.fly < 0.5 ? 2 * L.fly * L.fly : 1 - Math.pow(-2 * L.fly + 2, 2) / 2;
        const from = L.home, s = from.scale + (toyScale - from.scale) * e;
        const fx = from.pos.x, fy = from.pos.y - L.a * from.scale, tx = 0, ty = BED_Y + 0.015 - 0 * s;
        L.mesh.scale.setScalar(s); L.mesh.position.set(fx + (tx - fx) * e, fy + (ty - fy) * e + Math.sin(Math.PI * e) * 0.6 * (K.CALM ? 0 : 1), from.pos.z * (1 - e));
        L.mesh.rotation.y = 0; wantX = L.mesh.position.x; wantY = L.mesh.position.y + L.b * s + 0.32;
        if (L.fly >= 1) { K.sfx.thud(); L.fly = 0; }
      }
    } else {
      L.mesh.rotation.y = K.CALM ? 0.4 : now / 1400 + L.slot;   // loose layers turn slowly so the child sees their shape
      const s = L.home; let bob = 0;
      if (L.wig > 0) { L.wig = Math.max(0, L.wig - dt * 2.5); L.mesh.rotation.z = K.CALM ? 0 : Math.sin(L.wig * 18) * 0.18 * L.wig; } else L.mesh.rotation.z = 0;
      if (L.hint) bob = K.CALM ? 0.08 : Math.abs(Math.sin(now / 220)) * 0.15;
      L.mesh.position.y = s.pos.y - L.a * s.scale + bob;
    }
  }
  if (ghost) ghost.visible = done < N;
  if (layers.length && done === N && !finishing && layers.every(x => !x.fly)) { finishing = true; after(0.35, finish); }   // every layer has landed
  // the finished toy hops and turns once to show off
  const placedAll = layers.length && done === N && layers.every(L => !L.fly);
  if (placedAll && hop > 0) { hop = Math.max(0, hop - dt * 0.9); const y = K.CALM ? 0 : Math.abs(Math.sin((1 - hop) * Math.PI * 3)) * 0.22 * hop;
    const ry = K.CALM ? 0 : (1 - hop) * Math.PI * 2; for (const L of layers) { L.mesh.position.y = BED_Y + 0.015 + y; L.mesh.rotation.y = ry; } }
  headX += (wantX - headX) * Math.min(1, dt * 6); headY += (Math.max(wantY, BED_Y + 0.32) - headY) * Math.min(1, dt * 4);
  head.position.x = headX + (done < N && !K.CALM ? Math.sin(now / 300) * 0.05 : 0); gantry.position.y = headY;
  glowDot.visible = layers.some(L => L.fly > 0) || (Math.floor(now / 500) % 2 === 0);
  updateClips();
  renderer.render(scene, cam);
})(performance.now());

/* ---------- boot ---------- */
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL : "/#play";
document.getElementById("back").href = window.SHOP_URL || "/";
document.getElementById("langBtn").addEventListener("click", () => { if (!busy) document.getElementById("ask").textContent = done ? K.t("next") : K.t("ask"); });
(async () => {
  try { toys = (await loadToyList()).toys; if (!toys.length) throw new Error("no toys"); await Promise.all(toys.map(toyGeometry)); }
  catch (e) { document.getElementById("loading").textContent = K.t("noLoad"); return; }
  document.getElementById("loading").hidden = true;
  await newGame();
  // intro art: a toy's cover cut into three stripes, the top one floating down into place
  const c = document.getElementById("introArt"), x = c.getContext("2d");
  x.fillStyle = "#DDF3FF"; x.fillRect(0, 0, 400, 280); x.fillStyle = "#3A4750"; x.fillRect(80, 236, 240, 18); x.fillStyle = "#FFC93C"; x.fillRect(92, 230, 216, 8);
  x.fillStyle = "#8C6BF2"; x.fillRect(70, 30, 14, 224); x.fillRect(316, 30, 14, 224); x.fillRect(60, 24, 280, 14);
  const t0 = toys.find(t => t.featured) || toys[0];
  const im = await new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = assetURL(t0.cover); });
  if (im) { const S = 170, X = 115, Y = 62, sh = im.height / 3; [[2, 0], [1, 0], [0, -26]].forEach(([k, dy]) => { x.save(); x.beginPath(); x.rect(X, Y + k * S / 3 + dy, S, S / 3); x.clip(); x.drawImage(im, 0, 0, im.width, im.height, X, Y + dy, S, S); x.restore();
      x.lineWidth = 4; x.strokeStyle = "#1B2547"; x.strokeRect(X, Y + k * S / 3 + dy, S, S / 3); }); }
  x.fillStyle = "#FF6B57"; x.fillRect(178, 38, 44, 22); x.fillStyle = "#E9E4D8"; x.beginPath(); x.moveTo(192, 60); x.lineTo(208, 60); x.lineTo(200, 70); x.fill();
})();
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); document.getElementById("intro").hidden = true; };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); newGame(); };
// used by automated play tests and the Shorts recorder
window.__game = { THREE, cam, round: () => round, clean: () => clean, ready: () => layers.length > 0 && !busy, layersLeft: () => layers.filter(L => !L.placed).length,
  flying: () => layers.some(L => L.fly > 0), done: () => done, N: () => N,
  where: k => { const L = layers.find(x => x.k === k); if (!L) return null; const c = layerCentre(L).project(cam); return [c.x, c.y]; },
  nextAt: () => { const L = layers.find(x => x.k === done && !x.placed); if (!L) return null; const c = layerCentre(L).project(cam); return [c.x, c.y]; },
  wrongAt: () => { const L = layers.find(x => !x.placed && x.k !== done); if (!L) return null; const c = layerCentre(L).project(cam); return [c.x, c.y]; } };
</script>
