<title>Spin to Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Spin to Match: a real 3D toy sits on a turntable. Turn it (drag, or tap the arrows) until it faces the same way as the picture above. */
.stage{background:#BFE8FF;display:flex;flex-direction:column}
.spot{position:relative;flex:1;min-height:0}
#view{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.dots{position:absolute;left:0;right:0;top:12px;z-index:3;display:flex;gap:6px;justify-content:center;pointer-events:none}
.dots i{width:14px;height:14px;border-radius:50%;border:2.5px solid #1B2547;background:rgba(255,255,255,.55)}
.dots i.on{background:var(--sun)}
.dots i.now{background:#fff;transform:scale(1.25)}
.ask{position:absolute;left:0;right:0;bottom:10px;z-index:3;text-align:center;font-family:var(--f-display);font-weight:800;font-size:clamp(20px,6vw,28px);color:#fff;text-shadow:0 3px 0 #1B2547;pointer-events:none;padding:0 12px}
.turn{display:flex;justify-content:center;gap:22px;padding:12px 14px 18px;background:#FFF7E6;border-top:3px solid var(--outline)}
.arrow{appearance:none;border:3px solid var(--outline);border-radius:26px;background:var(--sun);box-shadow:var(--pop);cursor:pointer;width:min(38vw,150px);height:78px;display:grid;place-items:center;transition:transform .15s}
.arrow svg{width:46px;height:46px}
.arrow:active{transform:translateY(3px);box-shadow:var(--pop-sm)}
.arrow.hint{animation:wig .6s ease-in-out 4}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.07)}75%{transform:rotate(6deg) scale(1.07)}}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:5;font-family:var(--f-display);font-weight:800;font-size:20px;background:#BFE8FF;color:#1B2547;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){.arrow.hint{animation:none;outline:5px solid #fff}}
</style>

<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Spin to Match</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 15.8 6.8 18.6l1-5.8-4.3-4.1 5.9-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="total">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="spot">
      <canvas id="view" aria-label="A toy on a turntable and the picture to copy"></canvas>
      <div class="dots" id="dots"></div>
      <div class="ask" id="ask" data-t="ask">Turn me like this!</div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <div class="turn">
      <button class="arrow" id="leftBtn" type="button" data-t-label="left" aria-label="Turn left"><svg viewBox="0 0 48 48"><path d="M30 8L14 24l16 16" fill="none" stroke="#1B2547" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="arrow" id="rightBtn" type="button" data-t-label="right" aria-label="Turn right"><svg viewBox="0 0 48 48"><path d="M18 8l16 16-16 16" fill="none" stroke="#1B2547" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="loading" id="loading" data-t="loading">Warming up the turntable…</div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas class="hero" id="introArt" width="400" height="280"></canvas>
    <h2 data-t="introH">Spin to Match</h2>
    <p data-t="introP">A toy friend stands on a turntable. Look at the little picture above, then turn your friend until it faces the same way. Drag it, or tap the arrows!</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's spin!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH"></h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
K.words.en = { title: "Spin to Match", back: "Back", sound: "Sound on or off", left: "Turn left", right: "Turn right", ask: "Turn me like this!", loading: "Warming up the turntable…", introH: "Spin to Match",
  introP: "A toy friend stands on a turntable. Look at the little picture above, then turn your friend until it faces the same way. Drag it, or tap the arrows!", start: "Let's spin!",
  again: "Play again", home: "More games", yes: t => "Just right, " + t + "!", tryAgain: "Almost! Keep turning.",
  overH: n => n >= 6 ? "Spin champion!" : n >= 3 ? "Great turning!" : "Well done!", overP: (n, r) => "You matched all " + r + " friends, " + n + " without a miss.",
  noLoad: "The game couldn't load. Check the connection and try again." };
K.words.vi = { title: "Xoay Cho Giống", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", left: "Xoay trái", right: "Xoay phải", ask: "Xoay giống hình này nhé!", loading: "Đang khởi động bàn xoay…", introH: "Xoay Cho Giống",
  introP: "Một bạn đồ chơi đứng trên bàn xoay. Bé nhìn bức tranh nhỏ ở trên rồi xoay bạn ấy cho quay cùng hướng. Kéo bạn ấy, hoặc chạm vào mũi tên nhé!", start: "Xoay nào!",
  again: "Chơi lại", home: "Trò khác", yes: t => "Đúng rồi, " + t + "!", tryAgain: "Gần đúng rồi! Xoay thêm chút nữa.",
  overH: n => n >= 6 ? "Nhà vô địch xoay!" : n >= 3 ? "Bé xoay giỏi quá!" : "Giỏi lắm!", overP: (n, r) => "Bé đã xoay đúng cả " + r + " bạn, " + n + " bạn không sai lần nào.",
  noLoad: "Chưa tải được trò chơi. Kiểm tra mạng rồi thử lại." };
const VI_NAME = { "sculpt-gingerbread": "Bánh Gừng", "sculpt-penguin": "Chim Cánh Cụt", "sculpt-kitten": "Mèo Mướp", "sculpt-frog": "Ếch Cười", "sculpt-fox": "Cáo Con",
  "sculpt-chick": "Gà Con", "sculpt-bunny": "Thỏ Tròn", "sculpt-bear": "Gấu Con", "sculpt-axolotl": "Kỳ Giông", "chibi-whale-4part": "Cá Voi" };
const nameOf = t => K.lang === "vi" && (t.title_vi || VI_NAME[t.slug]) ? (t.title_vi || VI_NAME[t.slug]) : t.title.replace(/\s*\(.*\)\s*/, "");
K.initBar(); K.applyWords();
let toastT = 0;
function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (e.hidden = true), 1500); }
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/","cannon-es":"https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"}}</script>
<script type="module">
import * as THREE from "three";
/*KIT3D*/

/* ---------- scene: a picture frame on top, a turntable below ---------- */
const cv = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color("#BFE8FF");
const cam = new THREE.PerspectiveCamera(36, 1, 0.1, 50); cam.position.set(0, 1.7, 7); cam.lookAt(0, 1.3, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8C6BF2, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2.5, 5, 4); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 3, bottom: -2, near: 1, far: 15 }); scene.add(sun);
// turntable
const table = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.25, 0.16, 64), new THREE.MeshStandardMaterial({ color: "#FF6B57", roughness: 0.6 }));
table.position.y = -0.08; table.receiveShadow = true; scene.add(table);
const rim = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.045, 8, 64), new THREE.MeshStandardMaterial({ color: "#FFC93C", roughness: 0.4 }));
rim.rotation.x = Math.PI / 2; scene.add(rim);
// picture frame: a round pale card with a gold ring, the goal toy stands inside
const frame = new THREE.Group(); frame.position.set(0, 2.55, -0.4); scene.add(frame);
const card = new THREE.Mesh(new THREE.CircleGeometry(0.78, 48), new THREE.MeshBasicMaterial({ color: "#FFF7E6" })); card.position.z = -0.05; frame.add(card);
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.055, 10, 48), new THREE.MeshStandardMaterial({ color: "#FFC93C", roughness: 0.4 })); ring.position.z = -0.04; frame.add(ring);
const goalHolder = new THREE.Group(); goalHolder.position.y = -0.55; frame.add(goalHolder);
// clouds for fun
const cloudMat = new THREE.MeshBasicMaterial({ color: "#FFFFFF" }), clouds = [];
for (let i = 0; i < 5; i++) { const c = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random() * 0.2, 12, 8), cloudMat); c.scale.set(1.8, 0.8, 0.8); c.position.set((Math.random() - 0.5) * 6, 0.8 + Math.random() * 2.8, -2.5 - Math.random()); c.userData.ph = Math.random() * 6; scene.add(c); clouds.push(c); }

/* ---------- rounds ---------- */
const ROUNDS = 8, STEP = Math.PI / 4, TOL = 0.42;
let toys = [], order = [], round = 0, cur = null, mesh = null, goal = null, holder = new THREE.Group(), target = 0, firstTry = 0, misses = 0, busy = false, hop = 0, spinTo = null, dragging = false, lastX = 0, glow = 0;
scene.add(holder);
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
const wrap = a => { a = (a + Math.PI) % (2 * Math.PI); if (a < 0) a += 2 * Math.PI; return a - Math.PI; };
const diff = () => Math.abs(wrap(holder.rotation.y - target));
function dots() { document.getElementById("dots").innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join(""); }
function fit(m, h, w) { const bb = m.geometry.boundingBox, s = Math.min(h / (bb.max.y - bb.min.y), w / Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z)); m.scale.setScalar(s); return s; }
async function showRound() {
  busy = false; misses = 0; hop = 0; spinTo = null; glow = 0;
  cur = order[round % order.length];
  if (mesh) holder.remove(mesh); if (goal) goalHolder.remove(goal);
  mesh = await toyMesh(cur); fit(mesh, 1.3, 1.6); holder.add(mesh);
  goal = await toyMesh(cur); goal.castShadow = false; fit(goal, 0.95, 1.1); goalHolder.add(goal);
  // early rounds ask for a quarter turn, later ones for eighth turns; start is always a few eighth-turns away (never the same pose)
  const base = (round < 3 ? [2, -2, 4] : [1, 2, 3, -1, -2, -3, 4]).map(k => k * STEP);
  target = K.CALM ? Math.PI / 2 : base[Math.floor(Math.random() * base.length)];
  goalHolder.rotation.y = target;
  const offs = (round < 3 ? [2, 3, 5, 6] : [1, 2, 3, 5, 6, 7]);
  holder.rotation.y = target + offs[Math.floor(Math.random() * offs.length)] * STEP; holder.position.y = 0;
  document.getElementById("ask").textContent = K.t("ask"); dots();
  document.getElementById("leftBtn").classList.remove("hint"); document.getElementById("rightBtn").classList.remove("hint");
}
function release() {
  if (busy) return;
  if (diff() < TOL) return win();
  misses++; if (misses === 1 || misses % 2 === 0) { K.sfx.boing(); toast(K.t("tryAgain")); }
  if (misses >= 3) { const d = wrap(target - holder.rotation.y); const b = document.getElementById(d > 0 ? "leftBtn" : "rightBtn"); b.classList.remove("hint"); void b.offsetWidth; b.classList.add("hint"); }   // gentle help: the arrow to press wiggles, never a fail screen
}
function win() {
  busy = true; if (!misses) firstTry++;
  spinTo = holder.rotation.y + wrap(target - holder.rotation.y); hop = 1; glow = 1;
  document.getElementById("total").textContent = round + 1;
  document.getElementById("ask").textContent = K.t("yes", nameOf(cur));
  K.sfx.chime(); const r = cv.getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top + r.height * 0.5, 40);
  setTimeout(next, 1900);
}
function turn(dir) {
  if (busy) return; K.sfx.pop();
  spinTo = (spinTo === null ? holder.rotation.y : spinTo) + dir * STEP; spinTo = Math.round(spinTo / STEP) * STEP + 0;   // stays on eighth-turns so the arrows can always land exactly
  spinTo = Math.round((spinTo - target) / STEP) * STEP + target;
}
async function next() { round++; if (round >= ROUNDS) return gameOver(); await showRound(); }
async function newGame() {
  round = 0; firstTry = 0; document.getElementById("total").textContent = 0; document.getElementById("over").hidden = true;
  const featured = toys.find(t => t.featured), rest = shuffle(toys.filter(t => t !== featured));
  order = featured ? [featured, ...rest] : rest; await showRound();
}
function gameOver() {
  dots();
  const st = firstTry >= 6 ? 3 : firstTry >= 3 ? 2 : 1;   // everyone who finishes gets at least one star
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < st)).join("");
  document.getElementById("overH").textContent = K.t("overH", firstTry); document.getElementById("overP").textContent = K.t("overP", firstTry, ROUNDS);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti();
}

/* ---------- input: drag the toy round, or tap the arrows ---------- */
cv.addEventListener("pointerdown", e => { if (busy) return; dragging = true; lastX = e.clientX; spinTo = null; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener("pointermove", e => { if (!dragging) return; holder.rotation.y += (e.clientX - lastX) * 0.012; lastX = e.clientX; });
const stop = () => { if (!dragging) return; dragging = false; release(); };
cv.addEventListener("pointerup", stop); cv.addEventListener("pointercancel", stop);
document.getElementById("leftBtn").onclick = () => turn(-1);
document.getElementById("rightBtn").onclick = () => turn(1);

/* ---------- loop ---------- */
function resize() { const r = cv.getBoundingClientRect(); if (!r.width) return; renderer.setSize(r.width, r.height, false); cam.aspect = r.width / r.height;
  cam.fov = cam.aspect < 0.9 ? 40 / Math.max(0.5, cam.aspect / 0.9) : 40; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv); resize();
let last = performance.now(), settleT = 0;
(function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (spinTo !== null) {
    const d = spinTo - holder.rotation.y; holder.rotation.y += d * Math.min(1, dt * (K.CALM ? 30 : 9));
    if (Math.abs(d) < 0.01) { holder.rotation.y = spinTo; spinTo = null; if (!busy) release(); }
  }
  if (hop > 0 && !K.CALM) { hop = Math.max(0, hop - dt * 1.3); holder.position.y = Math.abs(Math.sin((1 - hop) * Math.PI * 2)) * 0.3 * hop; } else holder.position.y = 0;
  glow = Math.max(0, glow - dt * 0.5); ring.material.emissive.set("#FFC93C").multiplyScalar(glow);
  for (const c of clouds) c.position.x += (K.CALM ? 0 : dt * 0.08) * (c.userData.ph > 3 ? 1 : -1), c.position.x = ((c.position.x + 4) % 8 + 8) % 8 - 4;
  renderer.render(scene, cam);
})(performance.now());

/* ---------- boot ---------- */
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL : "/#play";
document.getElementById("back").href = window.SHOP_URL || "/";
document.getElementById("langBtn").addEventListener("click", () => { if (!busy) document.getElementById("ask").textContent = K.t("ask"); else if (cur) document.getElementById("ask").textContent = K.t("yes", nameOf(cur)); });
(async () => {
  try { toys = (await loadToyList()).toys; await Promise.all(toys.map(toyGeometry)); }
  catch (e) { document.getElementById("loading").textContent = K.t("noLoad"); return; }
  document.getElementById("loading").hidden = true;
  await newGame();
  // intro art: a small picture and a toy that turns to match, drawn from the toys' cover pictures
  const c = document.getElementById("introArt"), x = c.getContext("2d");
  x.fillStyle = "#BFE8FF"; x.fillRect(0, 0, 400, 280); x.fillStyle = "#FF6B57"; x.beginPath(); x.ellipse(200, 230, 120, 24, 0, 0, 7); x.fill();
  const imgs = await Promise.all(toys.slice(0, 2).map(t => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = assetURL(t.cover); })));
  if (imgs[0]) { x.save(); x.beginPath(); x.arc(200, 110, 76, 0, 7); x.clip(); x.drawImage(imgs[0], 124, 34, 152, 152); x.restore(); x.lineWidth = 6; x.strokeStyle = "#FFC93C"; x.beginPath(); x.arc(200, 110, 76, 0, 7); x.stroke(); }
  x.lineWidth = 9; x.lineCap = "round"; x.lineJoin = "round"; x.strokeStyle = "#1B2547";
  [[70, 1], [330, -1]].forEach(([px, d]) => { x.beginPath(); x.moveTo(px - 14 * d, 200); x.lineTo(px + 14 * d, 220); x.lineTo(px - 14 * d, 240); x.stroke(); });
})();
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); document.getElementById("intro").hidden = true; };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); newGame(); };
window.__game = { target: () => target, angle: () => holder.rotation.y, setAngle: a => { holder.rotation.y = a; }, release, turn, round: () => round, firstTry: () => firstTry, ready: () => !!mesh, busy: () => busy, cur: () => cur && cur.slug, THREE, cam, holder, goalHolder };
</script>
