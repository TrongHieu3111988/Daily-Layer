<title>Bubble Pop Friends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Bubble Pop Friends: the sky shows which toy friend to find; tap the bubble that holds it. */
.stage{background:linear-gradient(#BDE6FF,#E9F7FF 60%,#D6F0E4);display:flex;flex-direction:column;align-items:center;overflow:hidden}
:root[data-theme="dark"] .stage{background:linear-gradient(#16264F,#1B3B5E)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(#16264F,#1B3B5E)}}
.round{display:flex;justify-content:center;gap:8px;padding:10px 12px 0}
.round i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--outline);background:var(--paper)}
.round i.on{background:var(--grass)}.round i.now{background:var(--sun)}
.find{display:flex;align-items:center;gap:12px;margin:10px 14px 0;padding:8px 16px 8px 10px;background:var(--paper);border:3px solid var(--outline);border-radius:26px;box-shadow:var(--pop-sm)}
.find .pic{width:72px;height:72px;flex:none}.find .pic img{width:100%;height:100%;object-fit:contain;display:block}
.find b{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;line-height:1.15;color:var(--outline)}
.sea{position:relative;flex:1;min-height:0;width:100%}
.bub{position:absolute;border-radius:50%;border:3px solid rgba(27,37,71,.75);background:radial-gradient(circle at 30% 28%,#fff 0,rgba(255,255,255,.85) 14%,rgba(190,230,255,.55) 48%,rgba(150,210,255,.45) 100%);box-shadow:inset -6px -8px 14px rgba(93,184,255,.35),0 6px 0 rgba(27,37,71,.12);padding:0;display:grid;place-items:center;touch-action:manipulation;animation:bob var(--d,3.2s) ease-in-out infinite;animation-delay:var(--s,0s)}
.bub img{width:68%;height:68%;object-fit:contain;pointer-events:none;display:block}
.bub.no{animation:shk .4s ease}
.bub.hint{box-shadow:0 0 0 6px #FFC93C,0 0 22px 8px rgba(255,201,60,.8)}
.bub.pop{animation:pop .35s ease forwards;pointer-events:none}
.bub.gone{visibility:hidden}
@keyframes bob{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-14px) translateX(6px)}}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{40%{transform:scale(1.25);opacity:1}100%{transform:scale(1.5);opacity:0}}
.hero{position:absolute;pointer-events:none;z-index:3;transform:translate(-50%,-50%);animation:hop .9s ease forwards}
.hero img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes hop{0%{transform:translate(-50%,-50%) scale(.6)}35%{transform:translate(-50%,-90%) scale(1.15)}65%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-50%,-70%) scale(1)}}
@media (prefers-reduced-motion:reduce){.bub,.bub.no,.hero{animation:none}.bub.pop{animation:none;opacity:0}}
</style>
<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Bubble Pop Friends</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6L12 16.6 6.5 19.6l1.2-6L3.2 9.4l6.1-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="count">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="round" id="round" aria-hidden="true"></div>
    <div class="find" id="find"><div class="pic" id="pic"></div><b id="ask"></b></div>
    <div class="sea" id="sea"></div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas class="hero" id="introArt" width="400" height="280" style="position:static;animation:none;transform:none;pointer-events:auto"></canvas>
    <h2 data-t="introH">Pop the right bubble!</h2>
    <p data-t="introP">Look at the toy friend at the top, then tap the bubble that holds it.</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's pop!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH">Pop pop hooray!</h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
"use strict";
K.words.en = { title: "Bubble Pop Friends", back: "Back", sound: "Sound on or off", introH: "Pop the right bubble!", introP: "Look at the toy friend at the top, then tap the bubble that holds it.", start: "Let's pop!", again: "Play again", home: "More games",
  find: n => "Pop the " + n + "!", no: "Try another bubble!", yay: n => "You found the " + n + "!", overH: s => s >= 3 ? "Pop pop hooray!" : s >= 2 ? "Well done!" : "All popped!", overP: n => "You popped " + n + " bubbles and found every friend." };
K.words.vi = { title: "Bong Bóng Bạn Đồ Chơi", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", introH: "Chọc đúng bong bóng nhé!", introP: "Nhìn bạn đồ chơi ở trên cùng, rồi chạm vào bong bóng có bạn ấy.", start: "Chọc bóng thôi!", again: "Chơi lại", home: "Trò khác",
  find: n => "Chọc bóng có " + n + "!", no: "Thử bong bóng khác nhé!", yay: n => "Bé tìm được " + n + " rồi!", overH: s => s >= 3 ? "Giỏi quá đi!" : s >= 2 ? "Tuyệt vời!" : "Chọc xong hết rồi!", overP: n => "Bé đã chọc " + n + " bong bóng và tìm đủ các bạn." };

const COUNTS = [2, 3, 3, 4, 4, 5];
let toys = [], round = 0, target = null, wrongs = 0, totalWrong = 0, running = false, locked = false, popped = 0;
function pick(a, n) { return a.slice().sort(() => Math.random() - .5).slice(0, n); }
function imgOf(t) { const i = document.createElement("img"); i.src = t.img.src; i.alt = ""; i.draggable = false; return i; }
function deal() {
  const n = Math.min(COUNTS[round], toys.length), set = pick(toys, n); target = set[0]; wrongs = 0; locked = false;
  document.getElementById("round").innerHTML = COUNTS.map((_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join("");
  const pic = document.getElementById("pic"); pic.innerHTML = ""; pic.appendChild(imgOf(target));
  document.getElementById("ask").textContent = K.t("find", K.toyName(target));
  const sea = document.getElementById("sea"); sea.innerHTML = "";
  const W = sea.clientWidth, H = sea.clientHeight, cols = 2, rows = Math.ceil(set.length / cols);
  const size = Math.max(70, Math.min(W / 2 - 22, H / rows - 16, 128));
  const slots = pick([...Array(cols * rows).keys()], set.length);
  pick(set, set.length).forEach((t, i) => {
    const s = slots[i], c = s % cols, r = Math.floor(s / cols), b = document.createElement("button");
    b.type = "button"; b.className = "bub"; b.setAttribute("aria-label", K.toyName(t)); b.dataset.slug = t.slug;
    const cx = (c + 0.5) * W / cols + (Math.random() - .5) * 10, cy = (r + 0.5) * H / rows;
    b.style.cssText = `width:${size}px;height:${size}px;left:${cx - size / 2}px;top:${cy - size / 2}px;--d:${(2.8 + Math.random() * 1.6).toFixed(2)}s;--s:-${(Math.random() * 3).toFixed(2)}s`;
    b.appendChild(imgOf(t)); b.onclick = () => tap(t, b); sea.appendChild(b);
  });
}
function tap(t, b) {
  if (!running || locked) return;
  if (t === target) {
    locked = true; popped++; document.getElementById("count").textContent = popped; K.sfx.pop();
    const sea = document.getElementById("sea"), r = b.getBoundingClientRect(), s = sea.getBoundingClientRect();
    b.classList.add("pop"); setTimeout(() => b.classList.add("gone"), 340);
    const h = document.createElement("div"); h.className = "hero"; h.style.cssText = `width:${r.width}px;height:${r.height}px;left:${r.left - s.left + r.width / 2}px;top:${r.top - s.top + r.height / 2}px`; h.appendChild(imgOf(t)); sea.appendChild(h);
    document.getElementById("ask").textContent = K.t("yay", K.toyName(t));
    setTimeout(() => { K.sfx.chime(); if (!K.CALM) K.confetti(r.left + r.width / 2, r.top + r.height / 2, 36); }, 250);
    setTimeout(() => { if (round < COUNTS.length - 1) { round++; deal(); } else finish(); }, 1900);
  } else {
    wrongs++; totalWrong++; b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); K.sfx.thud();
    document.getElementById("ask").textContent = K.t("no");
    if (wrongs >= 3) { const g = document.querySelector(`#sea .bub[data-slug="${target.slug}"]`); if (g) g.classList.add("hint"); }
  }
}
function finish() {
  running = false; const stars = totalWrong <= 1 ? 3 : totalWrong <= 5 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", COUNTS.length);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start(list) { toys = list.filter(t => t.img); if (toys.length < 2) return; round = 0; popped = 0; totalWrong = 0; running = true; document.getElementById("count").textContent = "0"; document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; deal(); }

K.initBar(); K.onLang = () => { if (running && target && !locked) document.getElementById("ask").textContent = K.t("find", K.toyName(target)); }; K.applyWords();
function introArt(list) {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  const ts = (list || []).filter(t => t.img).slice(0, 3);
  ts.forEach((t, i) => { const cx = 90 + i * 110, cy = 140 + (i % 2 ? 20 : -10), r = 54;
    x.fillStyle = "rgba(190,230,255,.6)"; x.strokeStyle = K.INK; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.stroke();
    x.drawImage(t.img, cx - 36, cy - 36, 72, 72); x.fillStyle = "rgba(255,255,255,.9)"; x.beginPath(); x.arc(cx - 20, cy - 24, 7, 0, 7); x.fill(); });
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => introArt(list));
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
<!--TAIL-->
