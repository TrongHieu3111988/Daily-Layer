<title>Toy Memory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Toy Memory: flip two cards; if the toy friends match they stay up. Mismatches just flip back, nobody is scolded. */
.stage{display:flex;flex-direction:column;background:linear-gradient(#E9F6FF,#CDE9FF)}
:root[data-theme="dark"] .stage{background:linear-gradient(#202B4A,#2E3A63)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(#202B4A,#2E3A63)}}
.ask{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.ask h2{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.6vw,30px);margin:0;line-height:1.1}
.lvl{flex:none;font-family:var(--f-display);font-weight:800;font-size:16px;color:var(--muted)}
.table{flex:1;min-height:0;display:grid;place-items:center;padding:10px 12px 18px}
.grid{width:100%;max-width:520px;display:grid;gap:clamp(8px,2.4vw,14px)}
.card3{position:relative;aspect-ratio:3/4;padding:0;border:0;background:none;perspective:700px;touch-action:manipulation;cursor:pointer}
.in{position:absolute;inset:0;transition:transform .45s cubic-bezier(.34,1.3,.64,1);transform-style:preserve-3d}
.card3.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border:3px solid var(--outline);border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 5px 0 var(--outline);display:grid;place-items:center;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,#FF8B73 0 10px,#FF6B57 10px 20px)}
.back::after{content:"";width:34%;aspect-ratio:1;background:#FFC93C;border:3px solid var(--outline);clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.front{transform:rotateY(180deg);background:var(--paper)}
.front canvas{width:92%;height:auto;display:block}
.card3.match .front{background:#EAFBE9}
.card3.match .in{animation:hop .6s ease-in-out .35s}
.card3.hint .back{animation:nudge .9s ease-in-out 2}
@keyframes hop{30%{transform:rotateY(180deg) translateY(-14px) scale(1.05)}60%{transform:rotateY(180deg)}}
@keyframes nudge{50%{filter:brightness(1.18)}}
@media (prefers-reduced-motion:reduce){.in{transition:none}.card3.match .in,.card3.hint .back{animation:none}}
.endstars{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.endstars canvas{width:52px;height:52px}
</style>

<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Toy Memory</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#fff" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="starCount">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="ask"><h2 id="ask" data-t="ask">Find the twins!</h2><span class="lvl" id="lvl">Level 1</span></div>
    <div class="table"><div class="grid" id="grid" role="group" aria-labelledby="ask"></div></div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas class="hero" id="introArt" width="400" height="280"></canvas>
    <h2 data-t="introH">Find the twins!</h2>
    <p data-t="introP">Tap a card to flip it, then tap another. If the two toy friends are twins, they stay up. If not, they flip back and you try again.</p>
    <div class="row"><button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's play</span></button><button class="btn" type="button" id="restartBtn" hidden><span data-t="restart">Start over</span></button></div>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <div class="endstars" id="endStars"></div>
    <h2 id="endH">Yay!</h2>
    <p id="endP"></p>
    <div class="row"><button class="btn coral" type="button" id="nextBtn"><span data-t="next">Next round</span></button></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
"use strict";
K.words.en = { title: "Toy Memory", back: "Back", sound: "Sound on or off", ask: "Find the twins!", start: "Let's play", restart: "Start over",
  cont: n => "Keep going: level " + n, introH: "Find the twins!", introP: "Tap a card to flip it, then tap another. If the two toy friends are twins, they stay up. If not, they flip back and you try again.",
  level: n => "Level " + n, next: "Next round", endP: n => "You found all " + n + " pairs!", yay: ["Yay!", "Brilliant!", "Super memory!", "You did it!"], friend: "Card" };
K.words.vi = { title: "Lật Hình Đồ Chơi", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", ask: "Tìm đôi giống nhau!", start: "Chơi thôi", restart: "Chơi lại từ đầu",
  cont: n => "Chơi tiếp: màn " + n, introH: "Tìm đôi giống nhau!", introP: "Chạm vào một lá bài để lật, rồi chạm lá khác. Nếu hai bạn đồ chơi giống nhau thì được giữ lại. Nếu không, bài úp xuống và bé thử lại nhé.",
  level: n => "Màn " + n, next: "Vòng tiếp theo", endP: n => "Bé tìm được cả " + n + " đôi rồi!", yay: ["Hoan hô!", "Giỏi quá!", "Trí nhớ siêu đẳng!", "Bé làm được rồi!"], friend: "Lá bài" };

const FALLBACK = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2", "#FF8FB8"];
let faces = FALLBACK.slice();   // replaced by the shop's toys (slugs) once the library loads
const SHAPES = ["ball", "square", "dome"];
function shuffle(a, R = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

function faceCanvas(face, px) {
  const c = document.createElement("canvas"), d = Math.min(devicePixelRatio || 1, 2.5); c.width = c.height = Math.round(px * d);
  const g = c.getContext("2d"); g.scale(d, d); const s = px * 0.74;
  g.translate(px / 2, px / 2 + px * 0.02); K.friend(g, { shape: face.shape, colour: face.colour, w: s, h: s * (face.shape === "dome" ? 0.82 : 1), mood: "happy", lw: Math.max(2, px * 0.035) });
  return c;
}

let level = K.store.get("memory-level", 1), stars = K.store.get("memory-stars", 0), cards = [], open = [], matched = 0, tries = 0, busy = false, pairs = 3;
function layout(n) { return n === 6 ? 3 : n === 8 ? 4 : 4; }
function newRound() {
  pairs = [3, 3, 4, 4, 6, 6][(level - 1) % 6];
  const pool = shuffle(faces).slice(0, pairs);
  const picks = pool.map((c, i) => ({ colour: c, shape: SHAPES[i % SHAPES.length], id: i }));
  cards = shuffle(picks.concat(picks).map((p, k) => ({ ...p, k })));
  open = []; matched = 0; tries = 0; busy = false;
  const grid = document.getElementById("grid"); grid.innerHTML = "";
  const cols = layout(cards.length); grid.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`;
  grid.style.maxWidth = cards.length === 6 ? "400px" : cards.length === 8 ? "460px" : "440px";
  cards.forEach((c, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "card3"; b.dataset.i = i;
    b.setAttribute("aria-label", K.t("friend") + " " + (i + 1));
    b.innerHTML = '<div class="in"><div class="face back"></div><div class="face front"></div></div>';
    b.querySelector(".front").appendChild(faceCanvas(c, 120));
    b.onclick = () => flip(i);
    grid.appendChild(b);
  });
  document.getElementById("lvl").textContent = K.t("level", level);
  document.getElementById("starCount").textContent = stars;
}
function el(i) { return document.querySelector(`.card3[data-i="${i}"]`); }
function flip(i) {
  if (busy || open.includes(i) || el(i).classList.contains("match")) return;
  el(i).classList.add("up"); K.sfx.pop(); open.push(i);
  if (open.length < 2) return;
  tries++; busy = true;
  const [a, b] = open;
  if (cards[a].id === cards[b].id) {
    setTimeout(() => {
      [a, b].forEach(x => el(x).classList.add("match")); K.sfx.chime();
      const r = el(b).getBoundingClientRect(); K.confetti(r.left + r.width / 2, r.top + r.height / 2, 22);
      matched++; open = []; busy = false;
      if (matched === pairs) setTimeout(win, 900);
    }, 450);
  } else {
    setTimeout(() => { [a, b].forEach(x => el(x).classList.remove("up")); K.sfx.tick(); open = []; busy = false; }, 1000);
  }
}
function win() {
  const extra = tries - pairs, got = extra <= pairs / 2 ? 3 : extra <= pairs * 1.5 ? 2 : 1;   // always at least one star
  stars += got; level++; K.store.set("memory-level", level); K.store.set("memory-stars", stars);
  document.getElementById("starCount").textContent = stars;
  const es = document.getElementById("endStars"); es.innerHTML = "";
  for (let s = 0; s < 3; s++) { const c = document.createElement("canvas"); c.width = c.height = 104; K.star(c.getContext("2d"), 52, 52, 40, s < got ? "#FFC93C" : "#D9DEEA"); es.appendChild(c); }
  const y = K.t("yay"); document.getElementById("endH").textContent = y[(Math.random() * y.length) | 0];
  document.getElementById("endP").textContent = K.t("endP", pairs);
  K.sfx.tada(); K.confetti();
  document.getElementById("end").hidden = false;
}
K.initBar();
K.onLang = () => { document.getElementById("lvl").textContent = K.t("level", level); const s = document.getElementById("startBtn").firstChild; s.textContent = level > 1 ? K.t("cont", level) : K.t("start"); document.getElementById("restartBtn").hidden = level <= 1; };
K.applyWords();
(function introArt() {
  const c = document.getElementById("introArt"), x = c.getContext("2d");
  const cols = ["#FF6B57", "#5DB8FF", "#3FBF7F", "#FFC93C"];
  [[0, 1], [1, 1], [2, 0], [3, 0]].forEach(([i, up]) => {
    x.save(); x.translate(26 + i * 92, 70);
    x.fillStyle = up ? "#fff" : "#FF6B57"; x.strokeStyle = "#1B2547"; x.lineWidth = 5; x.beginPath(); x.roundRect(0, 0, 78, 104, 14); x.fill(); x.stroke();
    if (up) { x.translate(39, 56); K.friend(x, { shape: "ball", colour: cols[i % 2 ? 1 : 0], w: 56, h: 56, lw: 4 }); } else K.star(x, 39, 52, 16);
    x.restore();
  });
  K.star(x, 60, 40, 16); K.star(x, 340, 36, 12, "#FF8FB8");
})();
const libReady = K.library().then(list => { if (list.length >= 6) faces = list.map(t => t.slug); });
const begin = async () => { K.sfx.pop(); document.getElementById("intro").hidden = true; await libReady; newRound(); };
document.getElementById("startBtn").onclick = begin;
document.getElementById("restartBtn").onclick = () => { level = 1; stars = 0; K.store.set("memory-level", 1); K.store.set("memory-stars", 0); begin(); };
document.getElementById("nextBtn").onclick = () => { document.getElementById("end").hidden = true; K.sfx.pop(); newRound(); };
</script>
<!--TAIL-->
