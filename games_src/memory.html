<title>Toy Memory</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Toy Memory: flip two cards, find the matching toy friends. 3 pairs, then 4, then 6. */
.stage{background:linear-gradient(#FFF1D6,#FFE2EC);display:flex;flex-direction:column}
:root[data-theme="dark"] .stage{background:linear-gradient(#1B1F44,#2A1B3F)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(#1B1F44,#2A1B3F)}}
.round{display:flex;justify-content:center;gap:8px;padding:12px 12px 0}
.round i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--outline);background:var(--paper)}
.round i.on{background:var(--grass)}.round i.now{background:var(--sun)}
.board{flex:1;min-height:0;display:grid;gap:10px;padding:12px;align-content:center;justify-content:center}
.cardx{position:relative;border:0;padding:0;background:none;cursor:pointer;perspective:700px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cardx .in{position:absolute;inset:0;transition:transform .38s cubic-bezier(.3,1.3,.6,1);transform-style:preserve-3d}
.cardx.up .in,.cardx.done .in{transform:rotateY(180deg)}
.cardx .face{position:absolute;inset:0;border:3px solid var(--outline);border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 0 var(--outline);display:grid;place-items:center;overflow:hidden}
.cardx .back{background:var(--sky,#5DB8FF);background-image:radial-gradient(circle at 25% 25%,rgba(255,255,255,.35) 0 9%,transparent 10%),radial-gradient(circle at 75% 70%,rgba(255,255,255,.25) 0 7%,transparent 8%)}
.cardx .back svg{width:52%;height:52%}
.cardx .front{transform:rotateY(180deg);background:var(--paper)}
.cardx .front canvas{width:100%;height:100%;display:block}
.cardx.done .front{border-color:var(--grass);box-shadow:0 4px 0 var(--grass)}
.cardx.done{animation:hop .5s ease}
.cardx.hint .in{animation:wig .5s ease 2}
@keyframes hop{40%{transform:translateY(-10px) scale(1.05)}}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.cardx .in{transition:none}.cardx.done,.cardx.hint .in{animation:none}}
.tap{text-align:center;padding:0 12px 12px;font-weight:800;font-size:14px;color:var(--muted)}
</style>

<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Toy Memory</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="9" height="14" rx="2.5" fill="#5DB8FF" stroke="#1B2547" stroke-width="2"/><rect x="12.5" y="5" width="9" height="14" rx="2.5" fill="#FFC93C" stroke="#1B2547" stroke-width="2"/></svg><span id="count">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="round" id="round" aria-hidden="true"></div>
    <div class="board" id="board" role="grid" aria-label="Cards"></div>
    <div class="tap" id="tapHint" data-t="tap">Tap two cards!</div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas class="hero" id="introArt" width="400" height="280"></canvas>
    <h2 data-t="introH">Find the twins!</h2>
    <p data-t="introP">Every toy friend has a twin hiding under a card. Tap two cards to peek. Same friends? They stay up and cheer!</p>
    <p id="bestLine"></p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's play!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH">All twins found!</h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
"use strict";
K.words.en = { title: "Toy Memory", back: "Back", sound: "Sound on or off", tap: "Tap two cards!", introH: "Find the twins!",
  introP: "Every toy friend has a twin hiding under a card. Tap two cards to peek. Same friends? They stay up and cheer!", start: "Let's play!", again: "Play again", home: "More games",
  match: name => name + "! A pair!", next: "More cards!", miss: "Not twins. Try again!", best: n => "Your best: " + n + " peeks",
  overH: s => s >= 3 ? "Super memory!" : s >= 2 ? "Great memory!" : "All twins found!", overP: (n, b) => "You found 13 pairs with " + n + " peeks." + (n <= b ? " New best!" : " Best: " + b + " peeks.") };
K.words.vi = { title: "Lật Hình", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", tap: "Chạm vào hai thẻ!", introH: "Tìm bạn sinh đôi!",
  introP: "Mỗi bạn đồ chơi có một bạn sinh đôi trốn dưới thẻ. Chạm hai thẻ để xem. Giống nhau thì hai bạn ở lại và reo vui!", start: "Chơi thôi!", again: "Chơi lại", home: "Trò khác",
  match: name => name + "! Đúng cặp rồi!", next: "Thêm thẻ nào!", miss: "Chưa giống. Thử lại nhé!", best: n => "Kỷ lục của bé: " + n + " lượt",
  overH: s => s >= 3 ? "Trí nhớ siêu đỉnh!" : s >= 2 ? "Nhớ giỏi lắm!" : "Tìm đủ cặp rồi!", overP: (n, b) => "Bé tìm được 13 cặp sau " + n + " lượt lật." + (n <= b ? " Kỷ lục mới!" : " Kỷ lục: " + b + " lượt.") };

const ROUNDS = [3, 4, 6];                       // pairs per round: 6, 8, then 12 cards
const PAINTED = ["#FF6B57", "#FFC93C", "#3FBF7F", "#5DB8FF", "#8C6BF2", "#FF8FB8", "#FF9B3D", "#B8834F"];
let toys = [], round = 0, cards = [], open = [], busy = false, found = 0, peeks = 0, misses = 0, total = 0, best = K.store.get("memory-best", 0), running = false;
const board = document.getElementById("board");
const BACK_SVG = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4l4.7 9.6 10.6 1.5-7.7 7.4 1.8 10.5L20 28l-9.4 5 1.8-10.5-7.7-7.4 10.6-1.5z" fill="#fff" stroke="#1B2547" stroke-width="2.6" stroke-linejoin="round"/></svg>';

let toastT = 0;
function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (e.hidden = true), 1500); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

// the picture on a card: the toy's own sticker from the library, or a painted friend when offline
function paintFace(c, item) {
  const r = c.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
  c.width = Math.max(40, Math.round(r.width * d)); c.height = Math.max(40, Math.round(r.height * d));
  const g = c.getContext("2d"), W = c.width, H = c.height;
  g.fillStyle = item.toy ? item.toy.colour + "33" : item.colour + "33"; g.fillRect(0, 0, W, H);
  if (item.toy && item.toy.img) {
    const s = Math.min(W, H) * 0.86, im = item.toy.img, k = s / Math.max(im.width, im.height);
    g.drawImage(im, (W - im.width * k) / 2, (H - im.height * k) / 2, im.width * k, im.height * k);
  } else {
    const s = Math.min(W, H) / 90; g.save(); g.translate(W / 2, H / 2); g.scale(s, s);
    K.friend(g, { shape: "square", w: 62, h: 62, colour: item.toy ? item.toy.slug : item.colour, mood: "happy", lw: 3.5 }); g.restore();
  }
}
function layout() {
  const n = cards.length; if (!n) return;
  const W = board.clientWidth - 24, H = board.clientHeight - 24;
  let bestCols = 2, bestSize = 0;
  for (let cols = 2; cols <= 4; cols++) {
    const rows = Math.ceil(n / cols), size = Math.min((W - (cols - 1) * 10) / cols, ((H - (rows - 1) * 10) / rows) / 1.2);
    if (size > bestSize) { bestSize = size; bestCols = cols; }
  }
  const w = Math.max(48, Math.floor(Math.min(bestSize, 150)));
  board.style.gridTemplateColumns = `repeat(${bestCols}, ${w}px)`; board.style.gridAutoRows = Math.round(w * 1.2) + "px";
  requestAnimationFrame(() => cards.forEach(c => paintFace(c.el.querySelector("canvas"), c.item)));
}
addEventListener("resize", layout);

function deal() {
  const pairs = ROUNDS[round];
  const pool = toys.length >= pairs ? shuffle(toys.slice()).slice(0, pairs).map(t => ({ key: t.slug, toy: t }))
                                    : shuffle(PAINTED.slice()).slice(0, pairs).map(c => ({ key: c, colour: c }));
  cards = shuffle([...pool, ...pool].map(item => ({ item })));
  open = []; busy = false; misses = 0;
  board.innerHTML = "";
  cards.forEach((c, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "cardx"; b.setAttribute("aria-label", "Card " + (i + 1));
    b.innerHTML = `<div class="in"><div class="face back">${BACK_SVG}</div><div class="face front"><canvas></canvas></div></div>`;
    b.addEventListener("click", () => flip(c)); c.el = b; board.appendChild(b);
  });
  document.getElementById("round").innerHTML = ROUNDS.map((_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join("");
  layout();
}
function flip(c) {
  if (!running || busy || c.up || c.done) return;
  c.up = true; c.el.classList.add("up"); K.sfx.pop(); open.push(c);
  document.getElementById("tapHint").hidden = true;
  if (open.length < 2) return;
  peeks++; busy = true;
  const [a, b] = open;
  if (a.item.key === b.item.key) {
    setTimeout(() => {
      a.done = b.done = true; a.el.classList.add("done"); b.el.classList.add("done"); a.el.setAttribute("aria-label", nameOf(a.item)); b.el.setAttribute("aria-label", nameOf(b.item));
      found++; total++; document.getElementById("count").textContent = total; K.sfx.tada ? K.sfx.tada() : K.sfx.pop();
      toast(K.t("match", nameOf(a.item))); misses = 0;
      const r = b.el.getBoundingClientRect(); if (!K.CALM) K.confetti(r.left + r.width / 2, r.top + r.height / 2, 28);
      open = []; busy = false;
      if (cards.every(x => x.done)) roundDone();
    }, 380);
  } else {
    misses++;
    setTimeout(() => {
      a.up = b.up = false; a.el.classList.remove("up"); b.el.classList.remove("up"); open = []; busy = false;
      if (misses >= 3) hint();   // gentle help for small hands: a pair wiggles
    }, 1100);
  }
}
function nameOf(item) { return item.toy ? K.toyName(item.toy) : "★"; }
function hint() {
  const left = cards.filter(x => !x.done); if (!left.length) return;
  const key = left[0].item.key; misses = 0;
  for (const x of left) if (x.item.key === key) { x.el.classList.remove("hint"); void x.el.offsetWidth; x.el.classList.add("hint"); setTimeout(() => x.el.classList.remove("hint"), 1100); }
}
function roundDone() {
  if (round < ROUNDS.length - 1) {
    setTimeout(() => { K.confetti(); toast(K.t("next")); round++; deal(); }, 900);
  } else {
    running = false;
    const newBest = !best || peeks < best; if (newBest) { best = peeks; K.store.set("memory-best", best); }
    const stars = peeks <= 22 ? 3 : peeks <= 32 ? 2 : 1;
    document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
    document.getElementById("overH").textContent = K.t("overH", stars);
    document.getElementById("overP").textContent = K.t("overP", peeks, best);
    setTimeout(() => { document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus(); }, 900);
  }
}
function start() {
  round = 0; found = 0; total = 0; peeks = 0; running = true; document.getElementById("count").textContent = "0";
  document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true;
  document.getElementById("tapHint").hidden = false; deal();
}

/* ---------- boot ---------- */
K.initBar();
K.onLang = () => { document.getElementById("bestLine").textContent = best ? K.t("best", best) : ""; };
K.applyWords();
function introArt() {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  const pics = toys.length >= 2 ? [toys[0], toys[1]] : [];
  const draw = (cx, cy, rot, up, i) => {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    x.fillStyle = up ? "#FFFFFF" : "#5DB8FF"; x.strokeStyle = K.INK; x.lineWidth = 5;
    x.beginPath(); x.roundRect(-55, -68, 110, 136, 18); x.fill(); x.stroke();
    if (up) {
      const t = pics[i % 2];
      if (t && t.img) x.drawImage(t.img, -48, -48, 96, 96);
      else { x.scale(1.1, 1.1); K.friend(x, { shape: "square", w: 62, h: 62, colour: PAINTED[i % 2], mood: "happy", lw: 3.5 }); }
    } else K.star(x, 0, 0, 26, "#FFFFFF");
    x.restore();
  };
  draw(80, 150, -0.15, true, 0); draw(165, 140, -0.05, false, 0); draw(245, 140, 0.05, true, 0); draw(325, 150, 0.15, false, 1);
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
// every model in the shop's library becomes a card (the painted friends stand in when it can't load)
K.library().then(list => { toys = list.filter(t => t.img); introArt(); });
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
