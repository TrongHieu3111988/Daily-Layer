<title>Peekaboo Cups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/*KITCSS*/
/* Peekaboo Cups: toy friends hide under cups; tap the cup the named friend is under. */
.stage{background:linear-gradient(#FFE9C7,#FFF6E6 55%,#F3D9B8);display:flex;flex-direction:column;align-items:center;overflow:hidden}
:root[data-theme="dark"] .stage{background:linear-gradient(#2A2140,#3A2C4F 55%,#2B2238)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stage{background:linear-gradient(#2A2140,#3A2C4F 55%,#2B2238)}}
.round{display:flex;justify-content:center;gap:8px;padding:10px 12px 0}
.round i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--outline);background:var(--paper)}
.round i.on{background:var(--grass)}.round i.now{background:var(--sun)}
.find{display:flex;align-items:center;gap:12px;margin:10px 14px 0;padding:8px 16px 8px 10px;background:var(--paper);border:3px solid var(--outline);border-radius:26px;box-shadow:var(--pop-sm);min-height:92px}
.find .pic{width:72px;height:72px;flex:none}.find .pic img{width:100%;height:100%;object-fit:contain;display:block}
.find .pic:empty{display:none}
.find:has(#ask:empty){visibility:hidden}
.find b{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;line-height:1.15;color:var(--outline)}
.table{position:relative;flex:1;min-height:0;width:100%}
.cloth{position:absolute;left:4%;right:4%;bottom:12%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#FF9E8A,#E8705C);border:3px solid rgba(27,37,71,.5);opacity:.85}
:root[data-theme="dark"] .cloth{opacity:.6}
.spot{position:absolute;padding:0;border:0;background:none;touch-action:manipulation;transition:left .7s cubic-bezier(.5,0,.3,1),top .7s cubic-bezier(.5,0,.3,1)}
.spot .toy{position:absolute;left:8%;right:8%;bottom:0;height:84%;transition:transform .3s}
.spot .toy img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block;pointer-events:none}
.spot .cup{position:absolute;left:-4%;right:-4%;bottom:-2%;height:104%;transform:translateY(-130%);transition:transform .45s cubic-bezier(.4,1.4,.6,1),opacity .2s;pointer-events:none}
.spot .cup svg{width:100%;height:100%;display:block;overflow:visible}
.spot .cup{opacity:0}
.spot.down .cup,.spot.up .cup{opacity:1}
.spot.down .cup{transform:translateY(0)}
.spot.down .toy{visibility:hidden;transition:visibility 0s .4s}
.spot.up .toy,.spot.peek .toy,.spot.hint .toy{visibility:visible;transition:none}
.spot.peek .cup{transform:translateY(-22%) rotate(-6deg)}
.spot.up .cup{transform:translateY(-78%)}
.spot.hint .cup{animation:wig .7s ease-in-out infinite}
.spot.hint .cup svg{filter:drop-shadow(0 0 8px #FFC93C) drop-shadow(0 0 4px #FFC93C)}
.spot.hop .toy{animation:hop .8s ease}
.spot.no .cup{animation:shk .4s ease}
@keyframes wig{0%,100%{transform:translateY(-10%) rotate(-5deg)}50%{transform:translateY(-10%) rotate(5deg)}}
@keyframes shk{0%,100%{transform:translateY(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-34%) scale(1.08)}70%{transform:translateY(0) scale(.96,1.04)}}
@media (prefers-reduced-motion:reduce){.spot,.spot .cup{transition:none}.spot.hint .cup,.spot.hop .toy,.spot.no .cup{animation:none}}
</style>
<div class="app">
  <header class="bar">
    <a class="ibtn" id="back" href="/" data-t-label="back" aria-label="Back"></a>
    <h1 data-t="title">Peekaboo Cups</h1>
    <span class="score" aria-live="polite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6L12 16.6 6.5 19.6l1.2-6L3.2 9.4l6.1-.8z" fill="#FFC93C" stroke="#1B2547" stroke-width="2" stroke-linejoin="round"/></svg><span id="count">0</span></span>
    <button class="ibtn" id="soundBtn" type="button" data-t-label="sound" aria-label="Sound"></button>
    <button class="ibtn" id="langBtn" type="button" aria-label="Language">VI</button>
  </header>
  <main class="stage" id="stage">
    <div class="round" id="round" aria-hidden="true"></div>
    <div class="find" id="find"><div class="pic" id="pic"></div><b id="ask" aria-live="polite"></b></div>
    <div class="table" id="table"><div class="cloth"></div></div>
  </main>
</div>

<div class="overlay" id="intro">
  <div class="card">
    <canvas id="introArt" width="400" height="260" style="width:100%;max-width:320px;height:auto"></canvas>
    <h2 data-t="introH">Peekaboo!</h2>
    <p data-t="introP">Watch the toy friends hide under the cups, then tap the cup where your friend is hiding.</p>
    <button class="btn coral" type="button" id="startBtn"><span data-t="start">Let's peek!</span></button>
  </div>
</div>
<div class="overlay" id="over" hidden>
  <div class="card">
    <div class="stars" id="stars"></div>
    <h2 id="overH">Peekaboo, found you!</h2>
    <p id="overP"></p>
    <div class="row"><button class="btn coral" type="button" id="againBtn"><span data-t="again">Play again</span></button><a class="btn" id="homeBtn" href="/" data-t="home">More games</a></div>
  </div>
</div>

<script>/*KITJS*/</script>
<script>
"use strict";
K.words.en = { title: "Peekaboo Cups", back: "Back", sound: "Sound on or off", introH: "Peekaboo!", introP: "Watch the toy friends hide under the cups, then tap the cup where your friend is hiding.", start: "Let's peek!", again: "Play again", home: "More games",
  look: "Look who is here!", hide: "Hide, friends, hide!", mix: "Watch the cups!", find: n => "Where is the " + n + "?", no: n => "That's the " + n + ". Try another cup!", yay: n => "Peekaboo, " + n + "!",
  overH: s => s >= 3 ? "Peekaboo, found you!" : s >= 2 ? "Great finding!" : "You found them all!", overP: n => "You found " + n + " hiding friends." };
K.words.vi = { title: "Ú Òa Chiếc Cốc", back: "Quay lại", sound: "Bật hoặc tắt âm thanh", introH: "Ú òa!", introP: "Nhìn các bạn đồ chơi trốn dưới cốc, rồi chạm vào cốc có bạn của bé.", start: "Chơi ú òa!", again: "Chơi lại", home: "Trò khác",
  look: "Ai đây nhỉ?", hide: "Trốn đi các bạn ơi!", mix: "Nhìn kỹ các cốc nhé!", find: n => n + " trốn ở đâu?", no: n => "Đó là " + n + ". Thử cốc khác nhé!", yay: n => "Ú òa, " + n + "!",
  overH: s => s >= 3 ? "Ú òa, tìm thấy rồi!" : s >= 2 ? "Bé tìm giỏi lắm!" : "Bé tìm được hết rồi!", overP: n => "Bé đã tìm được " + n + " bạn đang trốn." };

// cups per round, and how many slow swaps the cups make once they are down (none at first)
const ROUNDS = [[2, 0], [3, 0], [3, 1], [3, 1], [4, 1], [4, 2]];
const CUPS = ["#FF6B57", "#5DB8FF", "#3FBF7F", "#FFC93C", "#8C6BF2"];
let toys = [], round = 0, target = null, wrongs = 0, totalWrong = 0, running = false, locked = true, found = 0, spots = [], timers = [];
const wait = ms => new Promise(r => timers.push(setTimeout(r, K.CALM ? Math.min(ms, 400) : ms)));
function pick(a, n) { return a.slice().sort(() => Math.random() - .5).slice(0, n); }
function imgOf(t) { const i = document.createElement("img"); i.src = t.img.src; i.alt = ""; i.draggable = false; return i; }
function cupSVG(col) {
  return `<svg viewBox="0 0 100 110" aria-hidden="true"><path d="M14 104 L24 14 Q50 4 76 14 L86 104 Z" fill="${col}" stroke="#1B2547" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="50" cy="104" rx="36" ry="7" fill="${col}" stroke="#1B2547" stroke-width="5"/><path d="M28 30 Q34 26 34 60" stroke="rgba(255,255,255,.55)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="52" cy="44" r="6" fill="rgba(255,255,255,.75)"/><circle cx="64" cy="70" r="6" fill="rgba(255,255,255,.75)"/><circle cx="42" cy="82" r="6" fill="rgba(255,255,255,.75)"/>
  <ellipse cx="50" cy="12" rx="12" ry="5" fill="#fff" stroke="#1B2547" stroke-width="4"/></svg>`;
}
function say(k, ...a) { document.getElementById("ask").textContent = K.t(k, ...a); }
function layout() {
  const tb = document.getElementById("table"), W = tb.clientWidth, H = tb.clientHeight, n = spots.length;
  const size = Math.max(70, Math.min((W - 24) / n - 12, H * 0.5, 150));
  spots.forEach(s => { const cx = (s.pos + 0.5) * W / n; s.el.style.width = size + "px"; s.el.style.height = size * 1.1 + "px"; s.el.style.left = (cx - size / 2) + "px"; s.el.style.top = (H * 0.72 - size * 1.1) + "px"; });
}
async function deal() {
  const [n, swaps] = ROUNDS[round], set = pick(toys, Math.min(n, toys.length)); target = set[Math.floor(Math.random() * set.length)]; wrongs = 0; locked = true;
  document.getElementById("round").innerHTML = ROUNDS.map((_, i) => `<i class="${i < round ? "on" : i === round ? "now" : ""}"></i>`).join("");
  document.getElementById("pic").innerHTML = ""; say("look");
  const tb = document.getElementById("table"); tb.querySelectorAll(".spot").forEach(e => e.remove());
  const cols = pick(CUPS, set.length);
  spots = set.map((t, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "spot"; b.dataset.slug = t.slug; b.setAttribute("aria-label", K.t("title") + " " + (i + 1));
    const toy = document.createElement("div"); toy.className = "toy"; toy.appendChild(imgOf(t));
    const cup = document.createElement("div"); cup.className = "cup"; cup.innerHTML = cupSVG(cols[i]);
    b.append(toy, cup); tb.appendChild(b); const s = { el: b, toy: t, pos: i }; b.onclick = () => tap(s); return s;
  });
  layout();
  await wait(1700); if (!running) return;
  say("hide"); K.sfx.boing();
  for (const s of spots) { s.el.classList.add("down"); K.sfx.thud(); await wait(260); }
  await wait(500);
  if (swaps && !K.CALM) {
    say("mix");
    for (let k = 0; k < swaps; k++) {
      const [a, b] = pick(spots, 2); [a.pos, b.pos] = [b.pos, a.pos]; K.sfx.tick(); layout(); await wait(950); if (!running) return;
    }
  }
  const pic = document.getElementById("pic"); pic.appendChild(imgOf(target)); say("find", K.toyName(target)); locked = false;
}
async function tap(s) {
  if (!running || locked) return;
  locked = true; s.el.classList.remove("peek", "hint");
  if (s.toy === target) {
    found++; document.getElementById("count").textContent = found; s.el.classList.add("up"); K.sfx.pop();
    say("yay", K.toyName(target));
    await wait(300); s.el.classList.add("hop"); K.sfx.chime();
    const r = s.el.getBoundingClientRect(); if (!K.CALM) K.confetti(r.left + r.width / 2, r.top + r.height / 2, 36);
    await wait(700); spots.forEach(o => o.el.classList.add("up")); await wait(1200); if (!running) return;
    if (round < ROUNDS.length - 1) { round++; deal(); } else finish();
  } else {
    wrongs++; totalWrong++; s.el.classList.add("up"); K.sfx.boing(); say("no", K.toyName(s.toy));
    await wait(1300); s.el.classList.remove("up"); K.sfx.thud(); await wait(450);
    if (!running) return;
    const g = spots.find(o => o.toy === target);
    if (wrongs >= 2) g.el.classList.add("hint"); else if (wrongs >= 1) { g.el.classList.add("peek"); }
    say("find", K.toyName(target)); locked = false;
  }
}
function finish() {
  running = false; const stars = totalWrong <= 1 ? 3 : totalWrong <= 4 ? 2 : 1;
  document.getElementById("stars").innerHTML = [0, 1, 2].map(i => K.starSVG(i < stars)).join("");
  document.getElementById("overH").textContent = K.t("overH", stars); document.getElementById("overP").textContent = K.t("overP", found);
  document.getElementById("over").hidden = false; K.sfx.tada(); K.confetti(); document.getElementById("againBtn").focus();
}
function start(list) {
  toys = list.filter(t => t.img); if (toys.length < 2) return;
  timers.forEach(clearTimeout); timers = [];
  round = 0; found = 0; totalWrong = 0; running = true; document.getElementById("count").textContent = "0";
  document.getElementById("intro").hidden = true; document.getElementById("over").hidden = true; deal();
}
addEventListener("resize", () => { if (spots.length) layout(); });
K.initBar(); K.onLang = () => { if (running && target && !locked) say("find", K.toyName(target)); }; K.applyWords();
function introArt(list) {
  const c = document.getElementById("introArt"), x = c.getContext("2d"); x.clearRect(0, 0, c.width, c.height);
  x.fillStyle = "#F08A74"; x.beginPath(); x.ellipse(200, 222, 180, 30, 0, 0, 7); x.fill();
  const ts = (list || []).filter(t => t.img).slice(0, 3);
  [0, 1, 2].forEach(i => { const cx = 80 + i * 120, by = 222, lift = i === 1 ? 92 : 0, col = CUPS[i];
    if (i === 1 && ts[0]) x.drawImage(ts[0].img, cx - 48, by - 100, 96, 96);
    x.save(); x.translate(cx, by - lift); if (i === 1) x.rotate(-0.12);
    x.fillStyle = col; x.strokeStyle = K.INK; x.lineWidth = 5; x.lineJoin = "round";
    x.beginPath(); x.moveTo(-44, 0); x.lineTo(-32, -96); x.quadraticCurveTo(0, -108, 32, -96); x.lineTo(44, 0); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = "rgba(255,255,255,.75)"; [[4, -60], [16, -32], [-10, -18]].forEach(([a, b]) => { x.beginPath(); x.arc(a, b, 6, 0, 7); x.fill(); });
    x.restore(); });
}
introArt();
document.getElementById("homeBtn").href = window.SHOP_URL ? window.SHOP_URL + (window.SHOP_URL.includes("#") ? "" : "#play") : "/#play";
K.library().then(list => introArt(list));
document.getElementById("startBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
document.getElementById("againBtn").onclick = () => { K.sfx.pop(); K.library().then(start); };
</script>
